		if (elm.expos !== void) {
			var posName = elm.expos;
			removeTagParam(elm, "expos");
			for (var i=targets.count-1;i>=0;i--) {
				var target = targets[i];
				if (target instanceof "KAGEnvImage" && target.posName == posName) {
