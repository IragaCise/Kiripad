    // トランジションモード
	var transMode;
	var transType;

	// 自動トランジションが有効かどうか
	property enableAutoTrans {
		getter() { return !transMode || transType == 0; }
	}

	function getTransObject(name) {
		return world.getTransObject(name);
	}

	function copyTransParam(tr, elm) {
		world.copyTransParam(tr, elm);
