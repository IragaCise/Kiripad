name: Build KiriPad Phase 2A.3 Runtime

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "KrKr2-Next git ref (branch/tag/commit)"
        required: true
        default: "main"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  runtime-ios:
    name: Experimental runtime unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout KiriPad
        uses: actions/checkout@v4

      - name: Setup Flutter (required by upstream iOS build script)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install upstream build prerequisites
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail

          # KrKr2-Next uses vcpkg host tools while cross-compiling for iOS.
          # gperf's current vcpkg port requires GNU autotools on macOS, and
          # the upstream CMake configuration uses Ninja.
          brew install ninja autoconf automake autoconf-archive libtool gettext pkgconf

          BREW_PREFIX="$(brew --prefix)"
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          LIBTOOL_PREFIX="$(brew --prefix libtool)"
          AUTOCONF_ARCHIVE_PREFIX="$(brew --prefix autoconf-archive)"

          # gettext is keg-only on macOS/Homebrew and GNU libtool uses a gnubin
          # directory for unprefixed tool names. vcpkg's autoreconf subprocesses
          # need both locations explicitly.
          # Keep Apple's /usr/bin/libtool visible. KrKr2-Next later uses
          # `libtool -static`, which is the Apple tool. We only expose GNU
          # libtoolize through a tiny shim for autoreconf/vcpkg.
          TOOL_SHIMS="$RUNNER_TEMP/kiripad-tools"
          mkdir -p "$TOOL_SHIMS"
          if [[ -x "$LIBTOOL_PREFIX/bin/glibtoolize" ]]; then
            ln -sf "$LIBTOOL_PREFIX/bin/glibtoolize" "$TOOL_SHIMS/libtoolize"
          elif [[ -x "$LIBTOOL_PREFIX/libexec/gnubin/libtoolize" ]]; then
            ln -sf "$LIBTOOL_PREFIX/libexec/gnubin/libtoolize" "$TOOL_SHIMS/libtoolize"
          fi

          printf '%s\n' \
            "$TOOL_SHIMS" \
            "$GETTEXT_PREFIX/bin" \
            "$BREW_PREFIX/bin" >> "$GITHUB_PATH"

          ACLOCAL_COMBINED="$AUTOCONF_ARCHIVE_PREFIX/share/aclocal:$GETTEXT_PREFIX/share/aclocal:$LIBTOOL_PREFIX/share/aclocal:$BREW_PREFIX/share/aclocal"
          echo "ACLOCAL_PATH=$ACLOCAL_COMBINED" >> "$GITHUB_ENV"
          echo "KIRIPAD_TOOL_SHIMS=$TOOL_SHIMS" >> "$GITHUB_ENV"

          # Make the tools visible in this step as well as all following steps.
          export PATH="$TOOL_SHIMS:$GETTEXT_PREFIX/bin:$BREW_PREFIX/bin:$PATH"
          export ACLOCAL_PATH="$ACLOCAL_COMBINED${ACLOCAL_PATH:+:$ACLOCAL_PATH}"
          hash -r

          echo "Homebrew prefix: $BREW_PREFIX"
          echo "PATH: $PATH"
          echo "ACLOCAL_PATH: $ACLOCAL_PATH"
          command -v ninja
          ninja --version
          command -v autoconf
          autoconf --version | head -n 1
          command -v automake
          automake --version | head -n 1
          command -v aclocal
          aclocal --version | head -n 1
          command -v autoreconf
          command -v autopoint
          autopoint --version | head -n 1
          command -v libtoolize || command -v glibtoolize
          flutter --version

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-ios-${{ runner.os }}-${{ runner.arch }}-${{ inputs.engine_ref }}
          restore-keys: |
            vcpkg-ios-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch KrKr2-Next source
        shell: bash
        run: |
          rm -rf .engine-src
          mkdir -p .engine-src
          git clone --filter=blob:none https://github.com/reAAAq/KrKr2-Next.git .engine-src/KrKr2-Next
          cd .engine-src/KrKr2-Next
          git checkout "${{ inputs.engine_ref }}"
          git rev-parse HEAD | tee ../../engine-commit.txt
          printf 'Source: https://github.com/reAAAq/KrKr2-Next\nRef: %s\nCommit: %s\n' \
            "${{ inputs.engine_ref }}" "$(git rev-parse HEAD)" > ../../engine-source.txt

      - name: Build upstream iOS engine archives
        shell: bash
        run: |
          # Reassert Homebrew paths here so vcpkg/CMake subprocesses can see
          # the host build tools even if the runner image PATH changes.
          BREW_PREFIX="$(brew --prefix)"
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          LIBTOOL_PREFIX="$(brew --prefix libtool)"
          AUTOCONF_ARCHIVE_PREFIX="$(brew --prefix autoconf-archive)"
          TOOL_SHIMS="${KIRIPAD_TOOL_SHIMS:-$RUNNER_TEMP/kiripad-tools}"
          mkdir -p "$TOOL_SHIMS"
          if [[ ! -e "$TOOL_SHIMS/libtoolize" ]]; then
            if [[ -x "$LIBTOOL_PREFIX/bin/glibtoolize" ]]; then
              ln -sf "$LIBTOOL_PREFIX/bin/glibtoolize" "$TOOL_SHIMS/libtoolize"
            elif [[ -x "$LIBTOOL_PREFIX/libexec/gnubin/libtoolize" ]]; then
              ln -sf "$LIBTOOL_PREFIX/libexec/gnubin/libtoolize" "$TOOL_SHIMS/libtoolize"
            fi
          fi
          export PATH="$TOOL_SHIMS:$GETTEXT_PREFIX/bin:$BREW_PREFIX/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export ACLOCAL_PATH="$AUTOCONF_ARCHIVE_PREFIX/share/aclocal:$GETTEXT_PREFIX/share/aclocal:$LIBTOOL_PREFIX/share/aclocal:$BREW_PREFIX/share/aclocal${ACLOCAL_PATH:+:$ACLOCAL_PATH}"
          hash -r

          echo "Build prerequisite check:"
          command -v cmake && cmake --version | head -n 1
          command -v ninja && ninja --version
          command -v autoconf && autoconf --version | head -n 1
          command -v automake && automake --version | head -n 1
          command -v aclocal && aclocal --version | head -n 1
          command -v autoreconf
          command -v autopoint && autopoint --version | head -n 1
          command -v libtoolize || command -v glibtoolize

          dump_vcpkg_failure_logs() {
            echo ""
            echo "===== vcpkg failure diagnostics ====="
            local root=".devtools/vcpkg/buildtrees"
            if [[ -d "$root/libexif" ]]; then
              for f in "$root"/libexif/autoconf-*-err.log "$root"/libexif/autoconf-*-out.log; do
                [[ -f "$f" ]] || continue
                echo "----- $f (last 200 lines) -----"
                tail -n 200 "$f" || true
              done
            fi
            if [[ -f out/ios/release/vcpkg-manifest-install.log ]]; then
              echo "----- vcpkg-manifest-install.log (last 200 lines) -----"
              tail -n 200 out/ios/release/vcpkg-manifest-install.log || true
            fi
          }

          cd .engine-src/KrKr2-Next

          # IMPORTANT: Do not call `cmake --preset` directly here.
          # KrKr2-Next's build/build_ios.sh discovers/bootstraps vcpkg and
          # exports VCPKG_ROOT immediately before invoking CMake. Calling CMake
          # first leaves VCPKG_ROOT empty, producing /scripts/buildsystems/vcpkg.cmake.
          echo "Apple libtool: $(command -v libtool)"
          /usr/bin/libtool -V 2>&1 | head -n 1 || true
          echo "GNU libtoolize shim: $(command -v libtoolize || true)"

          set +e
          bash ./build.sh ios release --jobs=4
          UPSTREAM_STATUS=$?
          set -e
          if [[ $UPSTREAM_STATUS -ne 0 ]]; then
            dump_vcpkg_failure_logs
          fi
          cd ../..

          LIBDIR=".engine-src/KrKr2-Next/bridge/flutter_engine_bridge/ios/Libs"
          PROJECT_LIB="$LIBDIR/libengine_project.a"
          VENDOR_LIB="$LIBDIR/libengine_vendors.a"

          if [[ ! -f "$PROJECT_LIB" || ! -f "$VENDOR_LIB" ]]; then
            echo "Upstream build status: $UPSTREAM_STATUS"
            echo "Required merged engine archives were not produced."
            find .engine-src/KrKr2-Next -name 'libengine*.a' -print || true
            exit 1
          fi

          # The upstream script may fail later in its Flutter app stage even after
          # the static engine archives we need are already complete. We only need
          # those archives for KiriPad.
          echo "Upstream build status: $UPSTREAM_STATUS"
          ls -lh "$PROJECT_LIB" "$VENDOR_LIB"
          mkdir -p Vendor/KrKr2Next/Libs
          cp "$PROJECT_LIB" Vendor/KrKr2Next/Libs/libengine_project.a
          cp "$VENDOR_LIB" Vendor/KrKr2Next/Libs/libengine_vendors.a

      - name: Build KiriPad with runtime linked
        shell: bash
        env:
          KIRIPAD_BUNDLE_ID: dev.kiripad.phase1
          KIRIPAD_WITH_ENGINE: "1"
        run: bash ./ci/build_unsigned_ipa.sh

      - name: Collect build metadata
        shell: bash
        run: |
          mkdir -p artifacts/runtime-source-info
          cp engine-commit.txt engine-source.txt artifacts/runtime-source-info/
          if [[ -f .engine-src/KrKr2-Next/LICENSE ]]; then
            cp .engine-src/KrKr2-Next/LICENSE artifacts/runtime-source-info/KrKr2-Next-LICENSE.txt
          fi

      - name: Upload runtime unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KiriPad-Phase2A-runtime-unsigned-ipa
          path: artifacts/KiriPad-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact upstream source metadata
        uses: actions/upload-artifact@v4
        with:
          name: KiriPad-Phase2A-runtime-source-info
          path: artifacts/runtime-source-info
          if-no-files-found: error
          retention-days: 14
