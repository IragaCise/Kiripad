          path.write_text(text, encoding="utf-8")

          patched = path.read_text(encoding="utf-8")
          required = (
              "KiriPad 2A.28.1 startup raw:",
              "KiriPad 2A.28.1 startup literal UTF16",
              "KiriPad 2A.28.1 startup LoadByteCode result=",
