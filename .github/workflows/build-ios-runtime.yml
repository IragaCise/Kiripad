					env.copyTransParam(trans, elm);
				}
			}
			
			// 表示アクションが定義されている場合表示されているレイヤに反映させる
			if (typeof trans == "Object") {
				setTransAction(trans);
			}
			
			setupTrans();
			entryUpdateAll();
			issync = outputTag(transTarget);
				dm(@"================ endtrans ===================", tkdlVerbose);
			isEntryCommand = false;
