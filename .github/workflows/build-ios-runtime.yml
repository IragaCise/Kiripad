                          TJS_W("everypage"),
                          TJS_W("autoReturn"),
                          TJS_W("maxPages"),
                          TJS_W("maxLines"),
                          TJS_W("storeState"),
                          TJS_W("frameOpacity"),
                          TJS_W("actionIndent"),
                          TJS_W("nameIndent"),
                          TJS_W("historyOverColor"),
                          TJS_W("stopVoiceAtOpen"),
                          TJS_W("stopVoiceAtClose")
                      };

                      for(const tjs_char *kiriPad2A40bMember :
                          kiriPad2A40bMembers) {

                          tTJSVariant kiriPad2A39Existing;
                          tjs_error kiriPad2A39Get =
                              kiriPad2A39Obj->PropGet(
                                  0,
                                  kiriPad2A40bMember,
                                  NULL,
                                  &kiriPad2A39Existing,
                                  kiriPad2A39This);

                          if(TJS_SUCCEEDED(kiriPad2A39Get)) {
                              TVPAddImportantLog(
                                  ttstr(TJS_W("(info) KiriPad 2A.40b member already exists ")) +
                                  kiriPad2A39ClassName +
                                  TJS_W(".") +
                                  kiriPad2A40bMember);
                              continue;
                          }

                          tTJSVariant kiriPad2A39Zero((tjs_int)0);
                          tjs_error kiriPad2A39Set =
                              kiriPad2A39Obj->PropSet(
                                  TJS_MEMBERENSURE | TJS_IGNOREPROP,
                                  kiriPad2A40bMember,
                                  NULL,
                                  &kiriPad2A39Zero,
                                  kiriPad2A39This);

                          TVPAddImportantLog(
                              ttstr(TJS_W("(info) KiriPad 2A.40b member add ")) +
                              kiriPad2A39ClassName +
                              TJS_W(".") +
                              kiriPad2A40bMember +
                              (TJS_SUCCEEDED(kiriPad2A39Set)
                                  ? TJS_W("=YES")
                                  : TJS_W("=NO")));
                      }
                  }
              }
          '''

          # Insert immediately before the function's final closing brace.
          text = text[:close_brace] + inject + text[close_brace:]
          path.write_text(text, encoding="utf-8")

          patched = path.read_text(encoding="utf-8")

          for token in (
              "KiriPad 2A.40b HistoryLayer config-member compat",
              'TJS_W("HistoryLayer")',
              'TJS_W("HistoryLayerOriginal")',
              'TJS_W("fontName")',
              'TJS_W("fontBold")',
              'TJS_W("fontHeight")',
              'TJS_W("lineHeight")',
              'TJS_W("verticalView")',
              'TJS_W("everypage")',
              'TJS_W("autoReturn")',
              'TJS_W("maxPages")',
              'TJS_W("maxLines")',
              'TJS_W("storeState")',
              'TJS_W("frameOpacity")',
              'TJS_W("actionIndent")',
              'TJS_W("nameIndent")',
              'TJS_W("historyOverColor")',
              'TJS_W("stopVoiceAtOpen")',
              'TJS_W("stopVoiceAtClose")',
              "TJS_MEMBERENSURE | TJS_IGNOREPROP",
              "KiriPad 2A.40b member add ",
          ):
              if token not in patched:
                  raise SystemExit(f"2A.40b verification failed: {token}")

          # Re-check that the overload still has a valid body and our patch is inside it.
          sig2 = re.search(
              r'void\s+TVPExecuteStorage\s*\(\s*const\s+ttstr\s*&\s*name\s*,\s*'
              r'iTJSDispatch2\s*\*\s*context\s*,\s*tTJSVariant\s*\*\s*result\s*,\s*'
              r'bool\s+isexpression\s*,\s*const\s+tjs_char\s*\*\s*modestr\s*\)',
              patched,
              re.S,
          )
          if not sig2:
              raise SystemExit("2A.39: TVPExecuteStorage signature damaged")

          pos = patched.index("KiriPad 2A.40b HistoryLayer config-member compat")
          line_no = patched[:pos].count("\n") + 1
          lines = patched.splitlines()
          lo = max(0, line_no - 12)
          hi = min(len(lines), line_no + 100)

          print("Installed Phase 2A.43b Config-derived HistoryLayer compatibility.")
          print("HistoryLayer_config members predeclared from decrypted Config.tjs:")
          print("  " + ", ".join([
