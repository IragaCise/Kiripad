      - name: Enable TJS stack tracer and capture System.inform caller
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------------------------
          # 1) Enable the built-in TJS stack tracer before startup.tjs.
          # ------------------------------------------------------------
          spath = Path("cpp/core/base/ScriptMgnIntf.cpp")
          stext = spath.read_text(encoding="utf-8")

          inc = '#include "../tjs2/tjsDebug.h"\n'
          if inc not in stext:
              first_include = stext.find("#include")
              if first_include < 0:
                  raise SystemExit("ScriptMgnIntf.cpp include insertion point not found")
              stext = stext[:first_include] + inc + stext[first_include:]

          sig = re.search(
              r'void\s+TVPInitializeStartupScript\s*\(\s*\)\s*\{',
              stext,
              re.S,
          )
          if not sig:
              raise SystemExit("TVPInitializeStartupScript signature not found")

          marker = "KiriPad 2A.26 TJS stack tracer enabled"
          if marker in stext:
              raise SystemExit("2A.26 startup tracer marker already present unexpectedly")

          brace = stext.find("{", sig.start(), sig.end())
          if brace < 0:
              raise SystemExit("TVPInitializeStartupScript opening brace not found")

          inject = r'''
              static bool kiriPad2A26TracerEnabled = false;
              if(!kiriPad2A26TracerEnabled) {
                  TJS::TJSAddRefStackTracer();
                  kiriPad2A26TracerEnabled = true;
                  TVPAddImportantLog(
                      TJS_W("(info) KiriPad 2A.26 TJS stack tracer enabled"));
              }
          '''
          stext = stext[:brace + 1] + inject + stext[brace + 1:]
          spath.write_text(stext, encoding="utf-8")

          # ------------------------------------------------------------
          # 2) At System.inform, dump the exact TJS call stack.
          #    This is the path proven by 2A.24 to produce the dialog.
          # ------------------------------------------------------------
          ipath = Path("cpp/core/base/impl/SystemImpl.cpp")
          itext = ipath.read_text(encoding="utf-8")

          iinc = '#include "../../tjs2/tjsDebug.h"\n'
          if iinc not in itext:
              first_include = itext.find("#include")
              if first_include < 0:
                  raise SystemExit("SystemImpl.cpp include insertion point not found")
              itext = itext[:first_include] + iinc + itext[first_include:]

          inform = re.search(
              r'TJS_BEGIN_NATIVE_METHOD_DECL\s*\(\s*/\*func\.\s*name\*/\s*inform\s*\)\s*\{',
              itext,
              re.S,
          )
          if not inform:
              raise SystemExit("System.inform native method not found")

          # Insert immediately before the button-handling branch, after both
          # text and caption have been resolved.
          branch = re.search(
              r'if\s*\(\s*numparams\s*>=\s*3\s*&&\s*param\[2\]->Type\(\)\s*!=\s*tvtVoid\s*\)\s*\{',
              itext[inform.end():],
              re.S,
          )
          if not branch:
              raise SystemExit("System.inform button branch not found")
          pos = inform.end() + branch.start()

          imarker = "KiriPad 2A.26 System.inform"
          if imarker in itext:
              raise SystemExit("2A.26 System.inform marker already present unexpectedly")

          iblock = r'''
              {
                  ttstr kiriPad2A26Trace =
                      TJS::TJSGetStackTraceString(24, TJS_W(" <-- "));
                  TVPAddLog(
                      ttstr(TJS_W("(info) KiriPad 2A.26 System.inform text='")) +
                      text + TJS_W("' caption='") + caption + TJS_W("'"));
                  TVPAddLog(
                      ttstr(TJS_W("(info) KiriPad 2A.26 TJS caller trace: ")) +
                      kiriPad2A26Trace);
              }

          '''
          itext = itext[:pos] + iblock + itext[pos:]
          ipath.write_text(itext, encoding="utf-8")

          # ------------------------------------------------------------
          # Verification and useful source windows in Actions log.
          # ------------------------------------------------------------
          s2 = spath.read_text(encoding="utf-8")
          i2 = ipath.read_text(encoding="utf-8")
          required = [
              (s2, "KiriPad 2A.26 TJS stack tracer enabled"),
              (s2, "TJS::TJSAddRefStackTracer();"),
              (i2, "KiriPad 2A.26 System.inform text="),
              (i2, "TJS::TJSGetStackTraceString(24"),
          ]
          for body, token in required:
              if token not in body:
                  raise SystemExit(f"2A.26 verification failed: {token}")

          print("Installed Phase 2A.26 TJS caller trace.")
          print("===== TVPInitializeStartupScript window =====")
          p = s2.index("KiriPad 2A.26 TJS stack tracer enabled")
          print(s2[max(0, p-650):p+650])
          print("===== System.inform window =====")
          p = i2.index("KiriPad 2A.26 System.inform text=")
          print(i2[max(0, p-850):p+1200])
          PY

      - name: Probe decoded startup.tjs source around the alert text
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cpp/core/base/ScriptMgnIntf.cpp")
          text = path.read_text(encoding="utf-8")

          marker = "KiriPad 2A.27 startup source stats"
          if marker in text:
              raise SystemExit("2A.27 startup source probe already present unexpectedly")

          needle = "    stream->Read(buffer, 0);\n"
          pos = text.find(needle)
          if pos < 0:
              raise SystemExit("stream->Read(buffer, 0) insertion point not found")

          block = r'''
              if(shortname == ttstr(TJS_W("startup.tjs"))) {
                  std::string kiriPad2A27Utf8 = buffer.AsStdString();

                  size_t kiriPad2A27Newlines = 0;
                  for(char ch : kiriPad2A27Utf8) {
                      if(ch == '\n')
                          ++kiriPad2A27Newlines;
                  }

                  spdlog::info(
                      "KiriPad 2A.27 startup source stats: chars={} utf8_bytes={} lines={}",
                      static_cast<unsigned long long>(buffer.GetLen()),
                      static_cast<unsigned long long>(kiriPad2A27Utf8.size()),
                      static_cast<unsigned long long>(kiriPad2A27Newlines + 1));

                  auto kiriPad2A27Escape = [](const std::string &src) {
                      std::string out;
                      out.reserve(src.size() + 32);
                      for(unsigned char ch : src) {
                          switch(ch) {
                              case '\r': out += "\\r"; break;
                              case '\n': out += "\\n"; break;
                              case '\t': out += "\\t"; break;
                              default:
                                  if(ch < 0x20 || ch == 0x7f) {
                                      char tmp[8];
                                      std::snprintf(tmp, sizeof(tmp), "\\x%02X",
                                                    static_cast<unsigned int>(ch));
                                      out += tmp;
                                  } else {
                                      out.push_back(static_cast<char>(ch));
                                  }
                                  break;
                          }
                      }
                      return out;
                  };

                  auto kiriPad2A27LogAround =
                      [&](const char *label, const char *literal) {
                          const std::string key(literal);
                          const size_t hit = kiriPad2A27Utf8.find(key);
                          if(hit == std::string::npos) {
                              spdlog::info(
                                  "KiriPad 2A.27 startup literal '{}' not found",
                                  label);
                              return;
                          }

                          const size_t radius = 220;
                          const size_t begin = hit > radius ? hit - radius : 0;
                          const size_t end =
                              std::min(kiriPad2A27Utf8.size(),
                                       hit + key.size() + radius);
                          const std::string snippet =
                              kiriPad2A27Utf8.substr(begin, end - begin);

                          spdlog::info(
                              "KiriPad 2A.27 startup literal '{}' pos={} context='{}'",
                              label,
                              static_cast<unsigned long long>(hit),
                              kiriPad2A27Escape(snippet));
                      };

                  kiriPad2A27LogAround("startup failed", "startup failed");
                  kiriPad2A27LogAround(
                      "corrupted execution file", "corrupted execution file");

                  const size_t previewLen =
                      std::min<size_t>(320, kiriPad2A27Utf8.size());
                  spdlog::info(
                      "KiriPad 2A.27 startup head='{}'",
                      kiriPad2A27Escape(
                          kiriPad2A27Utf8.substr(0, previewLen)));

                  if(kiriPad2A27Utf8.size() > previewLen) {
                      const size_t tailBegin =
                          kiriPad2A27Utf8.size() - previewLen;
                      spdlog::info(
                          "KiriPad 2A.27 startup tail='{}'",
                          kiriPad2A27Escape(
                              kiriPad2A27Utf8.substr(
                                  tailBegin, previewLen)));
                  }
              }

          '''

          text = text[:pos + len(needle)] + block + text[pos + len(needle):]

          # Ensure the small helpers we use are available.
          first_include = text.find("#include")
          if first_include < 0:
              raise SystemExit("include insertion point not found")
          extra = ""
          if "#include <algorithm>" not in text:
              extra += "#include <algorithm>\n"
          if "#include <cstdio>" not in text:
              extra += "#include <cstdio>\n"
          if "#include <string>" not in text:
              extra += "#include <string>\n"
          if extra:
              text = text[:first_include] + extra + text[first_include:]

          path.write_text(text, encoding="utf-8")

          patched = path.read_text(encoding="utf-8")
          required = (
              "KiriPad 2A.27 startup source stats",
              "KiriPad 2A.27 startup literal",
              "KiriPad 2A.27 startup head=",
              'shortname == ttstr(TJS_W("startup.tjs"))',
          )
          for token in required:
              if token not in patched:
                  raise SystemExit(f"2A.27 verification failed: {token}")

          p = patched.index("KiriPad 2A.27 startup source stats")
          print("Installed Phase 2A.27 startup source probe.")
          print("===== patched source window =====")
          print(patched[max(0, p-1600):p+4200])
          PY

      - name: Configure and build upstream iOS engine only
        shell: bash
        run: |
          set -u
          ROOT="$PWD"
          ENGINE="$ROOT/.engine-src/KrKr2-Next"
          LOGDIR="$ROOT/artifacts/runtime-build-logs"
          mkdir -p "$LOGDIR"

          BREW_PREFIX="$(brew --prefix)"
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          LIBTOOL_PREFIX="$(brew --prefix libtool)"
          AUTOCONF_ARCHIVE_PREFIX="$(brew --prefix autoconf-archive)"
          BISON_PREFIX="$(brew --prefix bison)"
          TOOL_SHIMS="${KIRIPAD_TOOL_SHIMS:-$RUNNER_TEMP/kiripad-tools}"

          export PATH="$TOOL_SHIMS:$GETTEXT_PREFIX/bin:$BISON_PREFIX/bin:$BREW_PREFIX/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export ACLOCAL_PATH="$AUTOCONF_ARCHIVE_PREFIX/share/aclocal:$GETTEXT_PREFIX/share/aclocal:$LIBTOOL_PREFIX/share/aclocal:$BREW_PREFIX/share/aclocal${ACLOCAL_PATH:+:$ACLOCAL_PATH}"
          hash -r

          cd "$ENGINE"

          # Upstream CMakeLists.txt consumes VCPKG_ROOT before project().
          if [[ ! -d .devtools/vcpkg/.git ]]; then
            mkdir -p .devtools
            git clone https://github.com/microsoft/vcpkg.git .devtools/vcpkg
            (cd .devtools/vcpkg && ./bootstrap-vcpkg.sh -disableMetrics)
          fi
          export VCPKG_ROOT="$PWD/.devtools/vcpkg"
          echo "VCPKG_ROOT=$VCPKG_ROOT" | tee "$LOGDIR/environment.txt"
          echo "PATH=$PATH" >> "$LOGDIR/environment.txt"
          echo "ACLOCAL_PATH=$ACLOCAL_PATH" >> "$LOGDIR/environment.txt"
          cmake --version >> "$LOGDIR/environment.txt" 2>&1 || true
          ninja --version >> "$LOGDIR/environment.txt" 2>&1 || true

          set +e
          cmake --preset "iOS Release Config" 2>&1 | tee "$LOGDIR/configure.log"
          CONFIG_STATUS=${PIPESTATUS[0]}
          if [[ $CONFIG_STATUS -ne 0 ]]; then
            echo "CMake configure failed with status $CONFIG_STATUS"
            exit $CONFIG_STATUS
          fi

          cmake --build --preset "iOS Release Build" -- -j4 2>&1 | tee "$LOGDIR/build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [[ $BUILD_STATUS -ne 0 ]]; then
            echo "CMake build failed with status $BUILD_STATUS"
            echo "===== likely fatal lines ====="
            grep -nE '(^|[^A-Za-z])(fatal error:|error:|FAILED:|Undefined symbols|ld: |clang: error|CMake Error)' "$LOGDIR/build.log" | tail -n 120 || true
            echo "===== build.log tail ====="
            tail -n 160 "$LOGDIR/build.log" || true
            exit $BUILD_STATUS
          fi

          CMAKE_BUILD_DIR="$PWD/out/ios/release"
          ENGINE_LIB="$CMAKE_BUILD_DIR/bridge/engine_api/libengine_api.a"
          if [[ ! -f "$ENGINE_LIB" ]]; then
            echo "Engine static library not found: $ENGINE_LIB"
            find "$CMAKE_BUILD_DIR" -name '*.a' -print | tee "$LOGDIR/static-libraries.txt" || true
            exit 1
          fi

          echo "Engine API archive: $ENGINE_LIB"

          # Reproduce only upstream Step 2 (archive merge). We deliberately do
          # not build the upstream Flutter app; KiriPad is our iOS host.
          PLUGIN_LIBS_DIR="$PWD/bridge/flutter_engine_bridge/ios/Libs"
          mkdir -p "$PLUGIN_LIBS_DIR"
          MERGE_TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$MERGE_TMPDIR"' EXIT

          PROJECT_LIBS=()
          while IFS= read -r -d '' lib; do PROJECT_LIBS+=("$lib"); done < <(
            find "$CMAKE_BUILD_DIR" -name '*.a' \
              -not -path '*/vcpkg_installed/*' \
              -not -path '*/cpp/plugins/*' -print0
          )
          printf '%s\n' "${PROJECT_LIBS[@]}" > "$LOGDIR/project-libraries.txt"
          if [[ ${#PROJECT_LIBS[@]} -eq 0 ]]; then
            echo "No project static libraries found."
            exit 1
          fi

          /usr/bin/libtool -static -o "$MERGE_TMPDIR/libengine_project_base.a" "${PROJECT_LIBS[@]}"
          ar t "$MERGE_TMPDIR/libengine_project_base.a" | sort -u > "$MERGE_TMPDIR/project_objs.txt"

          UNIQUE_OBJS=()
          while IFS= read -r -d '' sublib; do
            sublibname="$(basename "$sublib" .a)"
            extractdir="$MERGE_TMPDIR/extract_${sublibname}"
            mkdir -p "$extractdir"
            (cd "$extractdir" && ar x "$sublib")
            for obj in "$extractdir"/*.o; do
              [[ -f "$obj" ]] || continue
              objname="$(basename "$obj")"
              if ! grep -qx "$objname" "$MERGE_TMPDIR/project_objs.txt"; then
                UNIQUE_OBJS+=("$obj")
              fi
            done
          done < <(find "$CMAKE_BUILD_DIR/cpp/plugins" -mindepth 3 -name '*.a' -print0 2>/dev/null)

          if [[ ${#UNIQUE_OBJS[@]} -gt 0 ]]; then
            /usr/bin/libtool -static -o "$PLUGIN_LIBS_DIR/libengine_project.a" \
              "$MERGE_TMPDIR/libengine_project_base.a" "${UNIQUE_OBJS[@]}"
          else
            cp "$MERGE_TMPDIR/libengine_project_base.a" "$PLUGIN_LIBS_DIR/libengine_project.a"
          fi

          VCPKG_LIB_DIR="$CMAKE_BUILD_DIR/vcpkg_installed/arm64-ios/lib"
          VCPKG_EXCLUDE_RE='^(libpng\.a|libjpeg\.a|libwebpdecoder\.a|libharfbuzz-subset\.a)$'
          VCPKG_LIBS=()
          while IFS= read -r -d '' lib; do
            base="$(basename "$lib")"
            [[ "$base" =~ $VCPKG_EXCLUDE_RE ]] && continue
            VCPKG_LIBS+=("$lib")
          done < <(find "$VCPKG_LIB_DIR" -maxdepth 1 -name '*.a' -print0)
          printf '%s\n' "${VCPKG_LIBS[@]}" > "$LOGDIR/vendor-libraries.txt"
          if [[ ${#VCPKG_LIBS[@]} -eq 0 ]]; then
            echo "No vcpkg static libraries found."
            exit 1
          fi
          /usr/bin/libtool -static -o "$PLUGIN_LIBS_DIR/libengine_vendors.a" "${VCPKG_LIBS[@]}"

          cd "$ROOT"
          mkdir -p Vendor/KrKr2Next/Libs
          cp "$ENGINE/bridge/flutter_engine_bridge/ios/Libs/libengine_project.a" Vendor/KrKr2Next/Libs/
          cp "$ENGINE/bridge/flutter_engine_bridge/ios/Libs/libengine_vendors.a" Vendor/KrKr2Next/Libs/
          ls -lh Vendor/KrKr2Next/Libs/*.a

          # Verify that the patched StorageImpl object is actually present in the
          # static archive that KiriPad will link.
          ENGINE_STRINGS="$RUNNER_TEMP/kiripad-engine-project-strings.txt"
          strings Vendor/KrKr2Next/Libs/libengine_project.a > "$ENGINE_STRINGS"
          if ! grep -Fq "KiriPad 2A.14 Documents-anchor recovery" "$ENGINE_STRINGS"; then
            echo "ERROR: merged engine archive does not contain the Phase 2A.14 Documents-anchor marker"
            grep -F "KiriPad 2A.14" "$ENGINE_STRINGS" | head -n 80 || true
            exit 1
          fi
          echo "Phase 2A.14 engine archive marker confirmed."

      - name: Force-install Phase 2A.14 Documents-path runtime host
        shell: bash
        run: |
          set -euo pipefail
          cat > App/EngineRuntimeHost.mm <<'OBJC'
          #import "EngineRuntimeHost.h"
          #import <QuartzCore/QuartzCore.h>
          
          #if KIRIPAD_ENGINE_LINKED
          #include "EngineApiABI.hpp"
          #endif
          
          #include <algorithm>
          #include <atomic>
          #include <vector>
          
          static NSString * const KiriPadRuntimeErrorDomain = @"KiriPadRuntime";
          
          @interface EngineRuntimeHost () {
          #if KIRIPAD_ENGINE_LINKED
              engine_handle_t _engine;
              CADisplayLink *_displayLink;
              uint64_t _lastFrameSerial;
              BOOL _startupSuccessLogged;
              uint64_t _tickCount;
              uint64_t _framesDelivered;
              uint32_t _frameDiagBudget;
          #endif
              std::atomic_bool _runningAtomic;
          }
          @end
          
          @implementation EngineRuntimeHost
          
          + (BOOL)isEngineLinked {
          #if KIRIPAD_ENGINE_LINKED
              return YES;
          #else
              return NO;
          #endif
          }
          
          + (NSString *)backendDescription {
          #if KIRIPAD_ENGINE_LINKED
              return @"KrKr2-Next engine_api (experimental iOS runtime)";
          #else
              return @"ランタイム未リンク版（診断・起動前プローブのみ）";
          #endif
          }
          
          - (instancetype)init {
              self = [super init];
              if (self) {
                  _runningAtomic.store(false);
          #if KIRIPAD_ENGINE_LINKED
                  _engine = nullptr;
                  _displayLink = nil;
                  _lastFrameSerial = 0;
                  _startupSuccessLogged = NO;
                  _tickCount = 0;
                  _framesDelivered = 0;
                  _frameDiagBudget = 12;
          #endif
              }
              return self;
          }
          
          - (BOOL)isRunning {
              return _runningAtomic.load();
          }
          
          - (void)notifyLog:(NSString *)text {
              if (!text.length) return;
              if (NSThread.isMainThread) {
                  id<EngineRuntimeHostDelegate> delegate = self.delegate;
                  if (delegate) [delegate engineRuntimeHost:self didAppendLog:text];
                  return;
              }
              dispatch_async(dispatch_get_main_queue(), ^{
                  id<EngineRuntimeHostDelegate> delegate = self.delegate;
                  if (delegate) [delegate engineRuntimeHost:self didAppendLog:text];
              });
          }
          
          - (void)notifyRunning:(BOOL)running {
              _runningAtomic.store(running);
              if (NSThread.isMainThread) {
                  id<EngineRuntimeHostDelegate> delegate = self.delegate;
                  if (delegate) [delegate engineRuntimeHost:self didChangeRunning:running];
                  return;
              }
              dispatch_async(dispatch_get_main_queue(), ^{
                  id<EngineRuntimeHostDelegate> delegate = self.delegate;
                  if (delegate) [delegate engineRuntimeHost:self didChangeRunning:running];
              });
          }
          
          #if KIRIPAD_ENGINE_LINKED
          - (NSString *)lastEngineError {
              if (!_engine) return @"engine handle is null";
              const char *msg = engine_get_last_error(_engine);
              if (!msg || !*msg) return @"(no detail)";
              return [NSString stringWithUTF8String:msg] ?: @"(invalid UTF-8 error)";
          }
          
          - (void)drainStartupLogs {
              if (!_engine) return;
              char buffer[16384];
              uint32_t written = 0;
              for (int i = 0; i < 8; ++i) {
                  written = 0;
                  const auto result = engine_drain_startup_logs(_engine, buffer, sizeof(buffer) - 1, &written);
                  if (result != ENGINE_RESULT_OK || written == 0) break;
                  buffer[std::min<uint32_t>(written, sizeof(buffer) - 1)] = '\0';
                  NSString *line = [[NSString alloc] initWithBytes:buffer length:written encoding:NSUTF8StringEncoding];
                  if (line.length) [self notifyLog:line];
                  if (written < sizeof(buffer) - 1) break;
              }
          }
          
          - (void)captureFrameIfAvailable {
              if (!_engine) return;
              engine_frame_desc_t desc{};
              desc.struct_size = sizeof(desc);
              const auto descResult = engine_get_frame_desc(_engine, &desc);
              if (descResult != ENGINE_RESULT_OK) {
                  if (_frameDiagBudget > 0) {
                      --_frameDiagBudget;
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] frame_desc result=%d error=%@\n", (int)descResult, [self lastEngineError]]];
                  }
                  return;
              }
              if (desc.width == 0 || desc.height == 0 || desc.stride_bytes == 0) {
                  if (_frameDiagBudget > 0) {
                      --_frameDiagBudget;
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] frame_desc empty width=%u height=%u stride=%u format=%u serial=%llu\n", desc.width, desc.height, desc.stride_bytes, desc.pixel_format, (unsigned long long)desc.frame_serial]];
                  }
                  return;
              }
              if (desc.pixel_format != ENGINE_PIXEL_FORMAT_RGBA8888) {
                  if (_frameDiagBudget > 0) {
                      --_frameDiagBudget;
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] unsupported frame format=%u size=%ux%u stride=%u serial=%llu\n", desc.pixel_format, desc.width, desc.height, desc.stride_bytes, (unsigned long long)desc.frame_serial]];
                  }
                  return;
              }
              if (desc.frame_serial != 0 && desc.frame_serial == _lastFrameSerial) return;

              const size_t bytes = static_cast<size_t>(desc.stride_bytes) * desc.height;
              if (bytes == 0 || bytes > 256ull * 1024ull * 1024ull) {
                  if (_frameDiagBudget > 0) {
                      --_frameDiagBudget;
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] invalid frame byte count=%llu\n", (unsigned long long)bytes]];
                  }
                  return;
              }
              std::vector<uint8_t> storage(bytes);
              const auto readResult = engine_read_frame_rgba(_engine, storage.data(), storage.size());
              if (readResult != ENGINE_RESULT_OK) {
                  if (_frameDiagBudget > 0) {
                      --_frameDiagBudget;
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] frame_read result=%d serial=%llu error=%@\n", (int)readResult, (unsigned long long)desc.frame_serial, [self lastEngineError]]];
                  }
                  return;
              }
              _lastFrameSerial = desc.frame_serial;
              ++_framesDelivered;

              const uint32_t width = desc.width;
              const uint32_t height = desc.height;
              const uint32_t stride = desc.stride_bytes;
              NSData *frameData = [NSData dataWithBytes:storage.data() length:storage.size()];

              CGColorSpaceRef cs = CGColorSpaceCreateDeviceRGB();
              CGDataProviderRef provider = CGDataProviderCreateWithCFData((__bridge CFDataRef)frameData);
              CGBitmapInfo bitmapInfo = kCGBitmapByteOrder32Big | kCGImageAlphaLast;
              CGImageRef cg = CGImageCreate(width, height, 8, 32, stride, cs, bitmapInfo,
                                           provider, nullptr, false, kCGRenderingIntentDefault);
              UIImage *image = cg ? [UIImage imageWithCGImage:cg] : nil;
              if (cg) CGImageRelease(cg);
              CGDataProviderRelease(provider);
              CGColorSpaceRelease(cs);

              if (_framesDelivered <= 5 || (_framesDelivered % 120) == 0) {
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] frame delivered #%llu serial=%llu size=%ux%u stride=%u image=%@\n", (unsigned long long)_framesDelivered, (unsigned long long)desc.frame_serial, width, height, stride, image ? @"YES" : @"NO"]];
              }

              if (image) {
                  id<EngineRuntimeHostDelegate> delegate = self.delegate;
                  if (delegate) [delegate engineRuntimeHost:self didProduceImage:image pixelSize:CGSizeMake(width, height)];
              }
          }

          - (void)stopOnOwnerThread {
              NSAssert(NSThread.isMainThread, @"KrKr2 engine owner thread must be the main thread in Phase 2A.14");
              if (_displayLink) {
                  [_displayLink invalidate];
                  _displayLink = nil;
              }
              if (_engine) {
                  [self drainStartupLogs];
                  engine_destroy(_engine);
                  _engine = nullptr;
              }
              _lastFrameSerial = 0;
              _startupSuccessLogged = NO;
              _tickCount = 0;
              _framesDelivered = 0;
              _frameDiagBudget = 12;
              [self notifyRunning:NO];
          }
          
          - (void)displayLinkFired:(CADisplayLink *)link {
              (void)link;
              NSAssert(NSThread.isMainThread, @"KrKr2 tick moved off engine owner thread");
              if (!_engine || !_runningAtomic.load()) return;
              ++_tickCount;
          
              const auto tickResult = engine_tick(_engine, 16);
              [self drainStartupLogs];
          
              uint32_t startupState = ENGINE_STARTUP_STATE_IDLE;
              const auto stateResult = engine_get_startup_state(_engine, &startupState);
              if (stateResult != ENGINE_RESULT_OK) {
                  [self notifyLog:[NSString stringWithFormat:@"\n[Phase2A.14] engine_get_startup_state error=%d: %@\n", (int)stateResult, [self lastEngineError]]];
                  [self stopOnOwnerThread];
                  return;
              }
          
              if (startupState == ENGINE_STARTUP_STATE_FAILED) {
                  [self notifyLog:[NSString stringWithFormat:@"\n[Phase2A.14] startup FAILED (state=%u, tick=%d): %@\n", startupState, (int)tickResult, [self lastEngineError]]];
                  [self captureFrameIfAvailable];
                  [self stopOnOwnerThread];
                  return;
              }
          
              if (startupState == ENGINE_STARTUP_STATE_SUCCEEDED && !_startupSuccessLogged) {
                  _startupSuccessLogged = YES;
                  [self notifyLog:@"\n[Phase2A.14] startup SUCCEEDED — entering frame loop\n"];
              }
              if (_startupSuccessLogged && (_tickCount <= 5 || (_tickCount % 120) == 0)) {
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] heartbeat tick=%llu tickResult=%d startupState=%u frames=%llu lastSerial=%llu\n", (unsigned long long)_tickCount, (int)tickResult, startupState, (unsigned long long)_framesDelivered, (unsigned long long)_lastFrameSerial]];
              }
          
              if (tickResult != ENGINE_RESULT_OK && tickResult != ENGINE_RESULT_INVALID_STATE) {
                  [self notifyLog:[NSString stringWithFormat:@"\n[Phase2A.14] engine_tick error=%d: %@\n", (int)tickResult, [self lastEngineError]]];
              }
              [self captureFrameIfAvailable];
          }
          #endif
          
          - (BOOL)startGameAtURL:(NSURL *)gameRoot error:(NSError **)error {
          #if !KIRIPAD_ENGINE_LINKED
              if (error) {
                  *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:1
                                           userInfo:@{NSLocalizedDescriptionKey: @"このIPAはランタイム未リンク版です。Phase 2A Runtime workflowでビルドしてください。"}];
              }
              return NO;
          #else
              // KrKr2-Next engine_api binds an engine handle to the exact OS thread that
              // called engine_create().  A serial GCD queue is NOT enough: GCD may run
              // successive blocks on different worker threads.  Phase 2A.14 therefore
              // owns the engine on UIKit's main thread and drives it with CADisplayLink.
              if (!NSThread.isMainThread) {
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:4 userInfo:@{NSLocalizedDescriptionKey:@"KiriPad Phase 2A.14 はメインスレッドから起動する必要があります。"}];
                  return NO;
              }
              if (!gameRoot.isFileURL) {
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:2 userInfo:@{NSLocalizedDescriptionKey:@"ゲームルートがファイルURLではありません。"}];
                  return NO;
              }
              if (_runningAtomic.exchange(true)) {
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:3 userInfo:@{NSLocalizedDescriptionKey:@"ランタイムはすでに起動中です。"}];
                  return NO;
              }
          
              NSString *rootPath = gameRoot.path;
              NSFileManager *fm = NSFileManager.defaultManager;
              // KrKr2-Next's engine_api expects the game entry archive for ordinary
              // XP3-packaged titles.  Passing the containing directory makes
              // AutoMountXP3 treat the directory name as the project basename and it
              // looks for sibling archives in Documents/, which is wrong for titles
              // laid out as <game>/data.xp3.  Resolve the real on-disk spelling of
              // data.xp3 case-insensitively, then pass that archive as the engine entry.
              NSString *engineEntryPath = nil;
              BOOL rootIsDirectory = NO;
              if ([fm fileExistsAtPath:rootPath isDirectory:&rootIsDirectory] && rootIsDirectory) {
                  NSError *listError = nil;
                  NSArray<NSString *> *children = [fm contentsOfDirectoryAtPath:rootPath error:&listError];
                  for (NSString *child in children) {
                      if ([child caseInsensitiveCompare:@"data.xp3"] == NSOrderedSame) {
                          NSString *candidate = [rootPath stringByAppendingPathComponent:child];
                          BOOL candidateIsDirectory = NO;
                          if ([fm fileExistsAtPath:candidate isDirectory:&candidateIsDirectory] && !candidateIsDirectory) {
                              engineEntryPath = candidate;
                              break;
                          }
                      }
                  }
                  if (!engineEntryPath && listError) {
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] data.xp3 directory scan warning: %@\n", listError.localizedDescription]];
                  }
              }
              if (!engineEntryPath && !rootIsDirectory && [[rootPath.pathExtension lowercaseString] isEqualToString:@"xp3"]) {
                  engineEntryPath = rootPath;
              }
              if (!engineEntryPath) {
                  _runningAtomic.store(false);
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:8 userInfo:@{NSLocalizedDescriptionKey:@"ゲームフォルダ内に data.xp3 が見つかりません。"}];
                  return NO;
              }

              NSString *support = NSSearchPathForDirectoriesInDomains(NSApplicationSupportDirectory, NSUserDomainMask, YES).firstObject;
              NSString *cache = NSSearchPathForDirectoriesInDomains(NSCachesDirectory, NSUserDomainMask, YES).firstObject;
              NSString *writePath = [support stringByAppendingPathComponent:@"KiriPadRuntime"];
              NSString *cachePath = [cache stringByAppendingPathComponent:@"KiriPadRuntime"];
              [fm createDirectoryAtPath:writePath withIntermediateDirectories:YES attributes:nil error:nil];
              [fm createDirectoryAtPath:cachePath withIntermediateDirectories:YES attributes:nil error:nil];
          
              [self notifyRunning:YES];
              [self notifyLog:[NSString stringWithFormat:@"\n[Phase2A.14] backend: %@\n[Phase2A.14] owner thread: main=%@\n[Phase2A.14] selected root: %@\n[Phase2A.14] engine entry: %@\n", [EngineRuntimeHost backendDescription], NSThread.isMainThread ? @"YES" : @"NO", rootPath, engineEntryPath]];
          
              uint32_t runtimeVersion = 0;
              auto versionResult = engine_get_runtime_api_version(&runtimeVersion);
              if (versionResult != ENGINE_RESULT_OK || (runtimeVersion >> 24u) != (ENGINE_API_VERSION >> 24u)) {
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:5 userInfo:@{NSLocalizedDescriptionKey:@"engine ABI mismatch"}];
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] engine ABI mismatch: runtime=0x%08x expected=0x%08x\n", runtimeVersion, ENGINE_API_VERSION]];
                  [self stopOnOwnerThread];
                  return NO;
              }
          
              engine_create_desc_t desc{};
              desc.struct_size = sizeof(desc);
              desc.api_version = ENGINE_API_VERSION;
              desc.writable_path_utf8 = writePath.UTF8String;
              desc.cache_path_utf8 = cachePath.UTF8String;
              auto createResult = engine_create(&desc, &_engine);
              if (createResult != ENGINE_RESULT_OK || !_engine) {
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:6 userInfo:@{NSLocalizedDescriptionKey:@"engine_create failed"}];
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] engine_create failed: %d\n", (int)createResult]];
                  [self stopOnOwnerThread];
                  return NO;
              }
          
              auto surfaceResult = engine_set_surface_size(_engine, 1280, 720);
              if (surfaceResult != ENGINE_RESULT_OK) {
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] engine_set_surface_size warning: %d / %@\n", (int)surfaceResult, [self lastEngineError]]];
              }
          
              auto openResult = engine_open_game_async(_engine, engineEntryPath.UTF8String, nullptr);
              if (openResult != ENGINE_RESULT_OK) {
                  NSString *detail = [self lastEngineError];
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:7 userInfo:@{NSLocalizedDescriptionKey:detail ?: @"engine_open_game_async failed"}];
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] engine_open_game_async failed: %d / %@\n", (int)openResult, detail]];
                  [self stopOnOwnerThread];
                  return NO;
              }
          
              _lastFrameSerial = 0;
              _startupSuccessLogged = NO;
              _tickCount = 0;
              _framesDelivered = 0;
              _frameDiagBudget = 12;
              _displayLink = [CADisplayLink displayLinkWithTarget:self selector:@selector(displayLinkFired:)];
              if (@available(iOS 15.0, *)) {
                  _displayLink.preferredFrameRateRange = CAFrameRateRangeMake(30.0, 60.0, 60.0);
              } else {
                  _displayLink.preferredFramesPerSecond = 60;
              }
              [_displayLink addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
              return YES;
          #endif
          }
          
          - (void)stop {
          #if KIRIPAD_ENGINE_LINKED
              if (!_runningAtomic.load()) return;
              if (!NSThread.isMainThread) {
                  dispatch_async(dispatch_get_main_queue(), ^{ [self stop]; });
                  return;
              }
              [self stopOnOwnerThread];
          #else
              [self notifyRunning:NO];
          #endif
          }
          
          - (void)sendPointerType:(NSUInteger)type x:(double)x y:(double)y pointerID:(NSInteger)pointerID {
          #if KIRIPAD_ENGINE_LINKED
              if (!_runningAtomic.load()) return;
              if (!NSThread.isMainThread) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self sendPointerType:type x:x y:y pointerID:pointerID];
                  });
                  return;
              }
              if (!_engine) return;
              engine_input_event_t event{};
              event.struct_size = sizeof(event);
              event.type = (uint32_t)type;
              event.timestamp_micros = (uint64_t)(CACurrentMediaTime() * 1000000.0);
              event.x = x;
              event.y = y;
              event.pointer_id = (int32_t)pointerID;
              event.button = 0;
              const auto inputResult = engine_send_input(_engine, &event);
              if (inputResult != ENGINE_RESULT_OK && inputResult != ENGINE_RESULT_INVALID_STATE) {
                  [self notifyLog:[NSString stringWithFormat:@"\n[Phase2A.14] engine_send_input error=%d: %@\n", (int)inputResult, [self lastEngineError]]];
              }
          #else
              (void)type; (void)x; (void)y; (void)pointerID;
          #endif
          }
          
          - (void)dealloc {
          #if KIRIPAD_ENGINE_LINKED
              if (NSThread.isMainThread && _runningAtomic.load()) {
                  [self stopOnOwnerThread];
              }
          #endif
          }
          
          @end
          OBJC
          echo "===== KiriPad runtime host verification ====="
          grep -nF "[Phase2A.14] owner thread: main=" App/EngineRuntimeHost.mm
          grep -nF "[Phase2A.14] engine entry:" App/EngineRuntimeHost.mm
          grep -nF "engine_open_game_async(_engine, engineEntryPath.UTF8String" App/EngineRuntimeHost.mm
          if grep -qF "dispatch_queue_create(\"dev.kiripad.engine\"" App/EngineRuntimeHost.mm; then
            echo "ERROR: legacy serial-GCD engine owner code is still present"
            exit 1
          fi

      - name: Build KiriPad with runtime linked
        shell: bash
        env:
          KIRIPAD_BUNDLE_ID: dev.kiripad.phase1
          KIRIPAD_WITH_ENGINE: "1"
        run: |
          set -euo pipefail
          rm -rf build-ios-ci .derived-data
          bash ./ci/build_unsigned_ipa.sh

          APP_BIN="$(find build-ios-ci -type f -path '*/Release-iphoneos/*.app/KiriPad' -print -quit)"
          if [[ -z "$APP_BIN" || ! -f "$APP_BIN" ]]; then
            echo "Could not locate built KiriPad executable"
            find build-ios-ci -maxdepth 5 -type f -print | tail -n 100 || true
            exit 1
          fi
          echo "Built executable: $APP_BIN"
          # Do not pipe `strings` into `grep -q` while `pipefail` is enabled.
          # grep -q exits as soon as it finds the marker, which closes the pipe;
          # macOS `strings` then reports "failed to flush output" (SIGPIPE), making
          # a successful marker match look like a failed pipeline.
          STRINGS_DUMP="$RUNNER_TEMP/kiripad-runtime-strings.txt"
          strings "$APP_BIN" > "$STRINGS_DUMP"
          if ! grep -Fq "[Phase2A.14] owner thread: main=" "$STRINGS_DUMP" || ! grep -Fq "[Phase2A.14] engine entry:" "$STRINGS_DUMP"; then
            echo "ERROR: built IPA does not contain the Phase 2A.14 runtime-host markers"
            echo "Nearby Phase2A markers found in executable:"
            grep -F "Phase2A" "$STRINGS_DUMP" | head -n 60 || true
            exit 1
          fi
          if ! grep -Fq "KiriPad 2A.14 Documents-anchor recovery" "$STRINGS_DUMP"; then
            echo "ERROR: built IPA contains the host but not the patched StorageImpl engine marker"
            grep -F "KiriPad 2A.14" "$STRINGS_DUMP" | head -n 80 || true
            exit 1
          fi
          echo "Phase 2A.14 host + patched-engine markers confirmed in built executable."

      - name: Collect source metadata
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/runtime-source-info
          cp engine-commit.txt engine-source.txt artifacts/runtime-source-info/ 2>/dev/null || true
          if [[ -f .engine-src/KrKr2-Next/LICENSE ]]; then
            cp .engine-src/KrKr2-Next/LICENSE artifacts/runtime-source-info/KrKr2-Next-LICENSE.txt
          fi

      - name: Upload runtime build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KiriPad-Phase2A27-runtime-build-logs
          path: artifacts/runtime-build-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload runtime unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KiriPad-Phase2A27-runtime-unsigned-ipa
          path: artifacts/KiriPad-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact upstream source metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KiriPad-Phase2A27-runtime-source-info
          path: artifacts/runtime-source-info
          if-no-files-found: warn
          retention-days: 14
