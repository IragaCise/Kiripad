	 * @param elm コマンド結果格納先。これがある場合はオブジェクトが存在しなければ作成する
	 */
	function getEnvObject(name, elm=void, check=false) {
		var obj = objects[name];
		if (obj !== void) {
			// 削除対象を参照する場合は一度消す
			if (obj.deleteFlag) {
				removeEnvObject(name);
				addUpdateTag(["del", name]);
				obj = void;
			}
		}
		// 新規レイヤ生成
		if (obj === void && elm !== void) {
			obj = entryEnvObject(name, elm, void, check);
		}
		return obj;
    }

 	// ------------------------------------------------------------------

	// 分岐系タグ
	// これがあった場合は環境系のタグの入れ子を中断する
	var brTags = %[
	s:true,
	label:true,
	next:true,
	exit:true,
	endrecollection:true,
	eval:true,
	set:true,
	select:true,
	mselect:true,
	seladd:true,
	selhead:true,
	mseladd:true,

	// 保存前タグ
	"cancelskip", true,
	"cancelautomode",true,
		];

	// 展開対象タグ
	var extractTags = %[
		"begintrans", function(pcd, cd, elm) { beginTrans(pcd, cd, elm, 1); } incontextof this, 
		"endtrans", endTrans incontextof this,
		"begin", function(pcd, cd, elm) { beginTrans(pcd, cd, elm, 0); } incontextof this,
		"end", endTrans incontextof this,
		"sync", sync incontextof this,
		];

	// 複数オブジェクト操作タグ
	var multiTags = %[
		"init", initTag incontextof this,
		"pushenv", pushenv incontextof this,
		"popenv", popenv incontextof this,
		"rename", rename incontextof this,
		"swap", swap incontextof this,
		"freearea", freearea incontextof this,
		];
	
	function afterSync(cd) {
		entryDelete();
		outputEnvTags(cd);
		// 同期記録用ラベルを導入
		cd.addTag("autolabel", %[runLine:runLine, runCount:runCount]);
		if (delayline) {
			delaysyncline = true;
		}
	}

	/*
	 * オブジェクトフィルタの判定
	 * @param filter フィルタ。関数または正規表現
	 * @param obj 対象オブジェクト
	 * @param elm コマンドパラメータ
	 * @return フィルタ通過なら true
	 */
	function checkFilter(filter, obj, elm) {
		if (filter instanceof "Function") {
			return filter(obj, elm);
		} else if (filter instanceof "RegExp") {
			return filter.test(obj.name);
		}
	}

	/*
	 * オブジェクトのフィルタ処理
	 * @param command フィルタ定義
	 * @param targets 対象オブジェクト一覧
	 * @param elm コマンドパラメータ
	 * @return フィルタ通過した対象オブジェクト
	 */
	function filterTarget(command, targets, elm) {
		// 親フィルタ再帰処理
		var parent;
		if (command.parent != "" && (parent = filterMatch.getInfo(command.parent)) !== void) {
			targets = filterTarget(parent, targets, elm);
		}
		
		var result = [];
		var filter = command.filter;
		for (var i=0;i<targets.count;i++) {
			var obj = targets[i];
			var ok;
			if (filter instanceof "Array") {
				ok = true;
				for (var j=0;j<filter.count;j++) {
					if (!checkFilter(filter[i], obj,elm)) {
						ok = false;
						break;
					}
				}
			} else {
				ok = checkFilter(filter, obj, elm);
			}
			if (ok) {
				result.add(obj);
			}
		}
		// パラメータ除去処理
		if (result.count > 0 && command.remove !== void) {
			var remove = command.remove;
			if (remove instanceof "Array") {
				for (var i=0;i<remove.count;i++) {
					removeTagParam(elm, remove[i]);
				}
			} else {
				removeTagParam(elm, remove);
			}
		}
		return result;
	}
	
	var selflag;

	/**
	 * 同期が必要なコマンドの前でのコマンド出力同期の確認
	 * @param cd
	 * @param elm コマンドタグ
	 * @param msg 入れ子エラー時のメッセージ
	 * @param save 明示同期コマンド直後以外で出力があった場合に保存処理をいれるかどうか
	 * @return 明示的な同期コマンド出力があった場合は 2 そうでない場合は ret
	 */
	function checkOutput(cd, elm, msg, save=false) {
		if (entryCommand(cd)) {
			// コマンドが出力されて同期が必要
			if (elm !== void) {
				cd.enqueueTag(elm);
			}
			return 2;
		}
		if (outputEnvTags(cd, msg)) {
			if (save) {
				cd.addTag("autolabel", %[runLine:runLine, runCount:runCount]);
			}
			if (elm !== void) {
				cd.enqueueTag(elm);
			}
			return save ? 2 : true;
		}
	}

	/**
	 * @return コマンド出力を行うかどうか
	 * 音系オブジェクトは即出力する
	 */
	function checkEntry() {
		if (syncMode) return true;
		return Scripts.foreach(objects, function(name,target) { if (target.isUpdate() && (target.syncMode || !(target instanceof "KAGEnvTrans"))) return true; });
	}

	/**
	 * コマンド実行処理
	 * @param elm タグ
	 * @param init 初期化させるかどうか (プラグインから呼び出したりする場合は false を指定して初期化処理をスルーさせる)
	 */
	function execCommand(elm, init=true) {
		var tagname = elm.tagname;
		var command;
		if ((command = multiTags[tagname]) !== void) {
			// 複数オブジェクト操作コマンド
			initCommand() if init;
			command(elm);
		} else if (tagname == "all" || (command = filterMatch.getInfo(tagname)) !== void) {
			// フィルタコマンド系
			var targets = [];
			Scripts.foreach(objects, function(name,obj,targets) {
				if (!obj.deleteFlag) {
					targets.add(obj);
				}
			}, targets);
			if (tagname == "all") {
				command = true;
				allFilter(targets, elm);
			} else {
				targets = filterTarget(command, targets, elm);
			}
			if (targets.count > 0) {
				// 処理対象のオブジェクトが存在
				initCommand() if init;
				for (var i=0;i<targets.count;i++) {
					targets[i]._command(elm);
				}
			}
		} else if (kag.mainConductor.handlers[tagname] === void && (command = getCommandTarget(tagname, elm)) !== void) {
			if (command != null) {
				initCommand() if init;
				command._command(elm);
			}
		}
		return command !== void;
	}

	
	// タグ展開処理
	function onTagExtract(pcd, cd, elm) {
		if (pcd === void) {
			// 初期化処理
			sflags.clear();
			entryTags.clear();
			selflag = false;
			transMode = 0;
			return;
		}
		if (elm === void) {
			// 終端処理
			selflag = false;
			return checkOutput(cd, elm, "終端");
		}

		runLine = elm.runLine;
		runCount = elm.runCount;
		//dm(@"---env:onTagExtract:${elm.tagname}");
		if (transMode) {
			if (elm.delayrun !== void) {
				if (elm.delayrun.charAt(0) == "w") {
					errorCmd(@"begin～end中にテキストが混入しています:${elm.tagname}の前");
				} else {
					errorCmd(@"begin～end中にdelayrun 指定があります:${elm.tagname}:${elm.delayrun}");
				}
			}
		} else {
			// begintrans の指定のみを取得
			if (elm.delayrun !== delayrun) {
				// コマンド分離が必要
				entryCommand(cd);
				delayrun = elm.delayrun;
				nodelaydone = elm.nodelaydone;
				if (delayrun !== void) {
					delayline = true;
					if (delaysyncline) {
						errorCmd(@"警告:「文」内で同期命令(sync/wait)前後にdelayrunがあります。コンバート時のセーブ情報が不適切になります:${elm.tagname}");
						delaysyncline = false;
					}
				}
			}
		}
		var tagname = elm.tagname;
		var func = extractTags[tagname];
		if (func !== void) {
			initCommand();
			if (func(pcd, cd, elm)) {
				// コマンドを反映
				return 2;
			}
			return true;
		}
		switch (tagname) {
		case "systrans":
			// 強制中断
			return;
		case "clearlayers":
			initCommand();
			onClear(elm.page);
			break;
		case "stopaction":
			// タグ連動で情報を消去しておく
			// オブジェクトの実際のアクション停止は "stopaction" コマンドで適切に行われる
			initCommand();
			onStopAction(elm.all);
			break;
		case "msgon":
		case "msgoff":
			// メッセージ窓前処理
			initCommand();
			forEachEventHook("onEnvParseMsgOnOff",, pcd, cd, elm, this);
			if (transMode) {
				msgchange = tagname == "msgon";
				return true;
			}
			break;
		case "startline":
			// 行開始時処理
			if (delayline && !delaysyncline) {
				errorCmd("警告: delayrun 後、同期(sync/wait/テキスト)が無いまま次の「文」に到達しています。顔窓処理とからんでコンバート時の保存情報が不適切になる場合があります");
			}
			currentTarget = elm.name;
			delayline = false;
			delaysyncline = false;
			initCommand();
			forEachEventHook("onEnvParseStartLine",, pcd, cd, elm, this);
			// 名前表示の前で残りタグを展開
			return checkOutput(cd, elm, "行開始前");
		case "starttext":
			// テキスト開始時処理
			if (delayline) {
				delaysyncline = true;
			}
			initCommand();
			forEachEventHook("onEnvParseStartText",, pcd, cd, elm, this);
			return checkOutput(cd, elm, "テキスト開始前");
		case "dispname":
		case "ch":
			// 文字表示があった場合は残りタグを展開してそのままスルー
			return checkOutput(cd, elm, "テキスト表示前");
		case "p":
			// 改頁時はアクション情報をクリア
			entryCommand(cd);
			onStopAction(false);
			cd.enqueueTag(elm);
			entryDelete();
			return 2;
		case "eval":
		case "set":
			return checkOutput(cd, elm, "変数処理前");
		case "selhead":
		case "seladd":
		case "mseladd":
			// 選択肢があった場合は追加タグ処理と残りタグ展開してそのままスルー
			if (!selflag) {
				selflag = true;
				initCommand();
				forEachEventHook("onEnvParseSelect",, pcd, cd, elm, this);
				return checkOutput(cd, elm, "選択肢処理前");
			}
			return;
		case "select":
			selflag = false;
			return;
		}
		if (brTags[tagname]) {
			return checkOutput(cd, elm, @"分岐系タグ前:${tagname}");
		}

		if (LineModeEx.waitTags[tagname]) {
			delaysyncline = true;
			var ret = checkOutput(cd, elm, @"待ち系タグ前:${tagname}", true);
			if (ret !== void) {
				return ret;
			}
			// コマンドを反映
			cd.enqueueTag(elm);
			return 2;
		}

		var cmdtype;
		// 追加特種タグの処理
		if (envinfo.excommands !== void && (cmdtype = envinfo.excommands[tagname]) !== void) {
			if (cmdtype == COMMAND_SAVE) {
				return checkOutput(cd, elm, @"保存系タグ前:${tagname}");
			}
		}

		if (execCommand(elm)) {
			// コマンド実行された
			doneCommand(elm);
			// 同期コマンドがあるかそ自体が delayrun 対象なら出力
			if ((delayrun !== void || checkEntry()) && entryCommand(cd)) {
				return 2;
			}
			return true;
		}

		// 一般タグは begintrans の最中は内部に蓄える
		if (transMode) {
			if (embedTag(elm)) {
				return true;
			}
		} else {
			// 一旦出力
			entryCommand(cd);
		}

		// 既にタグが積み上がってる場合は合わせて積む
		if (entryTags.count > 0) {
			throughEnvTag(elm);
			return true;
		}
	}
	

 	// ------------------------------------------------------------------

	/**
	 * 初期化済みオブジェクトの取得
	 * オブジェクトは初期化処理まで行う
	 * @param name 名前
	 * @parem create 無い場合に生成する
	 */
	function getInitedObject(name, create=true) {
		var obj = objects[name];
		if (create && (obj === void || obj.deleteFlag) && isExistEnvObject(name)) {
			var e = %[taglist:[]];
			obj = getEnvObject(name, e);
			obj._command(e);
		}
		return obj;
	}

	/**
	 * 画像オブジェクトを取得
	 * オブジェクトは初期化処理まで行う
	 * @param name 名前
	 * @parem create 無い場合に生成する
	 */
	function getImageObject(name, create=true) {
		var obj = getInitedObject(name, create);
		if (obj !== void && obj instanceof "KAGEnvImage") {
			return obj;
		}
		return void;
	}

	function isExistentImageFile(storage, onlyFile=true) {
		var ext = Storages.extractStorageExt(storage).toUpperCase();
		if (ext != "") {
			// AffineSourceLayerに定義あり
			return extSourceMap[ext] !== void && Storages.isExistentStorage(storage);
		} else {
			return (world.getImageDiffInfo(storage) !== void ||
					Storages.isExistentStorage(storage + ".png") ||
					Storages.isExistentStorage(storage + ".tlg") ||
					Storages.isExistentStorage(storage + ".bmp") ||
					Storages.isExistentStorage(storage + ".jpg") ||
					Storages.isExistentStorage(storage + ".emf") ||
					Storages.isExistentStorage(storage + ".stage") ||
					Storages.isExistentStorage(storage + ".stand") ||
					Storages.isExistentStorage(storage + ".event") ||
					(!onlyFile && world.isExistMotion(storage)));
		}
	}

	function isExistentMusicFile(storage) {
		return (Storages.isExistentStorage(storage + ".wav") ||
				Storages.isExistentStorage(storage + ".ogg") ||
				Storages.isExistentStorage(storage + ".opus"));
	}

	
	/**
	 * タグ名から処理対象オブジェクトを特定して返す
	 * @param tagName タグ名
	 * @param elm パラメータ(上書きされる場合があります)
	 */
	function getCommandTarget(tagName, elm) {
		
		switch (tagName) {
		case "env":
			return this;
		case "object":
			if (elm.name !== void) {
				return getEnvObject(elm.name, elm);
			} else {
				errorCmd("オブジェクト名が指定されていません");
				return null;
			}
		}

		// 既存のオブジェクト
		var obj = getEnvObject(tagName);
		if (obj !== void) {
			return obj;
		}

		// 明示的な作成指定、または、定義済みの名前だった場合は自動生成
		if (elm["class"] !== void || elm.init !== void || isExistEnvObject(tagName)) {
			return getEnvObject(tagName, elm, true);
		}
		
		// 場所/時間指定/アクション指定なら、標準ターゲットのコマンドとして実行
		if (stages !== void && stages[tagName] !== void ||
			times !== void && times[tagName] !== void ||
			isExistAction(tagName)) {
			insertTagParam(elm, tagName, true);
			if (envinfo.defaultTarget !== void) {
				return getEnvObject(envinfo.defaultTarget, elm);
			}
			return this;
		}
		
		// 環境コマンドか加工操作なら env のコマンドとして実行
		if (envCommands[tagName] !== void || rpropNameMap[tagName] !== void || getModifyObject(tagName) !== void) {
			insertTagParam(elm, tagName, true);
			return this;
		}

		// タグ名をファイルとして処理対象にするオブジェクトが存在すればそれに処理をまかせる
		var info = filenameMatch.getInfo(tagName);
		if (info !== void && info.object !== void) {
			var name;
			if (info.name instanceof "RegExp" && info.object.indexOf("\\") >= 0) {
				// 対象中の \1 などを置換する置換処理
				name = info.object;
				var m = info.name.matches;
				var c = m.count;
				for (var i=1;i<c;i++) {
					name = name.replace(new RegExp("\\\\%d".sprintf(i)), m[i]);
				}
			} else {
				name = info.object;
			}
			//dm(@"check file ${tagName} target:${name}");
			var obj = getEnvObject(name, elm);
			if (obj !== void) {
				insertTagParam(elm, "storage", tagName);
				return obj;
			}
		}
		
		// 現在の話者に対する操作として処理できるコマンドなら実行
		if (currentTarget != "" && isExistEnvObject(currentTarget)) {
			var ret = getInitedObject(currentTarget);
			if (ret.doCommand(tagName, true, elm, false)) {
				insertTagParam(elm, tagName, true);
				return ret;
			}
		}
		
		return void;
	}

    /**
	 * アクション停止
	 */
	function onStopAction(all=true) {
		// レイヤ系
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			var layer = layerList[i];
			if (layer.currentActionList.count > 0) {
				layer.clearAction(all);
				if (layer.currentActionList.count == 0) {
					stoplist.add(layer.name);
				}
			}
		}
		// サウンド系は止める必要なし
		// env
		if (currentActionList.count > 0) {
			clearAction(all);
			if (currentActionList.count == 0) {
				stoplist.add(name);
			}
		}
	}
	
	// -----------------------------------------------------------------
	// 立ち絵情報参照用
	// -----------------------------------------------------------------

	/**
	 * ポーズがあるキャラクタ名一覧の取得
	 */
	function getCurrentPoseCharacterNames() {
		var ret = [];
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			var layer = layerList[i];
			if ((layer.classFlag & FLAG_STAND)) {
				ret.add(%[name:layer.name, initName:layer.initName]);
			}
		}
		ret.sort(function(a,b){return a.name < b.name;});
		return ret;
	};

	// ---------------------------------------------------------

	function resetColor(elm) {
		clearRedrawProps();
		setRedrawProp("timename", time); // 色指定更新
		setRedraw();
	}
	
	function resetCamera(elm) {
		resetProp(["camerax", "cameray", "cameraz", "camerazoom", "camerarotate", "shiftx", "shifty", "zoomx", "zoomy", "zcenterx", "zcentery"], elm);
		// アクションも止める
		stopAction();
	}

	function resetCameraOrigin(elm) {
		resetProp(["cameraox", "cameraoy"], elm);
	}

	function resetMessage(elm) {
		resetProp(["msgoffx", "msgoffy"], elm);
	}

	function resetWind(elm) {
		resetProp(["windstart", "windgoal", "windspeed", "windmin", "windmas"], elm);
	}
	
	function reset(elm) {
		resetColor(elm);
		resetCamera(elm);
		resetCameraOrigin(elm);
		resetMessage(elm);
		resetWind(elm);
	}
	
	function stopCamera() {
		stopAction();
	}

	// ------------------------------------------------------
	// タグ処理
	// ------------------------------------------------------

	// コマンド前処理
	function initCommand() {
		if (!transMode && !isEntryCommand) {
			super.initCommand();
			Scripts.foreach(objects, function(name,obj) { obj.initCommand(); });
		}
	}

	/**
	 * トランジション設定
	 */
	function setupTrans() {

		// フラグの判定
		var charoff = isCharoff();
		msgoff = isMsgoff();
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			var layer = layerList[i];
			if (layer.isCharoff()) {
				charoff = true;
			}
			if (layer.isMsgoff()) {
				msgoff = true;
			}
		}

		// キャラ消去副作用
		if (charoff) {
			for (var i=0;i<count;i++) {
				var layer = layerList[i];
				// キャラ消去
				if ((layer.classFlag & FLAG_STAND) && layer.isShow()) {
					layer.setDisp(KAGEnvImage.CLEAR, EMPTY);
				}
			}
		}
		// メッセージ窓消去時副作用
		if (msgoff) {
			forEachEventHook("onEnvTransMsgoff",, this);
		}

		// トランジションの対象を決定
		super.setupTrans();
		transTarget = void;
		if (transMode && !(trans == "" || trans == "none")) {
			transTarget = this;
		}
		count = layerList.count;
		for (var i=0;i<count;i++) {
			var layer = layerList[i];
			layer.setupTrans();
			if (transTarget === void && layer.isUpdate() && layer.transall) {
				transTarget = layer;
			}
		}

		// 全体トランジションが実行されるかどうか
		var transall = transTarget !== void && transTarget.trans !== void;
		for (var i=0;i<count;i++) {
			// トランジション補正
			layerList[i].checkTrans(transall);
		}

	}

	var isEntryCommand;

	/**
	 * コマンド後処理
	 * @param elm タグパラメータ
	 * @return 全体トランジション処理を実行するかどうか
	 */
	function doneCommand(elm) {

		// 後実行コマンド
		afterCommand(elm);
		Scripts.foreach(objects, function(name,obj,elm) { obj.afterCommand(elm); }, elm);
		
		isEntryCommand = true;
	}
	
	/**
	 * 全体トランジション時のアクション処理
	 * 背景/イベント絵/ONLYIMAGE なものには作用しない
	 */
	function setTransAction(trans) {
		if (trans.showaction !== void || trans.hideaction !== void || trans.action !== void) {
			var acttime;
			var count = layerList.count;
			for (var i=0;i<count;i++) {
				var lay = layerList[i];
				if (!(lay.classFlag & (FLAG_EVENT|FLAG_STAGE|FLAG_ONLYIMAGE))) {
					var time = lay.setTransAction(trans);
					if (time !== void) {
						acttime = time if acttime === void || time > acttime;
					}
				}
			}
			if (trans.time === void) {
				trans.time = acttime;
			}
			delete trans.showaction if trans.showaction !== void;
			delete trans.hideaction if trans.hideaction !== void;
			delete trans.action if trans.action !== void;
		}
    }

	// ----------------------------------------------------
	// 状態を全更新する
	
	function refresh() {
		var f = %[];
		onStore(f);
		onRestore(f, false, void, false);
	}

	// ----------------------------------------------------
	// 特殊レイアウト制御用
	// ----------------------------------------------------

	/**
	 * 現在表示されているキャラクタオブジェクトを左から順に返す
	 * @param cond 比較関数。引数にキャラクタをとる
	 * @return 条件に合致したキャラクタのリスト
	 */	  
	function getShowCharacters(cond) {
		var ret = [];
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			var ch = layerList[i];
			if ((ch.classFlag & FLAG_STAND) && ch.isShow() && (cond === void || cond(ch))) {
				ret.add(ch);
			}
		}
		ret.sort(function(a,b) {return a.xpos < b.xpos;});
		return ret;
	}

	/**
	 * キャラクタ追加表示時のレイアウト処理
	 * @param ch 対象キャラクタ
	 * @param layInfo レイアウト情報
	 */
	function layoutCharacter(ch, cmd, layInfo, elm) {
		// 定義が無い
		var layouts = envinfo["layouts_" + layInfo.type];
		if (layouts === void) {
			error(@"レイアウト情報が存在しません:${layInfo.type}");
			return;
		}
		var list = getShowCharacters(function(layer) { return layer != ch; } incontextof %[ch:ch]);

		//dm(@"layInfo.trans:${layInfo.trans} count:${list.count} pos:${layInfo.pos}");
		
		// 目的キャラの配置
		var pos;
		switch (layInfo.pos) {
		case "left":
			list.unshift(ch);
			pos = 0;
			break;
		case "center":
			pos = (int)((list.count + 1) / 2);
			list.insert(pos, ch);
			break;
		default:
		case "right":
			list.push(ch);
			pos = list.count - 1;
			break;
		case "hide":
			{
				// 消去
				//dm(@"${ch.name}:消去処理");
				var posInfo = %[disp:KAGEnvImage.CLEAR];
				posInfo.trans = layInfo.trans if layInfo.trans !== void;
				ch.setPosInfo(cmd, posInfo, elm);
			}
			break;
		}

		// レイアウト調整
		var add;
		var ret;
		if (list.count > 0) {
			var layout = layouts[list.count-1];
			if (layout !== void) with (layout) {
				var count = list.count;
				for (var i=0;i<count;i++) {
					var posInfo = %[];
					if (.xpos !== void && .xpos[i] !== void) {
						posInfo.xpos =  .xpos[i];
					}
					var trans;
					if (pos !== void && i == pos) {
						// 表示キャラは layInfo の指定がデフォルト
						trans = .dispTrans !== void ? .dispTrans : .trans !== void ? .trans : layInfo.trans;
					} else {
						// それ以外はデフォルトは未指定(time指定での移動)
						trans = .dispTrans !== void ? .dispTrans : .trans;
					}
					if (.level !== void && list[i].level != .level) {
						// レベル指定
						posInfo.level =  .level;
						if (.leveltrans !== void) {
							trans = .leveltrans;
						}
					} else if (.zpos !== void  && list[i].zpos != .zpos) {
						// zpos指定
						posInfo.zpos = .zpos;
						if (.zpostrans !== void) {
							trans = .zpostrans;
						}
					}
					if (layInfo.reload !== void) {
						posInfo.reload = layInfo.reload;
					}
					if (trans !== void) {
						posInfo.trans = trans;
					} else if (.time !== void) {
						posInfo.time = .time;
					}
					//dm(@"${list[i].name} trans:${posInfo.trans} time:${posInfo.time}");
					list[i].setPosInfo(cmd, posInfo, elm);
				}
			} else {
				error(@"指定人数のレイアウト情報が存在しません:${layInfo.type}:${list.count}");
			}
		}
	}
	
	/**
	 * 指定位置にキャラがいない空間をつくる
	 * @param elm パラメータ
	 *  pos 位置指定
	 *  space 開ける空間
	 * ※他のパラメータはそのまま展開タグに割り当て
	 */
	function freearea(elm) {
		var xpos = elm.pos;
		if (typeof xpos == "String") {
			if (positions[xpos] !== void) {
				xpos = positions[xpos].xpos;
			} else {
				xpos = +elm.pos;
			}
		}
		var space = (elm.space !== void ? +elm.space : 200) / 2;
		//dm(@"間をあける処理:${xpos}:${space}");
		var e = %[];
		(Dictionary.assign incontextof e)(elm);
		delete e.space;
		delete e.pos;
		delete e.tagname;
		delete e.taglist;
		var list, count;
		list  = getShowCharacters(function(layer) { return layer.xpos <= xpos; } incontextof %[xpos:xpos]);
		count = list.count;
		for (var i=0;i<count;i++) {
			list[i].setPropValue("xpos", @"@-${space}", e);
		}
		list = getShowCharacters(function(layer) { return layer.xpos > xpos; } incontextof %[xpos:xpos]);
		count = list.count;
		for (var i=0;i<count;i++) {
			list[i].setPropValue("xpos", @"@+${space}", e);
		}
	}
};

