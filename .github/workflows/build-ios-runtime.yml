			removeTagParam(elm, "onclass");
			for (var i=targets.count-1;i>=0;i--) {
				var target = targets[i];
				if (target.classInfo.name != name) {
					targets.erase(i);
				}
			}
		}
		
		// 場所指定で限定
		if (elm.onpos !== void) {
			var posName = elm.onpos;
			removeTagParam(elm, "onpos");
			for (var i=targets.count-1;i>=0;i--) {
				var target = targets[i];
				if (target instanceof "KAGEnvImage" && target.posName != posName) {
