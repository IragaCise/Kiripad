              "maxPages", "maxLines", "storeState",
              "frameOpacity", "actionIndent", "nameIndent",
              "historyOverColor", "stopVoiceAtOpen", "stopVoiceAtClose"
          ]))
          print("===== 2A.40b patched source window =====")
          for n in range(lo, hi):
              print(f"{n+1:5d}: {lines[n]}")
          print("===== end window =====")

