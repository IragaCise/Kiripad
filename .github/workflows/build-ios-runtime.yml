	}


	// -----------------------------------------------------------------------------------------------------

	// --------------------------------------------------------------------
	// タグ生成処理
	// --------------------------------------------------------------------

	function getUpdateData(force) {
		var isset = false;
		var elm = %[];
		var act = [];
		if (force) {
			setInitProps(act);
			isset = true;
			if (currentActionList.count > 0) {
				act.push(currentActionList*);
			}
		}
		if (actionList.count > 0) {
			act.push(actionList*);
		}
		if (act.count > 0) {
			elm.action = act;
			isset = true;
		}
		if (isset) {
			elm.name = name;
		}
		return elm;
	}

	/*
	 * オブジェクト更新用のタグを生成する
	 */
	function entryUpdate(target) {
		if (target.isUpdate()) {
			var update = target.getObjUpdateData();
			if (update !== void && Scripts.getObjectCount(update) > 0) {
				addUpdateTag(update);
			}
		}
	}
	
	// 更新情報をエントリする
	function entryUpdateAll() {
		//dm(@"call entryUpdate:${Scripts.getTraceString()}");
		Scripts.foreach(objects, function(name,target) { entryUpdate(target); });
		entryUpdate(this);
	}

	// トランジション外更新のレイヤのみ更新情報をエントリする
	function entryUpdateAllNoTrans() {
		//dm(@"call entryUpdate:${Scripts.getTraceString()}");
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			var target = layerList[i];
			if (target.isNoTrans()) {
				// トランジション対象外は事前更新
				entryUpdate(target);
			}
		}
	}

	/**
	 * envのコマンドタグを纏めて出力する
	 * @param cd 出力先コンダクタ
	 * @return 同期コマンドだったら真
	 */
	function entryCommand(cd) {
		if (isEntryCommand) {
			if (!transMode) {
				setupTrans();
				if (transTarget !== void) {
					//dm(@"${transTarget.name}:画面トランジションつき更新:${Scripts.getTraceString()}");
					// トランジション外の更新を事前出力
					entryUpdateAllNoTrans();
					if (updatelist.count > 0) {
						pretranslist.push(updatelist*);
						updatelist.clear();
					}
				}
				entryUpdateAll();
				isEntryCommand = false;
				if (outputTag(transTarget)) {
					afterSync(cd);
					return true;
				}
			}
		}
		return false;
	}
	
    /**
	 * 全体トランジション開始
	 */
	function beginTrans(pcd, cd, elm, type) {
		if (transMode == 0) {
			transType = type;
			msgchange = void;
			dm(@"================ begintrans ===================", tkdlVerbose);
			checkOutput(cd, void, "begintrans前", true);
		}
		transMode++;
    }

	/**
	 * 全体トランジション終了:下請け
	 * @return true/false syncMode void 処理なし
	 */
	function _endTrans(cd, elm) {
		var issync = false;
		if (transMode <= 1) {
			// タグ処理
			var names = elm.taglist;
			if (names === void) {
				names = Scripts.getObjectKeys(elm);
			}
			var count = names.count;
			for (var i=0;i<count;i++) {
				var cmd = names[i];
				// 親のコマンド処理は実行する。結果的に
				// KAGEnvBase: sync 指定他
				// KAGEnvTrans: 加工系プロパティ処理
				// は記述として有効になる
				if (!doCommand(cmd, elm[cmd], elm)) {
					var param = elm[cmd];
					if (cmd == "trans") {
						if (typeof param == "Object" && param instanceof "Dictionary") {
							trans = param;
						} else {
							setTrans(param, elm);
						}
					} else if (!doTrans(cmd, elm)) {
						errorCmd(name + ":未知のコマンド:" + cmd);
					}
				}
			}
			
