                  };

                  for(const tjs_char *kiriPad2A39ClassName : kiriPad2A39Classes) {
                      tTJSVariant kiriPad2A39ClassValue;
                      tjs_error kiriPad2A39GetClass =
                          kiriPad2A39Global->PropGet(
                              TJS_MEMBERMUSTEXIST,
                              kiriPad2A39ClassName,
                              NULL,
                              &kiriPad2A39ClassValue,
                              kiriPad2A39Global);

                      if(TJS_FAILED(kiriPad2A39GetClass) ||
                         kiriPad2A39ClassValue.Type() != tvtObject) {
                          TVPAddImportantLog(
                              ttstr(TJS_W("(info) KiriPad 2A.39 class not found: ")) +
                              kiriPad2A39ClassName);
                          continue;
                      }

                      tTJSVariantClosure kiriPad2A39Closure =
                          kiriPad2A39ClassValue.AsObjectClosureNoAddRef();

                      if(!kiriPad2A39Closure.Object) {
                          TVPAddImportantLog(
                              ttstr(TJS_W("(info) KiriPad 2A.39 class has no object: ")) +
                              kiriPad2A39ClassName);
                          continue;
                      }

                      iTJSDispatch2 *kiriPad2A39Obj =
                          kiriPad2A39Closure.Object;
                      iTJSDispatch2 *kiriPad2A39This =
                          kiriPad2A39Closure.ObjThis
                              ? kiriPad2A39Closure.ObjThis
                              : kiriPad2A39Closure.Object;

                      const tjs_char *kiriPad2A40bMembers[] = {
                          TJS_W("fontName"),
                          TJS_W("fontBold"),
                          TJS_W("fontHeight"),
                          TJS_W("lineHeight"),
