	function toAbsoluteNo(layer, no) {
		var list = getSameLinkLayers(layer);
		var count = list.count;
		if (no < 0) {
			no = count + no;
		}
		if (no >= 0 && no < count) {
			var list = [];
			list.sort(function(a,b){return a.absolute < b.absolute;});
