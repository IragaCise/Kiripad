			removeTagParam(elm, "onvisible");
		}
		if (onvisible !== "all") {
			for (var i=targets.count-1;i>=0;i--) {
				var target = targets[i];
				if (target instanceof "KAGEnvImage" && target.isShow() != +onvisible) {
					targets.erase(i);
				}
			}
		}

