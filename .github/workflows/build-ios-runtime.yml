          python3 - <<'PY'
          from pathlib import Path
          import re

          marker = "KiriPad 2A.45c SearchPlacedPath base.stage"
          target_path = None
          target_text = None
          sig_match = None

          for p in Path("cpp").rglob("*.cpp"):
              try:
                  body = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              m = re.search(
                  r'\bttstr\s+TVPSearchPlacedPath\s*\(\s*'
                  r'const\s+ttstr\s*&\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)',
                  body,
                  re.S,
              )
              if m:
                  if target_path is not None:
                      raise SystemExit(
                          f"2A.45c: multiple TVPSearchPlacedPath definitions: "
                          f"{target_path} and {p}"
                      )
                  target_path = p
                  target_text = body
                  sig_match = m

          if target_path is None:
              raise SystemExit("2A.45c: TVPSearchPlacedPath definition not found")

          if marker in target_text:
              raise SystemExit("2A.45c marker already present unexpectedly")

          param_name = sig_match.group(1)
          open_brace = target_text.find("{", sig_match.end())
          if open_brace < 0:
              raise SystemExit("2A.45c: function opening brace not found")

          inject = f'''
              // {marker}
          #if defined(__APPLE__)
              if({param_name} == TJS_W("base.stage")) {{
                  const ttstr kiriPad2A45cCandidate =
                      TVPGetAppPath() + TJS_W("bgimage.xp3>base.stage");

                  bool kiriPad2A45cExists = false;
                  try {{
                      kiriPad2A45cExists =
                          TVPIsExistentStorageNoSearch(kiriPad2A45cCandidate);
                  }} catch(...) {{
                      kiriPad2A45cExists = false;
                  }}

                  TVPAddImportantLog(
                      ttstr(TJS_W("(info) KiriPad 2A.45c base.stage candidate='")) +
                      kiriPad2A45cCandidate +
                      (kiriPad2A45cExists
                          ? TJS_W("' exists=YES")
                          : TJS_W("' exists=NO")));

                  if(kiriPad2A45cExists) {{
                      TVPAddImportantLog(
                          TJS_W("(info) KiriPad 2A.45c base.stage resolved from bgimage.xp3"));
                      return kiriPad2A45cCandidate;
                  }}
              }}
          #endif
          '''

          patched = (
              target_text[:open_brace + 1]
              + inject
              + target_text[open_brace + 1:]
          )
          target_path.write_text(patched, encoding="utf-8")

          verify = target_path.read_text(encoding="utf-8")
          required = (
              marker,
              'TJS_W("base.stage")',
              'TJS_W("bgimage.xp3>base.stage")',
              "TVPGetAppPath()",
              "TVPIsExistentStorageNoSearch(kiriPad2A45cCandidate)",
              "base.stage resolved from bgimage.xp3",
              "return kiriPad2A45cCandidate;",
          )
          for token in required:
              if token not in verify:
                  raise SystemExit(f"2A.45c verification failed: {token}")

          print(f"Patched before engine build: {target_path}")
          print(f"TVPSearchPlacedPath parameter: {param_name}")
          print("Expected base.stage UTF-16LE MD5: c7333ba1f8a6800780996de1e85c747a")
          PY

      - name: Phase 2A.47 restore YUZUSOFT logical filenames from XP3 index
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("cpp/core/base/XP3Archive.cpp")
          text = path.read_text(encoding="utf-8")

          marker = "KiriPad 2A.47 Yuzu logical filename restore"
          if marker in text:
              raise SystemExit("2A.47 marker already present unexpectedly")

          count_anchor = "int segmentcount = 0;"
          if text.count(count_anchor) != 1:
              raise SystemExit(
                  f"2A.47: segmentcount anchor count={text.count(count_anchor)}"
              )

          text = text.replace(
              count_anchor,
              count_anchor
              + "\n\n#if defined(__APPLE__)\n"
                "    int kiriPad2A47YuzuNameCount = 0;\n"
                "#endif",
              1,
          )

          file_find_re = re.compile(
              r"(?m)^([ \t]*)// find 'File' chunk\s*\n"
              r"([ \t]*)if\(!FindChunk\(indexdata,\s*cn_File,\s*"
              r"ch_file_start,\s*ch_file_size\)\)"
          )
          matches = list(file_find_re.finditer(text))
          if len(matches) != 1:
              raise SystemExit(
                  f"2A.47: File FindChunk anchor count={len(matches)}"
              )

          m = matches[0]
          indent = m.group(1)
          if_indent = m.group(2)
          replacement = (
              f"{indent}// find 'File' chunk\n"
              "#if defined(__APPLE__)\n"
              f"{if_indent}const tjs_uint kiriPad2A47SearchStart = ch_file_start;\n"
              "#endif\n"
              f"{if_indent}if(!FindChunk(indexdata, cn_File, "
              "ch_file_start, ch_file_size))"
          )
          text = text[:m.start()] + replacement + text[m.end():]

          name_anchor = "item.Name = name;"
          if text.count(name_anchor) != 1:
              raise SystemExit(
                  f"2A.47: item.Name anchor count={text.count(name_anchor)}"
              )

          restore_block = r'''
          #if defined(__APPLE__)
                            // KiriPad 2A.47 Yuzu logical filename restore
                            //
                            // YUZUSOFT puts a top-level Yuzu chunk immediately before
                            // each protected File chunk:
                            //   u32 metadata
                            //   u16 UTF-16 code-unit count
                            //   UTF-16 logical path
                            //   trailing NUL
                            //
                            // FindChunk skips unknown top-level chunks. Inspect the
                            // skipped range and restore that logical path.
                            if(ch_file_start >= 12) {
                                const tjs_uint kiriPad2A47FileHeaderStart =
                                    ch_file_start - 12;
                                tjs_uint kiriPad2A47Scan =
                                    kiriPad2A47SearchStart;

                                while(kiriPad2A47Scan + 12 <=
                                      kiriPad2A47FileHeaderStart) {
                                    const tjs_uint8 *kiriPad2A47Header =
                                        indexdata + kiriPad2A47Scan;

                                    const tjs_uint64 kiriPad2A47RawChunkSize =
                                        (tjs_uint64)ReadI64FromMem(
                                            kiriPad2A47Header + 4);

                                    const tjs_uint64 kiriPad2A47Remain =
                                        (tjs_uint64)(
                                            kiriPad2A47FileHeaderStart -
                                            kiriPad2A47Scan - 12);

                                    if(kiriPad2A47RawChunkSize >
                                       kiriPad2A47Remain) {
                                        break;
                                    }

                                    const tjs_uint kiriPad2A47ChunkSize =
                                        (tjs_uint)kiriPad2A47RawChunkSize;
                                    if((tjs_uint64)kiriPad2A47ChunkSize !=
                                       kiriPad2A47RawChunkSize) {
                                        break;
                                    }

                                    if(!memcmp(kiriPad2A47Header, "Yuzu", 4) &&
                                       kiriPad2A47ChunkSize >= 8) {
                                        const tjs_uint kiriPad2A47DataStart =
                                            kiriPad2A47Scan + 12;

                                        const tjs_uint16 kiriPad2A47NameLen =
                                            (tjs_uint16)ReadI16FromMem(
                                                indexdata +
                                                kiriPad2A47DataStart + 4);

                                        const tjs_uint64 kiriPad2A47Needed =
                                            6 +
                                            (tjs_uint64)kiriPad2A47NameLen * 2;

                                        if(kiriPad2A47Needed <=
                                           (tjs_uint64)kiriPad2A47ChunkSize) {
                                            ttstr kiriPad2A47Logical =
                                                TVPStringFromBMPUnicode(
                                                    (const tjs_uint16 *)(
                                                        indexdata +
                                                        kiriPad2A47DataStart + 6),
                                                    kiriPad2A47NameLen);

                                            if(!kiriPad2A47Logical.IsEmpty()) {
                                                item.Name = kiriPad2A47Logical;
                                                kiriPad2A47YuzuNameCount++;
                                            }
                                        }
                                    }

                                    kiriPad2A47Scan +=
                                        12 + kiriPad2A47ChunkSize;
                                }
                            }
          #endif
          '''

          text = text.replace(
              name_anchor,
              name_anchor + restore_block,
              1,
          )

          sort_anchor = "std::stable_sort(ItemVector.begin(), ItemVector.end());"
          if text.count(sort_anchor) != 1:
              raise SystemExit(
                  f"2A.47: sort anchor count={text.count(sort_anchor)}"
              )

          log_block = r'''
          #if defined(__APPLE__)
                        if(kiriPad2A47YuzuNameCount > 0) {
                            TVPAddLog(
                                ttstr(
                                    TJS_W(
                                        "(info) KiriPad 2A.47 Yuzu logical filenames restored=")) +
                                ttstr(kiriPad2A47YuzuNameCount));
                        }
          #endif
          '''

          text = text.replace(
              sort_anchor,
              sort_anchor + log_block,
              1,
          )

          path.write_text(text, encoding="utf-8")

          verify = path.read_text(encoding="utf-8")
          required = (
              "KiriPad 2A.47 Yuzu logical filename restore",
              "kiriPad2A47SearchStart",
              '"Yuzu"',
              "kiriPad2A47NameLen",
              "TVPStringFromBMPUnicode",
              "Yuzu logical filenames restored=",
          )
          for token in required:
              if token not in verify:
                  raise SystemExit(
                      f"2A.47 verification failed: {token}"
                  )

          print("Phase 2A.47 XP3 Yuzu filename restoration installed.")
          print("Expected restore counts from supplied archives:")
          print("  data.xp3    : 1938")
          print("  bgimage.xp3 : 108")
          print("  scn.xp3     : 104")
          print("  patch.xp3   : 178")
          print("Normal Kirikiri AutoPath should now see logical paths.")
          PY

