      - name: Probe raw startup.tjs bytecode container
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("cpp/core/base/ScriptMgnIntf.cpp")
          text = path.read_text(encoding="utf-8")

          marker = "KiriPad 2A.28.1 startup raw"
          if marker in text:
              raise SystemExit("2A.28.1 bytecode probe already present unexpectedly")

          # Match the actual two-line LoadByteCode call without depending on
          # exact indentation/spacing from the pinned source.
          rx = re.compile(
              r'(?P<indent>[ \t]*)bool\s+isbytecode\s*=\s*'
              r'TVPScriptEngine->LoadByteCode\s*\(\s*'
              r'stream\.get\(\)\s*,\s*result\s*,\s*context\s*,\s*'
              r'shortname\.c_str\(\)\s*\)\s*;',
              re.S,
          )
          m = rx.search(text)
          if not m:
              # Print nearby source to make any future mismatch obvious.
              anchor = text.find("LoadByteCode")
              if anchor >= 0:
                  print("===== first LoadByteCode source window =====")
                  print(text[max(0, anchor-1000):anchor+1800])
              raise SystemExit("LoadByteCode call insertion point not found")

          indent = m.group("indent")
          original_call = m.group(0)

          pre = r'''
          if(shortname == ttstr(TJS_W("startup.tjs"))) {
              const tjs_uint64 kiriPad2A281Size = stream->GetSize();
              std::vector<tjs_uint8> kiriPad2A281Raw(
                  static_cast<size_t>(kiriPad2A281Size));

              stream->Seek(0, TJS_BS_SEEK_SET);
              if(!kiriPad2A281Raw.empty()) {
                  stream->Read(
                      kiriPad2A281Raw.data(),
                      static_cast<tjs_uint>(kiriPad2A281Raw.size()));
              }
              stream->Seek(0, TJS_BS_SEEK_SET);

              auto kiriPad2A281Hex = [&](size_t begin, size_t count) {
                  std::string out;
                  char tmp[4];
                  const size_t end =
                      std::min(kiriPad2A281Raw.size(), begin + count);
                  for(size_t i = begin; i < end; ++i) {
                      std::snprintf(
                          tmp, sizeof(tmp), "%02X",
                          static_cast<unsigned int>(kiriPad2A281Raw[i]));
                      if(!out.empty())
                          out.push_back(' ');
                      out += tmp;
                  }
                  return out;
              };

              spdlog::info(
                  "KiriPad 2A.28.1 startup raw: size={} head16={}",
                  static_cast<unsigned long long>(kiriPad2A281Raw.size()),
                  kiriPad2A281Hex(0, 16));

              auto kiriPad2A281FindAscii =
                  [&](const char *literal) -> size_t {
                      const std::string key(literal);
                      if(key.empty() || key.size() > kiriPad2A281Raw.size())
                          return std::string::npos;
                      for(size_t i = 0;
                          i + key.size() <= kiriPad2A281Raw.size(); ++i) {
                          bool ok = true;
                          for(size_t j = 0; j < key.size(); ++j) {
                              if(kiriPad2A281Raw[i + j] !=
                                 static_cast<tjs_uint8>(
                                     static_cast<unsigned char>(key[j]))) {
                                  ok = false;
                                  break;
                              }
                          }
                          if(ok)
                              return i;
                      }
                      return std::string::npos;
                  };

              auto kiriPad2A281FindUtf16LE =
                  [&](const char *literal) -> size_t {
                      const std::string key(literal);
                      const size_t bytes = key.size() * 2;
                      if(key.empty() || bytes > kiriPad2A281Raw.size())
                          return std::string::npos;
                      for(size_t i = 0;
                          i + bytes <= kiriPad2A281Raw.size(); ++i) {
                          bool ok = true;
                          for(size_t j = 0; j < key.size(); ++j) {
                              if(kiriPad2A281Raw[i + j * 2] !=
                                     static_cast<tjs_uint8>(
                                         static_cast<unsigned char>(key[j])) ||
                                 kiriPad2A281Raw[i + j * 2 + 1] != 0) {
                                  ok = false;
                                  break;
                              }
                          }
                          if(ok)
                              return i;
                      }
                      return std::string::npos;
                  };

              auto kiriPad2A281Utf16Context = [&](size_t hit) {
                  if(hit == std::string::npos)
                      return std::string("(not found)");
                  size_t begin = hit > 160 ? hit - 160 : 0;
                  begin &= ~static_cast<size_t>(1);
                  const size_t end =
                      std::min(kiriPad2A281Raw.size(), hit + 320);
                  std::string out;
                  for(size_t i = begin; i + 1 < end; i += 2) {
                      const unsigned char lo = kiriPad2A281Raw[i];
                      const unsigned char hi = kiriPad2A281Raw[i + 1];
                      if(hi == 0 && lo >= 0x20 && lo <= 0x7e)
                          out.push_back(static_cast<char>(lo));
                      else if(lo == 0 && hi == 0)
                          out.push_back('|');
                      else
