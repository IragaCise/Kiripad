/**
 * 環境オブジェクト
 */
class KAGEnvironment extends KAGEnvTrans {
	
	/// KAG本体の参照
	var world;

	property kag {
		getter() { return world.kag; }
	}

	property cameraoffsetz {
		getter() { return world.cameraoffsetz; }
	}
	

	function forEachEventHook() { kag.forEachEventHook(...); }
	function forEachFunctionHook() { return kag.forEachFunctionHook(...); }
	
	// zorder 値を zpos 値に変換
	function calcZpos(v) {
		var cz =  -cameraoffsetz;
		return cz / (v/100.0) - cz;
	}

	// zpos 値を zorder 値に変換
	function calcZorderFromZpos(v) {
		var cz =  -cameraoffsetz;
		return cz / (v + cz) * 100;
	}
	
	// level 値を zorder 値に変換
	function calcZorder(v) {
		var count = standLevels.count;
		var z;
		v = +v;
		if (v < 0) {
			if (count > 0) {
				z = v * 50 + standLevels[0].zoom;
			} else {
				z = v * 50;
			}
		} else if (v < standLevels.count) {
			z = standLevels[v].zoom;
		} else {
			if (count > 0) {
				z = (v - count + 1) * 50 + standLevels[count-1].zoom;
			} else {
				z = v * 50 + 50;
			}
		}
		return z;
	}

	// zorder 値を level に変換
	function calcLevel(z) {
		var count = standLevels.count;
		for (var i=0;i<count;i++) {
			var level = standLevels[i];
			if (z <= level.zoom) {
				return i;
			}
		}
		if (count > 0) {
			z = z - standLevels[count-1].zoom;
		} else {
			z = z - 50;
		}
		return count + (int)(z/50);
	}

	// -------------------------------------------------------------
	
	function dm(msg, debugLevel=tkdlSimple) {
		global.dm(...) if (kag.debugLevel >= debugLevel);
	}

	function error() {
		kag.error(...);
	}
	
	function errorCmd() {
		kag.errorCmd(...);
	}

	function errorImage() {
		kag.errorImage(...);
	}

	function errorVoice() {
		kag.errorVoice(...);
	}

	function errorLine() {
		kag.errorLine(...);
	}

	// -----------------------------------------------------------------------------
	// タグ処理
	// -----------------------------------------------------------------------------

	var currentTarget; //< 現在の話者

	var delayline;      // delayrunした行
	var delaysyncline;  // delayrunの後に同期した
	
	var sflags = [];
	
	function setSFlag(name) {
		sflags.add(name);
	}

	var delayrun;
	var nodelaydone = false;
	var entryTags = [];

	var currentData;

	// タグをうめる
	function embedTag(e) {
		var e = Scripts.clone(e);
		// タグに埋め込まれた追加情報は不要
		delete e.taglist  if e.tagList  !== void;
		delete e.runLine  if e.runLine  !== void;
		delete e.runCount if e.runCount !== void;
		addUpdateTag(["tag", e]);
		return true;
	}
	
	function throughEnvTag(e) {
		entryTags.push(Scripts.clone(e));
	}

	var runLine;
	var runCount;

	var transTarget; // トランジション対象
	var msgoff; // トランジション前のメッセージ消去フラグ
	var msgchange; // トランジションの最中にメッセージ窓の状態が変化するフラグ
	var pretranslist = []; // トランジション前更新処理
	var updatelist = []; // 更新処理
	var stoplist   = []; // 停止したオブジェクト一覧
	var waitInfo; // 待ち情報
	
	function addUpdateTag(update) {
		updatelist.add(update);
	}

	// オブジェクトの削除指定の登録
	function entryDelete() {
		initCommand();
		var objnames = Scripts.getObjectKeys(objects);
		if (objnames.count > 0) {
			for (var i=0;i<objnames.count;i++) {
				var name = objnames[i];
				var obj  = objects[name];
				if (obj.deleteFlag) {
					removeEnvObject(name);
					addUpdateTag(["del", name]);
				}
			}
		}
		outputTag();
	}
	
	// 待ち情報の追加
	function entryWait(target, trans=false) {
		if (target.syncMode) {
			if (waitInfo === void) {
				waitInfo = %[list:[]];
			}
			with (waitInfo) {
				if (trans) {
					.list.add(void); // トランジション待ち
				} else {
					.list.add(%[name:target.name, mode:target.waitMode]);
				}
				if (!target.canskip) {
					.canskip = false;
				}
				if (target.syncWait > 0) {
					if (.wait === void || target.syncWait > .wait) {
						.wait = target.syncWait;
					}
				}
			}
		}
	}

	/*
	 * 環境用のタグを出力
	 * @param transTarget トランジション対象
	 * @return 待ち処理を行うかどうか
	 */
	function outputTag(transTarget) {
		// 待ち情報

		var trans = transTarget !== void ? transTarget.trans : void;

		if (typeof trans == "Object") {
			if (trans.blacktrans || trans.laytrans) {
				// レイヤトランジション指定
				if (delayrun !== void) {
					dm("暗転トランジション/レイヤトランジションは delayrun 指定できません");
					delayrun = void;
					nodelaydone = false;
				}
				transTarget.syncMode = true;

				// レイヤトランジション処理
				// 時間を調整
				var transBegin = trans.begin, transEnd = trans.end;
				transBegin = getTransObject(transBegin) if (typeof transBegin == "String");
				transEnd   = getTransObject(transEnd  ) if (typeof transEnd   == "String");
				var btime = transBegin !== void && transBegin.time !== void ? +transBegin.time : 1000;
				var etime = transEnd   !== void && transEnd.time   !== void ? +transEnd.time   : 1000;
				if (trans.time !== void) {
					var atime = btime + etime;
					btime = trans.time * btime / atime;
					etime = trans.time * etime / atime;
				}
				// 開始トランジションを生成
				var begin = %[];
				if (transBegin !== void) {
					(Dictionary.assign incontextof begin)(transBegin);
					copyTransParam(begin, trans);
				} else {
					(Dictionary.assign incontextof begin)(trans);
				}
				begin.time = btime;
				if (begin.method == "") {
					begin.method = "crossfade";
				}
				// 終了トランジションを生成
				var end = %[];
				if (transEnd !== void) {
					(Dictionary.assign incontextof end)(transEnd);
					copyTransParam(end, trans);
				} else {
					(Dictionary.assign incontextof end)(trans);
				}
				end.time = etime;
				if (end.method == "") {
					end.method = "crossfade";
				}
				if (trans.bwait !== void) {
					begin.wait = +trans.bwait;
				}
				
				trans.begin = begin;
				trans.end   = end;
				
			}
			if (trans.method === void || trans.method == "") {
				trans.method = "crossfade";
			}
			delete trans.wait;
			delete trans.sync;
		}

		if (delayrun === void) {
			// トランジション待ちの登録
			if (transTarget !== void) {
				entryWait(transTarget, true);
			}
			// 各オブジェクトの待ち処理を投入
			Scripts.foreach(objects, function(name,target) { entryWait(target); });
			entryWait(this);
		}
		var issync = waitInfo !== void;

		// タグの出力処理
		if (pretranslist.count > 0 || updatelist.count > 0 || stoplist.count > 0 || waitInfo !== void) {
			var e = %[tagname:"envupdate", taglist:["tagname"]];
			var addParam = function(name, param) {
				this[name] = param;
				taglist.add(name);
			} incontextof e;
			if (pretranslist.count > 0) {
				addParam("pretrans", pretranslist);
				pretranslist = [];
			}
			if (updatelist.count > 0) {
				addParam("update", updatelist);
				updatelist = [];
			}
			if (stoplist.count > 0) {
				addParam("stop", stoplist);
				stoplist = [];
			}
			if (waitInfo !== void) {
				addParam("wait", waitInfo);
				waitInfo = void;
			}
			if (trans !== void) {
				addParam("trans", trans);
			}
			if (msgchange !== void) {
				addParam("msgchange", msgchange);
				msgchange = void;
			}
			if (msgoff) {
				addParam("msgoff", true);
			}
			if (delayrun !== void) {
				addParam("delayrun", delayrun);
				if (nodelaydone) {
					addParam("nodelaydone", true);
				}
			}
			e.runLine = runLine if runLine !== void;
			e.runCount = runCount if runCount !== void;
			entryTags.push(e);
		}

		return issync;
	}
	
	/*
	 * 全体のオブジェクト更新用データの取得
	 */
	function getAllUpdateData() {
		var data = [];
		var objectList = Scripts.getObjectKeys(objects);
		var count = objectList.count;
		for (var i=0;i<count;i++) {
			var name = objectList[i];
			var obj = objects[name];
			data.add([obj.name, obj.className, obj.getUpdateData(true)]);
		}
		var ret = %[env:getUpdateData(true), data:data];

		// プラグインデータの追加保存
		forEachEventHook('onEnvStore', function(handler, f) { handler(f); } incontextof this, ret);
		
		return ret;
	}

	function updateCurrent() {
		//dm("env 状態記録");
		currentData = getAllUpdateData();
	}

	/*
	 * 全体のオブジェクト更新用データの取得
	 * 全て更新済みになるので注意
	 */
	function getDiffUpdateData() {
		var data = [];
		var objectList = Scripts.getObjectKeys(objects);
		var count = objectList.count;
		for (var i=0;i<count;i++) {
			var name = objectList[i];
			var obj = objects[name];
			var update = obj.getObjUpdateData();
			if (update !==  void) {
				data.add([obj.name, update]);
			}
		}
		return %[env:getObjUpdateData(), data:data];
	}

	
	/**
	 * 環境系タグ内容の展開出力
	 * @param cd コンダクタ
	 * @param msg begintrans が閉じてない場合の警告メッセージ
	 * @return 出力されたらtrue
	 */
	function outputEnvTags(cd, msg) {
		var ret;
		if (msg !== void && transMode) {
			errorCmd(@"begin が閉じてません:${msg}");
			transMode = 1;
			_endTrans(cd, EMPTY);
		}
		if (entryTags.count > 0) {
			cd.enqueueTag(entryTags*);
			entryTags.clear();
			ret = true;
		}
		// フラグ用タグの展開
		if (sflags.count > 0) {
			Scripts.foreach(sflags, function(id,name,cd) {
				cd.enqueueTag(%[tagname:"sflag", name:name]);
			}, cd);
			sflags.clear();
			ret = true;
		}
		return ret;
	}

	// -----------------------------------------------------------------------------
	
    /// 初期化情報
	var envinfo;
	var standLevels;
	var posInfoZorder;
	
	/// 画像初期プロパティ定義
	var imagePropMap;

	var times;        //< 時間情報
	var stages;       //< 舞台情報
	var positions;    //< 配置情報
	var layouts;      //< レイアウト配置情報
	var defaultTime;  //< デフォルトの時間

	var objectMatch;   // オブジェクト名情報
	var filenameMatch; // ファイル名マッチ情報
	var filterMatch;   // フィルタコマンドマッチ情報
	

	var objects = %[]; // オブジェクト情報辞書
	var layerList = []; // レイヤ情報

	// ---------------------------------------------------------------------
	
	// 舞台情報
	var stage;
	var time;

	// 指定時間の情報
	function getTimeInfo(time) {
		if (times !== void && time !== void) {
			return times[time];
		} else {
			return defaultTimeInfo;
		}
	}
	
	// 現在時刻
	property currentTimeInfo {
		getter() {
			if (times !== void && time !== void) {
				return times[time];
			} else {
				return defaultTimeInfo;
			}
        }
    }

	// 現在時刻
	property currentStageInfo {
		getter() {
			if (stages !== void && stage !== void) {
				return stages[stage];
			}
        }
    }
	
	// デフォルト時刻
	property defaultTimeInfo {
		getter() {
			if (times !== void && defaultTime !== void) {
				return times[defaultTime];
            }
        }
	}

	// ---------------------------------------------------------------------
	// カメラ注視点のデフォルト差し替え用
	
	property cameraoxDefault {
		getter() {
			return propDefault.cameraox;
		}
		setter(v) {
			propDefault.cameraox = v;
		}
	}
		
	property cameraoyDefault {
		getter() {
			return propDefault.cameraoy;
		}
		setter(v) {
			propDefault.cameraoy = v;
		}
	}
	
	// ---------------------------------------------------------------------

	function onClear(base) {
		if ((transMode && base == "back") || (!transMode && base == "fore")) {
			var count = layerList.count;
			for (var i=0;i<count;i++) {
				var layer = layerList[i];
				if (!layer.deleteFlag && layer.isShow()) {
					layer.setDisp(KAGEnvImage.CLEAR, EMPTY);
				}
			}
		}
	}
	
	function onSetRedrawProp() {
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			with (layerList[i]) { if (!.deleteFlag) .onSetRedrawProp(); }
		}
	}
	
	// すべて再描画処理
	function setRedraw() {
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			with (layerList[i]) { if (!.deleteFlag && .isShow()) .setRedraw(); }
		}
    }

	// 舞台変更の通知
	function setStageRedraw(elm, reset, trans) {
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			with (layerList[i]) { if (!.deleteFlag) .setStage(stage, time, elm, reset, trans); }
		}
    }

	// リンク破棄通知
	function doneLink(name) {
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			layerList[i].doneLink(name);
		}
	}
	
	/**
	 * 指定位置(クラス名)の表示されているレイヤがあるかどうか
	 * @param className クラス名
	 */
	function isPositionShow(className) {
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			var layer = layerList[i];
			if (!layer.deleteFlag && layer.classInfo.name == className && layer.isShow()) {
				return true;
			}
		}
		return false;
	}

	/**
	 * 指定位置(クラス名)の表示されているレイヤがあるかどうか
	 * @param className クラス名
	 */
	function getPositionShow(className) {
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			var layer = layerList[i];
			if (!layer.deleteFlag && layer.classInfo.name == className && layer.isShow()) {
				return layer;
			}
		}
	}
	
	/**
	 * 指定位置のレイヤの消去
	 * @param name 表示される対象名
	 * @param className クラス名
	 */
	function clearPosition(name, className, elm) {
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			var layer = layerList[i];
			if (layer.name != name && !layer.deleteFlag && layer.classInfo.name == className && layer.isShow()) {
				layer.setDisp(KAGEnvImage.CLEAR, elm);
			}
		}
	}

	/**
	 * 指定位置のレイヤの表示
	 * @param name 表示される対象名
	 * @param className クラス名
	 * @return 表示されたかどうか
	 */
	function showPosition(name, className, elm) {
		var target = objects[name];
		if (target instanceof "KAGEnvImage" && target.classInfo.name == className) {
			target.setDisp(KAGEnvImage.SHOW, elm);
			return true;
		}
		return false;
	}
	
	/**
	 * @return イベント絵が表示されているかどうか
	 */
	function isEventShow() {
		var ret = forEachFunctionHook("checkEnvEventShow", this);
		if (ret !== void && ret) {
			return true;
		}
		var count = layerList.count;
		for (var i=0;i<count;i++) {
			var layer = layerList[i];
			if ((layer.classFlag & FLAG_EVENT) && layer.isShow()) {
				//dm("イベント絵が表示されている");
				return true;
			}
		}
		return false;
	}

    /**
     * コンストラクタ
     * @param kag KAG本体
     */
	function KAGEnvironment(world, envinfo) {
		this.world = world;
		super.KAGEnvTrans(this, "env", %[name:"environment"]);
		propNames = [ "camerax", "cameray", "cameraz", "camerazoom", "camerarotate", "cameraox", "cameraoy", "shiftx", "shiftyt", "msgoffx", "msgoffy", "zoomx", "zoomy", "zcenterx", "zcentery",
					  "windstart", "windgoal", "windspeed", "windmin", "windmax" ];
		propDefault = %[ camerax:0, cameray:0, cameraz:0, camerazoom:100, camerarotate:0, cameraox:0, cameraoy:0, shiftx:0, shifty:0, msgoffx:0, msgoffy:0, zoomx:100, zoomy:100, zcenterx:0, zcentery:0,
					 windstart:0, windgoal:0, windspeed:0, windmin:0, windmax:0 ];
		filenameMatch = new MatchInfo();
		objectMatch = new MatchInfo();
		filterMatch = new MatchInfo();
		resetEnv(envinfo);
	}
	
    /**
     * ファイナライザ
     */
    function finalize() {
		initEnv();
		invalidate objects;
		invalidate layerList;
		invalidate filenameMatch;
		invalidate objectMatch;
		invalidate filterMatch;
		super.finalize();
		//dm("環境終了");
    }

	// -----------------------------------------------------------------------
	// 環境オブジェクト情報管理
	// -----------------------------------------------------------------------

	/**
	 * 環境オブジェクトの破棄
	 * @param name 名前
	 */
	function removeEnvObject(name) {
		var obj;
		if ((obj = objects[name]) !== void) {
			//dm(@"removeEnvObject:${name}", tkdlVerbose);
			delete objects[name];
			if (obj instanceof "KAGEnvImage") {
				layerList.remove(obj);
			}
			invalidate obj;
		}
	}

	/**
	 * 環境オブジェクトを生成して登録(下請け処理)
	 * @param name 名前
	 * @param className クラス名
	 * @param lock ロック指定
	 * @return 生成オブジェクト
	 */
	function createEnvObject(name, className, lock) {
		removeEnvObject(name);
		//dm(@"createEnvObject:${name}:${className}", tkdlVerbose);
		var classInfo = getClassInfo(className);
		var obj;
		switch (classInfo.type) {
		case "music":
			obj = new KAGEnvMusic(this, name, className, lock);
			break;
		case "sound":
			obj = new KAGEnvSound(this, name, className, lock);
			break;
		case "layer":
		case "dlayer":
		default:
			obj = new KAGEnvImage(this, name, className, lock);
			layerList.add(obj);
			break;
		};
		objects[name] = obj;
		return obj;
	}

	// -----------------------------------------------------------------------
	
	function isExistParameter(name, base, prefix, match) {
		return world.isExistParameter(name, base, prefix, match);
	}

	/**
	 * システム定義パラメータの取得
	 * 関数だった場合は返す値を差し替える
	 * @param name 識別名
	 * @param base 区分名 (transitions とか actions とか)
	 * @param prefix ファイルからさがす場合のプレフィックス @"${prefix}name.tjs" が処理対象
	 */
	function getParameter(name, base, prefix, match) {
		return world.getParameter(name, base, prefix, match);
	}

	/**
	 * クラス情報の取得
	 * @param name 識別名
	 */
	function getClassInfo(name) {
		return world.getClassInfo(name);
	}
	
	/**
     * セーブ処理
     */
	function onStore(f) {

		// スタック状態保存
		if (stack.count > 0) {
			f.stack = [];
			f.stack.assignStruct(stack);
		}
		if (Scripts.getObjectCount(store) > 0) {
			f.store = %[];
			(Dictionary.assignStruct incontextof f.store)(store);
		}
			
		// オブジェクト状態保存
		_onStore(f, true);

		// プラグインデータの追加保存
		forEachEventHook('onEnvStore', function(handler, f) { handler(f); } incontextof this, f);

		updateCurrent();
	}

	/**
	 * セーブ処理
	 */
	function _onStore(f, storeSound=true) {

		super.onStore(f);

		// オブジェクト保存
		var d = [];
		Scripts.foreach(objects, function(name,o,d,storeSound) {
			if (storeSound || o instanceof "KAGEnvImage") {
				if (!o.deleteFlag) {
					var obj = %[];
					o.onStore(obj);
					if (Scripts.getObjectCount(obj) > 0) {
						d.add(obj);
					}
				}
			}
		}, d, storeSound);
		if (d.count > 0) {
			d.sort(function(a,b) { return a.name < b.name; });
			f.objectList = d;
		}

		// 舞台情報
		f.stage = stage;
		f.time  = time;
		// カメラ情報系
		f.cameraoxDefault = cameraoxDefault if cameraoxDefault != 0;
		f.cameraoyDefault = cameraoyDefault if cameraoyDefault != 0;
	}

    /**
	 * ロード処理
	 * @param f 復帰情報
	 * @param clear メッセージレイヤをクリアする指定
	 * @param elm コマンド引数
	 * @param createTag タグを生成させる ※これを指定して呼び出した場合はコマンドとして機能させることができる
	 */
	function onRestore(f, clear, elm, plugin=true, createTag=false) {

		// 全体初期化
		initEnv(elm, createTag);

		// スタック復帰
		if (f.stack !== void) {
			stack.assignStruct(f.stack);
		}
		if (f.store !== void) {
			(Dictionary.assignStruct incontextof store)(f.store);
		}

		// 共通復帰
		_onRestore(f, clear, elm, createTag);

		if (plugin) {
			forEachEventHook('onEnvRestore',
							 function(handler, f) { handler(f.flags, f.clear, f.options); } incontextof this,
							 %[flags:f, clear:clear, options:elm]);
		}

		updateCurrent();
	}

	/**
	 * 復帰処理
	 * @param f 復帰情報
	 * @param clear メッセージレイヤをクリアする指定
	 * @param elm コマンド引数
	 * @param createTag タグを生成させる
	 */
	function _onRestore(f, clear, elm, createTag=false) {
		
		super.onRestore(f);

		// オブジェクト復帰
		var restoreNames = %[];
		if (f.objectList !== void) {
			var count = f.objectList.count;
			for (var i=0;i<count;i++) {
				var value = f.objectList[i];
				var name  = value.name;
				var obj = objects[name];
				if (obj === void || obj.className != value.cname) {
					obj = createEnvObject(name, value.cname, value.lockFlag !== void ? value.lockFlag : false);
					if (createTag) {
						addUpdateTag(["new", name, value.cname]);
					}
				}
				if (obj !== void) {
					obj.onRestore(value);
				}
				restoreNames[name] = true;
			}
		}
		
		// 復帰しなかったオブジェクトは削除対象
		var objnames = Scripts.getObjectKeys(objects);
		for (var i=0;i<objnames.count;i++) {
			var name = objnames[i];
			if (!restoreNames[name]) {
				var obj = objects[name];
				// bgm 系だけ例外処理
				if (obj instanceof "KAGEnvMusic") {
					if (!((elm !== void && elm.nostopbgm) && obj.isplayingloop)) {
						obj.setDelete();
					}
				} else {
					obj.setDelete();
				}
			}
		}

		// follow / link 指定を戻す
		var count = layerList.count;
		for (var i=0;i<count;i++) with (layerList[i]) {
			.initFollow();
			.initLink();
		}
		
		// 舞台情報復帰
		stage = f.stage;
		time  = f.time;
		cameraoxDefault = f.cameraoxDefault !== void ? f.cameraoxDefault : 0;
		cameraoyDefault = f.cameraoyDefault !== void ? f.cameraoyDefault : 0;
	}

	// 比較処理
	function onCompare(f) {
		var ret = false;
		if (super.onCompare(f)) {
			ret = true;
		}
		if (stage != f.stage) {
			errorCmd(@"${name}:場所が違います:${stage}:${f.stage}");
			ret = true;
		}
		if (time  != f.time) {
			errorCmd(@"${name}:時間が違います:${time}:${f.time}");
			ret = true;
		}
		if (cameraoxDefault != f.cameraoxDefault || cameraoyDefault != f.cameraoyDefault) {
			errorCmd(@"${name}:カメラ原点が違います");
			ret = true;
		}

		// 結局 KAGEnvImage のファイルパラメータ中でひっかかるので不要
		//if (compareMember("加工データ", rprops, f.rprops !== void ? f.rprops :EMPTY)) {
		//	showObjectDiff(rprops, f.rprops, "", errorCmd);
		//	ret = true;
		//}
		
		var objs = %[];
		if (f.objectList !== void) {
			var count = f.objectList.count;
			for (var i=0;i<count;i++) {
				var value = f.objectList[i];
				var name  = value.name;
				var classInfo = getClassInfo(value.cname);
				//dm(@"オブジェクト確認:${name}:${classInfo.type}:${value.disp}:現環境:${objects[name]}");
				if (classInfo.type == "layer" || classInfo.type == "dlayer") {
					if (value.disp !== void && value.disp <= KAGEnvImage.SHOW) {
						if (objects[name] === void) {
							errorCmd(@"${name}:現環境に存在しない画像オブジェクト:${value.disp}");
							ret = true;
						} else {
							objs[name] = value;
						}
					}
				} else if (classInfo.type == "music") {
					if (value.state !== void && value.state > 0) {
						if (objects[name] === void) {
							errorCmd(@"${name}:現環境に存在しない音楽オブジェクト");
							ret = true;
						} else {
							objs[name] = value;
						}
					}
				}
				// サウンドはスルー
			}
		}

		// レイヤ系情報復帰
		var names = [];
		names.assign(objects);
		var count = names.count;
		for (var i=0;i<count;i+=2) {
			var name  = names[i];
			var value = names[i+1];
			//dm(@"現環境チェック:${name}");
			if (objs[name] === void) {
				if (value instanceof "KAGEnvImage") {
					if (value.isShow()) {
						errorCmd(@"${name}:他環境に存在しない画像オブジェクト");
						ret = true;
					}
				} else if (value instanceof "KAGEnvMusic") {
					if (value.state > 0) {
						errorCmd(@"${name}:他環境に存在しない音楽オブジェクト");
					}
				}
			} else {
				if (value.onCompare(objs[name])) {
					ret = true;
				}
			}
		}
		// プラグイン部はとりあえずスルー XXX

		return ret;
	}

	// ------------------------------------------------------

	/**
	 * 画像要プロパティ情報マップのロード
	 * 指定名,プロパティ名,値 ... の列挙
	 * 通常のプロパティ以外に zoom, origin, clip, 各種画像オプションが指定可能
	 */
	function loadImagePropMap(filename) {
		var ret = %[];
		if (Storages.isExistentStorage(filename + ".csv")) { 
			filename += ".csv";
		} else if (Storages.isExistentStorage(filename + ".txt")) { 
			filename += ".txt";
		}
		if (Storages.isExistentStorage(filename)) try {
			var sep = (Storages.extractStorageExt(filename).toLowerCase() == ".txt") ? "\t" : ",";
			var file = [];
			file.load(filename);
			var c = file.count;
			for (var i=0;i<c;i++) {
				var line = file[i];
				if (line != "" && line.charAt(0) != "#") {
					line = line.split(sep);
					if (line.count >= 3) {
						var name = line[0].toLowerCase();
						var info = ret[name];
						if (info === void) {
							info = %[];
							ret[name] = info;
						}
						for (var j=1;j<line.count;j+=2) {
							info[line[j]] = Scripts.eval(line[j+1],,,this);
						}
					}
				}
			}
		} catch (e) {
			dm(@"画像プロパティ情報のパースに失敗しました(詳細はコンソール参照):${e.message}");
		}
		return ret;
	}
	
    /**
	 * 環境のリセット
	 */
	function resetEnv(envinfo) {
		
		// 初期化情報展開
		this.envinfo = envinfo;
		standLevels = global.getStandInformation(kag).getStandPSDLevel(true);

		// 画像マップ情報
		imagePropMap = loadImagePropMap("imagepropmap");
		
		if (envinfo) {

			if (envinfo.stageInfo !== void) {
				var stageInfo = Scripts.evalStorage(envinfo.stageInfo);
				times  = stageInfo.times;
				stages = stageInfo.stages;
				defaultTime = stageInfo.defaultTime;
			} else {
				times       = envinfo.times;
				stages      = envinfo.stages;
				defaultTime = envinfo.defaultTime;
			}
			
			positions   = envinfo.positions;
			layouts     = envinfo.layouts;

			if (times !== void) {
				var prefix;
				if (defaultTime !== void) {
					var info = times[defaultTime];
					if (info !== void) {
						prefix = info.prefix;
					}
				}
				var names = [];
				names.assign(times);
				var count = names.count;
				for (var i=0;i<count;i+=2) {
					var name  = names[i];
					var value = names[i+1];
					value.name = name;
					value.defaultPrefix = prefix;
				}
			}
			if (stages !== void) {
				var names = [];
				names.assign(stages);
				var count = names.count;
				for (var i=0;i<count;i+=2) {
					var name  = names[i];
					var value = names[i+1];
					value.name = name;
				}
			}

			// キャラ定義の読み込み
			// キャラ名,ファイル名,クラス名,加工名
			if (envinfo.objectList !== void) {
				world.initConfigList("オブジェクト定義", envinfo.objectList);
			}
			if (envinfo.objectList === void) {
				envinfo.objectList = [];
			}
			// キャラ定義ファイルの読み込み
			try {
				var filename = "charlist.csv";
				// キャラ名,画像ファイル名,クラス指定(標準はcharacter),加工指定(modifyパラメータ)
				var temp = [];
				var sep = (Storages.extractStorageExt(filename).toLowerCase() == ".txt") ? "\t" : ",";
				temp.load(filename);
				for (var i = 0; i < temp.count; i++) {
					var className = "character";
					var line = [];
					line.split(sep, temp[i]);
						var count = line.count;
					// 引数0:名前
					var name = line[0].toLowerCase();
					if (count >= 2 && name.charAt(0) != '#') {
						// 引数1:画像ファイル名
						var file = line[1].trim();
						var init;
						if (file != "") {
							init = ["file", file, "hide", true];
						} else {
							init = [];
						}
						if (count >= 3) {
							// 引数2:クラス指定
							var cname = line[2].trim();
							if (cname != "") className = cname;
							if (count == 4) {
								// 引数4つだけの時は modify扱い
								var modify = line[3].trim();
								if (modify != "") init.push("modify", modify);
							} else {
								// それ以上ある場合は以下 名前=パラメータ で初期化処理
								for (var n=3;n<count;n+=2) {
									var pname  = ((string)line[n]).trim();
									var value  = ((string)line[n+1]).trim();
									if (pname != "" && value != "") {
										init.push(pname, value);
									}
								}
							}
						}
						//dm(@"キャラ情報追加:${name}:${file}");
						envinfo.objectList.add(%["name", name, "class", className, "init", init]);
					}
				}
			} catch (e) {
				dm(@"キャラクタ定義ファイルの読み込みに失敗しました:${e.message}");
			}

			objectMatch.init(envinfo.objectList);
			filenameMatch.init(envinfo.filenameList);
			filterMatch.init(envinfo.filterList);
			posInfoZorder = envinfo.posInfoZorder !== void && +envinfo.posInfoZorder;
        } else {

			dm("環境情報がありません");
			envinfo = %[];
			times  = void;
			stages = void;
			positions = void;
			layouts = void;
			defaultTime = void;
			objectMatch.init();
			filenameMatch.init();
			filterMatch.init();
			posInfoZorder = false;
		}

		// スクリプト
		if (Storages.isExistentStorage("envscript.tjs")) try {
			envinfo.scripts = Scripts.evalStorage("envscript.tjs");
		} catch(e) {
			Debug.message("envscript.tjs の読み込みに失敗しました:" + e.message);
		}
		
		initEnv();
	}
	
    // -----------------------------------------

	/**
	 * 環境情報の初期化
	 * @param elm コマンド引数
	 * @param createTag タグを生成させる
	 */
	function initEnv(elm, createTag=false) {

		var nostopbgm = elm !== void ? +elm.nostopbgm : false;
		currentTarget = void;

		delayline = false;
		delaysyncline = false;
		
		clearStack();
		currentData = void;

		// 舞台情報初期化
		stage = void;
		time = void;
		
		// オブジェクト破棄
		var objectList = Scripts.getObjectKeys(objects);
		var count = objectList.count;
		for (var i=0;i<count;i++) {
			var name = objectList[i];
			var obj  = objects[name];
			if (!(obj instanceof "KAGEnvMusic" && nostopbgm && obj.isplayingloop)) {
				removeEnvObject(name);
			}
		}

		// カメラ情報クリア
		reset();

		if (createTag) {
			// 実オブジェクト初期化タグを展開
			addUpdateTag(["init", nostopbgm]);
		}
	}

