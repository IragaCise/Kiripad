	/**
	 * パース処理中に画像の差し替えを行う
	 * @param name 元画像名
	 * @param obj 画像を扱うオブジェクト
	 * @return 差し替え画像名
	 */
	function changeImageName(name, obj, reload) {
		name = name.toLowerCase();
		var newname = forEachFunctionHook("onEnvChangeImageName", name, obj, reload, this);
		return newname !== void ? newname : name;
	}

	/**
	 * 名前から画像に適用するべき初期化データを取得する
	 * @param name 名前
	 * @return 処理するべき名前
	 */
	function getImagePropInfo(name) {
		name = name.toLowerCase();
		return imagePropMap[name];
	}

	/*
	 * @return 記録用のファイル情報 (ファイル名または ファイル名＋加工情報の辞書)
	 */
	function getImageFileData(imageFile, imageOptions, imageRedraw, set=false) {
		var ret = %["file", imageFile];
		if (imageOptions !== void && Scripts.getObjectCount(imageOptions) > 0) {
			ret.options = Scripts.clone(imageOptions);
			set = true;
		}
		if (imageRedraw !== void && Scripts.getObjectCount(imageRedraw) > 0) {
			ret.redraw = Scripts.clone(imageRedraw);
			set = true;
		}
		return set ? ret : imageFile;
	}
	
	// コンバート処理用
	function getImageFileDataConv(imageFile, imageSource, imageOptions, imageRedraw, zresolution, extend) {
		if (envinfo.showExtend !== void && imageSource instanceof "StandAffineSourceLayer") {
			//dm(@"${imageFile}:store extend:${extend}");
			var ret = getImageFileData(imageFile, imageOptions, imageRedraw, true);
			if (envinfo.showExtend instanceof "Array") {
				if (extend !== void) {
					ret.extend = [envinfo.showExtend[0] + extend[0],
								  envinfo.showExtend[1] + extend[1],
								  envinfo.showExtend[2] + extend[2],
								  envinfo.showExtend[3] + extend[3]];
				} else {
					ret.extend = [envinfo.showExtend[0],
								  envinfo.showExtend[1],
								  envinfo.showExtend[2],
								  envinfo.showExtend[3]];
				}
			} else {
				if (extend !== void) {
					ret.extend = [envinfo.showExtend + extend[0],
								  envinfo.showExtend + extend[1],
								  envinfo.showExtend + extend[2],
								  envinfo.showExtend + extend[3]];
				} else {
					ret.extend = [envinfo.showExtend,
								  envinfo.showExtend,
								  envinfo.showExtend,
								  envinfo.showExtend];
				}
			}
			return ret;
		} else {
			return getImageFileData(imageFile, imageOptions, imageRedraw, true);
		}
	}
	
