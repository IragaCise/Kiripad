                  if(utf16Pos != std::string::npos) {
                      spdlog::info(
                          "KiriPad 2A.28.1 startup literal UTF16 '{}' pos={} context='{}'",
                          literal,
                          static_cast<unsigned long long>(utf16Pos),
                          kiriPad2A281Utf16Context(utf16Pos));
                  }
                  if(asciiPos == std::string::npos &&
                     utf16Pos == std::string::npos) {
                      spdlog::info(
                          "KiriPad 2A.28.1 startup literal '{}' not found raw",
                          literal);
                  }
              }
          }

          '''

          post = r'''
          if(shortname == ttstr(TJS_W("startup.tjs"))) {
              spdlog::info(
                  "KiriPad 2A.28.1 startup LoadByteCode result={}",
