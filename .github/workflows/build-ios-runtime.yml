	function allFilter(targets, elm) {

		// 名前のマッチング
		if (elm.onname !== void) {
			var name = new RegExp(elm.onname);
			removeTagParam(elm, "onname");
			for (var i=targets.count-1;i>=0;i--) {
				var target = targets[i];
				if (!name.test(target.name)) {
					targets.erase(i);
				}
			}
		}
		if (elm.exname !== void) {
			var name = new RegExp(elm.exname);
			removeTagParam(elm, "exname");
			for (var i=targets.count-1;i>=0;i--) {
				var target = targets[i];
				if (name.test(target.name)) {
					targets.erase(i);
				}
			}
		}
		
		// クラスの type 指定で限定
		if (elm.ontype !== void) {
			var type = elm.ontype;
			removeTagParam(elm, "ontype");
			for (var i=targets.count-1;i>=0;i--) {
				var target = targets[i];
				if (target.classInfo.type != type) {
