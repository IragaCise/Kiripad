              tjs_char out[CC_MD5_DIGEST_LENGTH * 2 + 1] = {};

              for(int i = 0; i < CC_MD5_DIGEST_LENGTH; ++i) {
                  out[i * 2] = hex[(digest[i] >> 4) & 0x0f];
                  out[i * 2 + 1] = hex[digest[i] & 0x0f];
              }

              return ttstr(out);
          }
          #endif

          '''

          # Safe insertion point: before the WHOLE declaration line, including return type.
          source_text = source_text[:m.start()] + helper + source_text[m.start():]

          def function_span(text, method_name):
              if method_name == "CreateStream":
                  pat = re.compile(
                      r"(?m)^[ \t]*tTJSBinaryStream\s*\*\s*"
                      r"tTVPArchive::CreateStream\s*\(\s*const\s+ttstr\s*&\s*name\s*\)"
                  )
              else:
                  pat = re.compile(
                      r"(?m)^[ \t]*bool\s+"
                      r"tTVPArchive::IsExistent\s*\(\s*const\s+ttstr\s*&\s*name\s*\)"
                  )

              mm = pat.search(text)
              if not mm:
                  raise SystemExit(f"2A.36d: {method_name} declaration not found")

              brace = text.find("{", mm.end())
              if brace < 0:
                  raise SystemExit(f"2A.36d: {method_name} opening brace not found")

              depth = 0
              for i in range(brace, len(text)):
                  ch = text[i]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return mm.start(), brace, i + 1

              raise SystemExit(f"2A.36d: {method_name} closing brace not found")

          # ------------------------------------------------------------------
          # CreateStream: preserve the original signature/body and inject ONLY
          # after the original Hash.Find(name) line.
          # ------------------------------------------------------------------
          _, create_open, create_end = function_span(source_text, "CreateStream")
          create_func = source_text[create_open:create_end]

          find_line = "tjs_uint *p = Hash.Find(name);"
          if create_func.count(find_line) != 1:
              print("===== CreateStream function =====")
              print(create_func)
              raise SystemExit(
                  f"2A.36d: expected one Hash.Find line in CreateStream, "
                  f"found {create_func.count(find_line)}"
              )

          create_inject = r'''tjs_uint *p = Hash.Find(name);

          #if defined(__APPLE__)
              if(!p) {
                  ttstr kiriPad2A36cRaw =
                      KiriPad2A36cYuzuRawName(name);
                  p = Hash.Find(kiriPad2A36cRaw);

                  if(p) {
                      spdlog::info(
                          "KiriPad 2A.36d Yuzu alias stream logical='{}' raw='{}'",
                          name.AsStdString(),
                          kiriPad2A36cRaw.AsStdString());
                  }
              }

              // GARbro shows Config.tjs under main/Config.tjs, while KAG requests
              // it by basename through its auto-path logic.
              if(!p && name == TJS_W("config.tjs")) {
                  const ttstr kiriPad2A36cConfigLogical =
                      TJS_W("main/config.tjs");
                  const ttstr kiriPad2A36cConfigRaw =
                      KiriPad2A36cYuzuRawName(kiriPad2A36cConfigLogical);

                  p = Hash.Find(kiriPad2A36cConfigRaw);

                  spdlog::info(
                      "KiriPad 2A.36d Config stream probe "
                      "logical='{}' raw='{}' hit={}",
                      kiriPad2A36cConfigLogical.AsStdString(),
                      kiriPad2A36cConfigRaw.AsStdString(),
                      p ? "YES" : "NO");

                  if(p) {
                      spdlog::info(
                          "KiriPad 2A.36d Config alias stream "
                          "requested='{}' mapped='{}' raw='{}'",
                          name.AsStdString(),
                          kiriPad2A36cConfigLogical.AsStdString(),
                          kiriPad2A36cConfigRaw.AsStdString());
                  }
              }

              // KiriPad 2A.37 LayerEx.tjs protected auto-path probe.
              // KAG requests LayerEx.tjs by basename. Probe likely logical
              // directories and use the first protected MD5 entry that exists.
              if(!p && name == TJS_W("layerex.tjs")) {
                  const tjs_char *kiriPad2A37Candidates[] = {
                      TJS_W("main/layerex.tjs"),
                      TJS_W("system/layerex.tjs"),
                      TJS_W("data/system/layerex.tjs"),
                      TJS_W("main/system/layerex.tjs"),
                      TJS_W("script/layerex.tjs"),
                      TJS_W("scripts/layerex.tjs"),
                      TJS_W("kag/layerex.tjs"),
                  };

                  for(const tjs_char *candidate : kiriPad2A37Candidates) {
                      const ttstr logical(candidate);
                      const ttstr raw =
                          KiriPad2A36cYuzuRawName(logical);
                      tjs_uint *candidateHit = Hash.Find(raw);

                      spdlog::info(
                          "KiriPad 2A.37 LayerEx stream probe "
                          "logical='{}' raw='{}' hit={}",
                          logical.AsStdString(),
                          raw.AsStdString(),
                          candidateHit ? "YES" : "NO");

                      if(candidateHit && !p) {
                          p = candidateHit;
                          spdlog::info(
                              "KiriPad 2A.37 LayerEx alias stream "
                              "requested='{}' mapped='{}' raw='{}'",
                              name.AsStdString(),
                              logical.AsStdString(),
                              raw.AsStdString());
                      }
                  }
              }

              // KiriPad 2A.44 generic protected storage auto-path fallback.
              // YUZUSOFT stores logical paths as MD5 names, so Kirikiri's
              // normal basename AutoPath table cannot reconstruct them.
              // On a protected basename miss (.tjs/.stage), try common logical directories.
              if(!p) {
                  const std::string requested =
                      name.AsStdString();

                  if(requested.find('/') == std::string::npos &&
                     (
                         (requested.size() >= 4 &&
                          requested.compare(
                              requested.size() - 4, 4, ".tjs") == 0) ||
                         (requested.size() >= 6 &&
                          requested.compare(
                              requested.size() - 6, 6, ".stage") == 0)
                     )) {

                      const tjs_char *prefixes[] = {
                          TJS_W("system/"),
                          TJS_W("main/"),
                          TJS_W("data/system/"),
                          TJS_W("main/system/"),
                          TJS_W("script/"),
                          TJS_W("scripts/"),
                          TJS_W("kag/"),
                      };

                      for(const tjs_char *prefix : prefixes) {
                          ttstr logical(prefix);
                          logical += name;

                          const ttstr raw =
                              KiriPad2A36cYuzuRawName(logical);
                          tjs_uint *candidateHit =
                              Hash.Find(raw);

                          spdlog::info(
                              "KiriPad 2A.44 AutoPath stream probe "
                              "requested='{}' logical='{}' raw='{}' hit={}",
                              requested,
                              logical.AsStdString(),
                              raw.AsStdString(),
                              candidateHit ? "YES" : "NO");

                          if(candidateHit) {
                              p = candidateHit;
                              spdlog::info(
                                  "KiriPad 2A.44 AutoPath alias stream "
                                  "requested='{}' mapped='{}' raw='{}'",
                                  requested,
                                  logical.AsStdString(),
                                  raw.AsStdString());
                              break;
                          }
                      }
                  }
              }
          #endif'''

          create_func = create_func.replace(find_line, create_inject, 1)
          source_text = source_text[:create_open] + create_func + source_text[create_end:]

          # ------------------------------------------------------------------
          # IsExistent: preserve its signature and setup, replacing ONLY the
          # original one-line Hash.Find return.
          # ------------------------------------------------------------------
          _, exist_open, exist_end = function_span(source_text, "IsExistent")
          exist_func = source_text[exist_open:exist_end]

          old_return_re = re.compile(
              r"return\s+Hash\.Find\(name\)\s*!=\s*(?:NULL|nullptr)\s*;"
          )
          matches = list(old_return_re.finditer(exist_func))
          if len(matches) != 1:
              print("===== IsExistent function =====")
              print(exist_func)
              raise SystemExit(
                  f"2A.36d: expected one direct Hash.Find return, "
                  f"found {len(matches)}"
