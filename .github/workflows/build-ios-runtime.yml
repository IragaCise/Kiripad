              for(const char *literal : kiriPad2A281Needles) {
                  const size_t asciiPos =
                      kiriPad2A281FindAscii(literal);
                  const size_t utf16Pos =
                      kiriPad2A281FindUtf16LE(literal);

                  if(asciiPos != std::string::npos) {
                      spdlog::info(
                          "KiriPad 2A.28.1 startup literal ASCII '{}' pos={}",
                          literal,
                          static_cast<unsigned long long>(asciiPos));
