name: Build KiriPad Phase 2A.27 Startup Source Probe

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "KrKr2-Next git ref (branch/tag/commit)"
        required: true
        default: "1abd1ed4e8aec7abd5d2524c3a9ad7886880602f"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  runtime-ios:
    name: Experimental runtime unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout KiriPad
        uses: actions/checkout@v4

      - name: Install native build prerequisites
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install ninja autoconf automake autoconf-archive libtool gettext pkgconf bison nasm yasm

          BREW_PREFIX="$(brew --prefix)"
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          LIBTOOL_PREFIX="$(brew --prefix libtool)"
          AUTOCONF_ARCHIVE_PREFIX="$(brew --prefix autoconf-archive)"
          BISON_PREFIX="$(brew --prefix bison)"

          TOOL_SHIMS="$RUNNER_TEMP/kiripad-tools"
          mkdir -p "$TOOL_SHIMS"
          if [[ -x "$LIBTOOL_PREFIX/bin/glibtoolize" ]]; then
            ln -sf "$LIBTOOL_PREFIX/bin/glibtoolize" "$TOOL_SHIMS/libtoolize"
          elif [[ -x "$LIBTOOL_PREFIX/libexec/gnubin/libtoolize" ]]; then
            ln -sf "$LIBTOOL_PREFIX/libexec/gnubin/libtoolize" "$TOOL_SHIMS/libtoolize"
          fi

          printf '%s\n' \
            "$TOOL_SHIMS" \
            "$GETTEXT_PREFIX/bin" \
            "$BISON_PREFIX/bin" \
            "$BREW_PREFIX/bin" >> "$GITHUB_PATH"

          ACLOCAL_COMBINED="$AUTOCONF_ARCHIVE_PREFIX/share/aclocal:$GETTEXT_PREFIX/share/aclocal:$LIBTOOL_PREFIX/share/aclocal:$BREW_PREFIX/share/aclocal"
          echo "ACLOCAL_PATH=$ACLOCAL_COMBINED" >> "$GITHUB_ENV"
          echo "KIRIPAD_TOOL_SHIMS=$TOOL_SHIMS" >> "$GITHUB_ENV"

          export PATH="$TOOL_SHIMS:$GETTEXT_PREFIX/bin:$BISON_PREFIX/bin:$BREW_PREFIX/bin:$PATH"
          export ACLOCAL_PATH="$ACLOCAL_COMBINED${ACLOCAL_PATH:+:$ACLOCAL_PATH}"
          hash -r

          echo "cmake:     $(command -v cmake)"
          echo "ninja:     $(command -v ninja)"
          echo "bison:     $(command -v bison)"
          echo "nasm:      $(command -v nasm)"
          echo "yasm:      $(command -v yasm)"
          echo "autoreconf:$(command -v autoreconf)"
          echo "autopoint: $(command -v autopoint)"
          echo "libtoolize:$(command -v libtoolize || true)"
          echo "apple libtool: /usr/bin/libtool"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-ios-${{ runner.os }}-${{ runner.arch }}-${{ inputs.engine_ref }}
          restore-keys: |
            vcpkg-ios-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch KrKr2-Next source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .engine-src
          mkdir -p .engine-src
          git clone --filter=blob:none https://github.com/reAAAq/KrKr2-Next.git .engine-src/KrKr2-Next
          cd .engine-src/KrKr2-Next
          git checkout "${{ inputs.engine_ref }}"
          git rev-parse HEAD | tee ../../engine-commit.txt
          printf 'Source: https://github.com/reAAAq/KrKr2-Next\nRef: %s\nCommit: %s\n' \
            "${{ inputs.engine_ref }}" "$(git rev-parse HEAD)" > ../../engine-source.txt

      - name: Patch optional Live2D out for Phase 2A
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Phase 2A targets Sanoba Witch first.  Upstream currently creates a
          # CubismFramework target even when the proprietary Cubism Core / full
          # Native SDK is not present, which makes CMake generation fail before
          # the ordinary KiriKiri engine can be built.  Temporarily remove the
          # optional Live2D plugin and keep the rest of the engine intact.
          cmake = Path("cpp/plugins/CMakeLists.txt")
          text = cmake.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          out = []
          i = 0
          removed = []
          commands = {
              "add_library", "target_link_libraries", "target_include_directories",
              "target_compile_definitions", "set_target_properties",
              "target_compile_options", "target_sources"
          }
          while i < len(lines):
              line = lines[i]
              m = re.match(r"^\s*([A-Za-z_][A-Za-z0-9_]*)\s*\(", line)
              if m and m.group(1).lower() in commands:
                  block = line
                  depth = line.count("(") - line.count(")")
                  j = i + 1
                  while depth > 0 and j < len(lines):
                      block += lines[j]
                      depth += lines[j].count("(") - lines[j].count(")")
                      j += 1
                  if "CubismFramework" in block:
                      removed.append(block.rstrip())
                      i = j
                      continue
              if "krkrlive2d.cpp" in line:
                  replaced = line.replace("krkrlive2d.cpp", "")
                  removed.append(line.rstrip())
                  if replaced.strip() and replaced.strip() not in {"", ")"}:
                      out.append(replaced)
                  elif replaced.strip() == ")":
                      out.append(replaced)
                  i += 1
                  continue
              out.append(line)
              i += 1
          cmake.write_text("".join(out), encoding="utf-8")

          # Remove the unconditional Live2D registration call from engine_api.
          api = Path("bridge/engine_api/src/engine_api.cpp")
          if api.exists():
              a = api.read_text(encoding="utf-8")
              new_lines = []
              for line in a.splitlines(keepends=True):
                  if "TVPRegisterKrkrLive2DPluginAnchor" in line:
                      removed.append(line.rstrip())
                      continue
                  new_lines.append(line)
              api.write_text("".join(new_lines), encoding="utf-8")

          # krkrgles has one shared render-target symbol normally defined by
          # krkrlive2d.cpp.  Convert its local extern declaration to a zero-
          # initialized definition so the non-Live2D renderer still links.
          ogl = Path("cpp/plugins/krkrgles.cpp")
          if ogl.exists():
              o = ogl.read_text(encoding="utf-8")
              pat = re.compile(
                  r"(?m)^(\s*)extern\s+([^;\n]+?)\s+g_live2dRenderTarget\s*;\s*$"
              )
              o2, n = pat.subn(
                  lambda m: f"{m.group(1)}{m.group(2)} g_live2dRenderTarget{{}}; // KiriPad Phase 2A: Live2D disabled",
                  o,
                  count=1,
              )
              if n:
                  o = o2
              else:
                  print("warning: no extern g_live2dRenderTarget declaration found in krkrgles.cpp")
              ogl.write_text(o, encoding="utf-8")

          print("===== Phase 2A Live2D patch =====")
          for item in removed:
              print("REMOVED:", item[:500])
          print("===== remaining Live2D/Cubism references =====")
          for p in [cmake, api, ogl]:
              if not p.exists():
                  continue
              for no, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                  if any(x in line for x in ("CubismFramework", "krkrlive2d", "TVPRegisterKrkrLive2DPluginAnchor", "g_live2dRenderTarget")):
                      print(f"{p}:{no}: {line}")
          PY

      - name: Patch iOS sandbox path recovery for Unicode/case-preserving paths
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cpp/core/base/impl/StorageImpl.cpp")
          text = path.read_text(encoding="utf-8")

          old = "if(!_utf8_strcasecmp(actualPrefix.c_str(), dir.c_str())) {"
          new = "if(!_utf8_strcasecmp_nfc(actualPrefix.c_str(), dir.c_str())) { // KiriPad Phase 2A.14: retain iOS sandbox prefix case/Unicode recovery"

          count = text.count(old)
          if count != 1:
              print(f"Expected exactly one iOS sandbox prefix comparison, found {count}.")
              marker = "std::string actualPrefix = prefix.substr(0, dir.length());"
              pos = text.find(marker)
              if pos >= 0:
                  print("===== nearby source =====")
                  print(text[max(0, pos-800):pos+1600])
              raise SystemExit(1)

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          print("Patched iOS sandbox prefix comparison:")
          for no, line in enumerate(text.splitlines(), 1):
              if "actualPrefix.c_str(), dir.c_str()" in line:
                  print(f"{path}:{no}: {line}")
          PY

      - name: Patch iOS Documents-anchor path recovery
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cpp/core/base/impl/StorageImpl.cpp")
          text = path.read_text(encoding="utf-8")

          # The engine entry is .../<game>/data.xp3, but the storage namespace
          # normalizes absolute paths to lower case. On iOS the real sandbox
          # prefix contains case-sensitive components such as Containers/Data/
          # Application/<UUID>/Documents. Recover the real Documents directory
          # from TVPGetApplicationHomeDirectory() and let the existing component
          # walker resolve <game>/<archive> on disk.
          anchor = '''        static const std::vector<ttstr> &prefixPath = _getPrefixPath();
                  static const std::vector<std::string> &homeDir = _getHomeDir();
                  spdlog::debug("iOS GetLocallyAccessibleName: prefix='{}', homeDir count={}", prefix, homeDir.size());
          '''
          replacement = '''        static const std::vector<ttstr> &prefixPath = _getPrefixPath();
                  static const std::vector<std::string> &homeDir = _getHomeDir();

                  bool kiripadDocumentsRecovered = false;
                  const std::string kiripadNormalizedDocs = "/documents/";
                  std::string kiripadPrefixLower = prefix;
                  for(auto &c : kiripadPrefixLower)
                      if('A' <= c && c <= 'Z') c = (char)(c + ('a' - 'A'));
                  const size_t kiripadDocsPos = kiripadPrefixLower.find(kiripadNormalizedDocs);
                  if(kiripadDocsPos != std::string::npos) {
                      for(int i = 0; i < (int)prefixPath.size(); ++i) {
                          const std::string realProjectPath = prefixPath[i].AsNarrowStdString();
                          const std::string realDocsToken = "/Documents/";
                          const size_t realDocsPos = realProjectPath.find(realDocsToken);
                          if(realDocsPos == std::string::npos)
                              continue;

                          const std::string realDocuments =
                              realProjectPath.substr(0, realDocsPos + realDocsToken.size() - 1);
                          newname = ttstr(realDocuments.c_str());

                          // 'prefix' has one synthetic leading '/', while ptr points
                          // at the same storage path without that synthetic slash.
                          size_t ptrAdvance = kiripadDocsPos + kiripadNormalizedDocs.size();
                          if(ptrAdvance > 0) --ptrAdvance;
                          ptr += ptrAdvance;
                          while(*ptr && *ptr == TJS_W('/'))
                              ++ptr;

                          spdlog::info("KiriPad 2A.14 Documents-anchor recovery: base='{}', remaining='{}'",
                                       realDocuments, tTJSNarrowStringHolder(ptr).Buf);
                          kiripadDocumentsRecovered = true;
                          break;
                      }
                  }

                  spdlog::debug("iOS GetLocallyAccessibleName: prefix='{}', homeDir count={}", prefix, homeDir.size());
                  if(!kiripadDocumentsRecovered) {
          '''
          if text.count(anchor) != 1:
              print(f"Expected one iOS prefix-table anchor, found {text.count(anchor)}")
              pos = text.find('iOS GetLocallyAccessibleName: prefix=')
              if pos >= 0:
                  print(text[max(0, pos-1200):pos+1800])
              raise SystemExit(1)
          text = text.replace(anchor, replacement, 1)

          # Close the fallback wrapper immediately after the existing prefix loop.
          loop_tail = '''            }
                  }
              }
          #endif
          '''
          loop_tail_replacement = '''            }
                  }
                  }
              }
          #endif
          '''
          if text.count(loop_tail) != 1:
              print(f"Expected one iOS prefix-loop tail, found {text.count(loop_tail)}")
              pos = text.find('iOS prefix matched!')
              if pos >= 0:
                  print(text[max(0, pos-1600):pos+2200])
              raise SystemExit(1)
          text = text.replace(loop_tail, loop_tail_replacement, 1)

          path.write_text(text, encoding="utf-8")
          print("Inserted deterministic iOS Documents-anchor recovery:")
          for no, line in enumerate(text.splitlines(), 1):
              if "Documents-anchor recovery" in line or "kiripadDocumentsRecovered" in line:
                  print(f"{path}:{no}: {line}")
          PY

      - name: Fix AutoMountXP3 current archive exclusion
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cpp/core/base/impl/StorageImpl.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''    std::string projBaseStr = projBaseName.AsNarrowStdString();
              for(auto &c : projBaseStr) c = (char)tolower((unsigned char)c);

              std::vector<std::string> xp3Names;
          '''
          new = '''    std::string projBaseStr = projBaseName.AsNarrowStdString();
              for(auto &c : projBaseStr) c = (char)tolower((unsigned char)c);
              if(projBaseStr.size() >= 4 && projBaseStr.substr(projBaseStr.size() - 4) == ".xp3")
                  projBaseStr.resize(projBaseStr.size() - 4); // KiriPad Phase 2A.14: compare basename to basename
              spdlog::info("KiriPad 2A.14 AutoMount project basename={}", projBaseStr);

              std::vector<std::string> xp3Names;
          '''
          if text.count(old) != 1:
              print(f"Expected one AutoMount project-basename block, found {text.count(old)}")
              pos = text.find('std::string projBaseStr')
              if pos >= 0:
                  print(text[max(0, pos-800):pos+1400])
              raise SystemExit(1)
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          print("Fixed AutoMountXP3 exclusion of the project archive itself.")
          PY

      - name: Patch iOS AutoMountXP3 parent directory recovery
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path
          
          path = Path("cpp/core/base/impl/StorageImpl.cpp")
          text = path.read_text(encoding="utf-8")
          marker = '    spdlog::info("AutoMountXP3: nativeParent={}", parentPath);'
          if text.count(marker) != 1:
              print(f"Expected exactly one AutoMountXP3 nativeParent marker, found {text.count(marker)}")
              pos = text.find('AutoMountXP3: nativeParent=')
              if pos >= 0:
                  print(text[max(0, pos-1800):pos+1800])
              raise SystemExit(1)
          
          patch = """#if defined(__APPLE__) && TARGET_OS_IPHONE
              // KiriPad Phase 2A.14: TVPProjectDir is normalized to lowercase for the
              // storage namespace, but the iOS sandbox path is case-sensitive.
              // AutoMountXP3 asks for the parent of the game root (Documents/), which is
              // shorter than _getHomeDir()[0] (Documents/<game>/), so the ordinary
              // GetLocallyAccessibleName prefix recovery cannot restore its real case.
              // Recover that parent from the already-known real game home path before
              // opendir(), so data.xp3 and sibling XP3 archives can be found.
              {
                  const auto &kiripadHomeDirs = _getHomeDir();
                  for(const auto &kiripadHome : kiripadHomeDirs) {
                      std::string realHome = kiripadHome;
                      while(realHome.size() > 1 && realHome.back() == '/')
                          realHome.pop_back();
                      const auto slash = realHome.find_last_of('/');
                      if(slash == std::string::npos)
                          continue;
                      std::string realParent = realHome.substr(0, slash + 1);
                      std::string candidate = parentPath;
                      if(candidate.empty() || candidate.back() != '/')
                          candidate.push_back('/');
                      if(!_utf8_strcasecmp_nfc(candidate.c_str(), realParent.c_str())) {
                          spdlog::info("AutoMountXP3: KiriPad iOS parent recovery {} -> {}", parentPath, realParent);
                          parentPath = realParent;
                          break;
                      }
                  }
              }
          #endif
          """
          text = text.replace(marker, patch + marker, 1)
          path.write_text(text, encoding="utf-8")
          
          print("Inserted KiriPad iOS AutoMountXP3 parent recovery:")
          for no, line in enumerate(text.splitlines(), 1):
              if "KiriPad iOS parent recovery" in line or "AutoMountXP3: nativeParent" in line:
                  print(f"{path}:{no}: {line}")
          PY

      - name: Patch XP3 filter XOR for iOS safety
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cpp/plugins/xp3filter.cpp")
          text = path.read_text(encoding="utf-8")

          start_marker = "tjs_error CBinaryAccessor::FuncXor(tjs_int numparams, tTJSVariant **param) {"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("FuncXor start not found")

          end = text.find("\n}\n", start)
          if end < 0:
              raise SystemExit("FuncXor end not found")
          end += len("\n}\n")

          old = text[start:end]
          if "*(uint64_t *)(buf) ^= k;" not in old:
              print(old)
              raise SystemExit("Expected vectorized uint64_t XOR implementation was not found")

          new = r'''tjs_error CBinaryAccessor::FuncXor(tjs_int numparams, tTJSVariant **param) {
              if(numparams < 3) {
                  return TJS_E_BADPARAMCOUNT;
              }

              // KiriPad Phase 2A.15:
              // Preserve the same XOR semantics while avoiding the upstream
              // type-punned uint64_t writes that crash on the iOS/ARM64 path.
              const tjs_int64 bufoff64 = param[0]->AsInteger();
              const tjs_int64 len64 = param[1]->AsInteger();
              const tjs_int64 xor64 = param[2]->AsInteger();

              if(bufoff64 < 0 || len64 < 0) {
                  return TJS_E_INVALIDPARAM;
              }

              const tjs_uint64 start =
                  (tjs_uint64)m_curPos + (tjs_uint64)bufoff64;
              if(start > (tjs_uint64)m_length) {
                  return TJS_E_INVALIDPARAM;
              }

              const tjs_uint64 available = (tjs_uint64)m_length - start;
              if((tjs_uint64)len64 > available) {
                  return TJS_E_INVALIDPARAM;
              }

              unsigned char *buf = m_buff + start;
              const unsigned char xorval = (unsigned char)xor64;
              for(tjs_uint64 i = 0; i < (tjs_uint64)len64; ++i) {
                  buf[i] ^= xorval;
              }

              return TJS_S_OK;
          }
          '''

          text = text[:start] + new + text[end:]
          path.write_text(text, encoding="utf-8")

          patched = path.read_text(encoding="utf-8")
          for token in (
              "KiriPad Phase 2A.15:",
              "const tjs_uint64 available",
              "buf[i] ^= xorval;",
          ):
              if token not in patched:
                  raise SystemExit(f"XP3 XOR patch verification failed: {token}")

          if "*(uint64_t *)(buf) ^= k;" in patched:
              raise SystemExit("Unsafe vectorized XOR is still present")

          print("Patched CBinaryAccessor::FuncXor with checked byte-wise XOR.")
          p = patched.find(start_marker)
          print(patched[p:p+2200])
          PY

      - name: Bypass TJS XP3 filter callback for Sanoba Witch
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cpp/plugins/xp3filter.cpp")
          text = path.read_text(encoding="utf-8")

          # Phase 2A.16.1:
          # Do not depend on an exact multi-line whitespace match.  Locate
          # the extraction wrapper and insert immediately before the managed
          # decoder fetch.
          wrapper_name = "TVPXP3ArchiveExtractionFilterWrapper"
          managed_line = "XP3FilterDecoder *decoder = FetchXP3Decoder();"

          wrapper = text.find(wrapper_name)
          if wrapper < 0:
              raise SystemExit("XP3 extraction wrapper not found")

          managed = text.find(managed_line, wrapper)
          if managed < 0:
              raise SystemExit("FetchXP3Decoder line not found inside XP3 extraction wrapper")

          line_start = text.rfind("\n", wrapper, managed)
          if line_start < 0:
              line_start = managed
          else:
              line_start += 1

          marker = "KiriPad Phase 2A.18 - Sanoba Witch initialize.tjs diagnostics."
          if marker in text:
              raise SystemExit("Native Sanoba filter marker already present unexpectedly")

          native_block = r'''    // KiriPad Phase 2A.18 - Sanoba Witch initialize.tjs diagnostics.
              //
              // Phase 2A.16.1 proved that applying the XOR transform globally
              // still leads to a startup-script SIGSEGV.  Phase 2A.14 proved
              // data.xp3>startup.tjs runs correctly without the filter.
              //
              // Therefore bypass startup.tjs and apply the native XOR to later
              // XP3-extracted files only.  This is a diagnostic bridge toward
              // identifying which resources actually need the Kirikiroid2
              // compatibility transform.
              {
                  const std::string kiripadFileName = info->FileName.AsStdString();
                  const std::string startupName = "startup.tjs";

                  const bool kiripadIsStartup =
                      kiripadFileName == startupName ||
                      (kiripadFileName.size() >= startupName.size() &&
                       kiripadFileName.compare(
                           kiripadFileName.size() - startupName.size(),
                           startupName.size(),
                           startupName) == 0);

                  if(kiripadIsStartup) {
                      static bool kiripadStartupLogged = false;
                      if(!kiripadStartupLogged) {
                          TVPAddImportantLog(
                              TJS_W("(info) KiriPad 2A.18 bypassing XP3 XOR for startup.tjs"));
                          kiripadStartupLogged = true;
                      }
                      return;
                  }

                  const std::string initializeName = "initialize.tjs";
                  const bool kiripadIsInitialize =
                      kiripadFileName == initializeName ||
                      (kiripadFileName.size() >= initializeName.size() &&
                       kiripadFileName.compare(
                           kiripadFileName.size() - initializeName.size(),
                           initializeName.size(),
                           initializeName) == 0);

                  if(kiripadIsInitialize) {
                      static bool kiripadInitializeLogged = false;
                      if(!kiripadInitializeLogged) {
                          TVPAddImportantLog(
                              TJS_W("(info) KiriPad 2A.18 initialize.tjs reached XP3 filter"));
                          if(info->BufferSize > 0 &&
                             static_cast<tjs_uint8 *>(info->Buffer)[0] == (tjs_uint8)0x14) {
                              TVPAddImportantLog(
                                  TJS_W("(info) KiriPad 2A.18 initialize.tjs raw first byte is 0x14"));
                          } else {
                              TVPAddImportantLog(
                                  TJS_W("(info) KiriPad 2A.18 initialize.tjs raw first byte is not 0x14"));
                          }
                          kiripadInitializeLogged = true;
                      }
                  }

                  const tjs_uint32 h = info->FileHash;
                  tjs_uint32 k = h ^ (tjs_uint32)0x1DDB6E7A;
                  k = h ^ (tjs_uint32)0x7A ^
                      (k >> 8) ^ (k >> 16) ^ (k >> 24);

                  tjs_uint8 xorval = (tjs_uint8)(k & 0xFFu);
                  if(xorval == 0)
                      xorval = (tjs_uint8)208;

                  tjs_uint8 *p = static_cast<tjs_uint8 *>(info->Buffer);
                  for(tjs_uint i = 0; i < info->BufferSize; ++i)
                      p[i] ^= xorval;

                  if(kiripadIsInitialize) {
                      static bool kiripadInitializeAfterLogged = false;
                      if(!kiripadInitializeAfterLogged) {
                          if(info->BufferSize > 0 && p[0] == (tjs_uint8)0x14) {
                              TVPAddImportantLog(
                                  TJS_W("(info) KiriPad 2A.18 initialize.tjs post-XOR first byte is 0x14"));
                          } else {
                              TVPAddImportantLog(
                                  TJS_W("(info) KiriPad 2A.18 initialize.tjs post-XOR first byte is not 0x14"));
                          }
                          kiripadInitializeAfterLogged = true;
                      }
                  }

                  static bool kiripadLogged = false;
                  if(!kiripadLogged) {
                      TVPAddImportantLog(
                          TJS_W("(info) KiriPad 2A.18 selective native Sanoba XP3 filter active"));
                      kiripadLogged = true;
                  }
                  return;
              }

          '''

          text = text[:line_start] + native_block + text[line_start:]
          path.write_text(text, encoding="utf-8")

          patched = path.read_text(encoding="utf-8")
          wrapper2 = patched.find(wrapper_name)
          native2 = patched.find(marker, wrapper2)
          managed2 = patched.find(managed_line, wrapper2)

          if not (wrapper2 >= 0 and native2 > wrapper2 and managed2 > native2):
              raise SystemExit("Native Sanoba filter was not inserted before FetchXP3Decoder")

          for token in (
              "0x1DDB6E7A",
              "p[i] ^= xorval;",
              "KiriPad 2A.18 bypassing XP3 XOR for startup.tjs",
              "KiriPad 2A.18 selective native Sanoba XP3 filter active",
              "KiriPad 2A.18 initialize.tjs reached XP3 filter",
              "initialize.tjs raw first byte is 0x14",
              "initialize.tjs post-XOR first byte is 0x14",
          ):
              if token not in patched:
                  raise SystemExit(f"Native Sanoba filter verification failed: {token}")

          print("Installed Phase 2A.18 initialize.tjs diagnostic filter.")
          print(patched[wrapper2:managed2 + len(managed_line) + 300])
          PY

      - name: Instrument minimal storage-entry trace
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("cpp/core/base/ScriptMgnIntf.cpp")
          text = path.read_text(encoding="utf-8")

          sig = re.search(
              r'void\s+TVPExecuteStorage\s*\(\s*const\s+ttstr\s*&\s*name\s*,\s*'
              r'iTJSDispatch2\s*\*\s*context\s*,\s*tTJSVariant\s*\*\s*result\s*,\s*'
              r'bool\s+isexpression\s*,\s*const\s+tjs_char\s*\*\s*modestr\s*\)',
              text,
              re.S,
          )
          if not sig:
              raise SystemExit("TVPExecuteStorage(context) signature not found")

          open_brace = text.find("{", sig.end())
          if open_brace < 0:
              raise SystemExit("TVPExecuteStorage(context) opening brace not found")

          marker = 'KiriPad 2A.19.3 TVPExecuteStorage: '
          if marker in text:
              raise SystemExit("2A.19.3 marker already present unexpectedly")

          # Deliberately insert ONLY one standalone statement at function entry.
          # Do not alter initializers, if/else bodies, stream expressions, or
          # bytecode handling.
          inject = r'''
              TVPAddImportantLog(
                  TJS_W("(info) KiriPad 2A.19.3 TVPExecuteStorage: ") + name);
          '''
          text = text[:open_brace + 1] + inject + text[open_brace + 1:]
          path.write_text(text, encoding="utf-8")

          patched = path.read_text(encoding="utf-8")
          if marker not in patched:
              raise SystemExit("Storage-entry trace verification failed")

          # Print only a small source window around the injected code so a
          # future compiler error can be diagnosed without guessing.
          pos = patched.index(marker)
          line_no = patched[:pos].count("\n") + 1
          lines = patched.splitlines()
          lo = max(0, line_no - 8)
          hi = min(len(lines), line_no + 12)
          print("===== 2A.19.3 patched ScriptMgnIntf.cpp window =====")
          for n in range(lo, hi):
              print(f"{n+1:5d}: {lines[n]}")
          print("===== end window =====")
          print("Installed Phase 2A.19.3 storage-entry trace.")
          PY

      - name: Add PackinOne compatibility aggregator
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cpp/core/plugin/ncbind.cpp")
          text = path.read_text(encoding="utf-8")

          marker = 'KiriPad 2A.22 PackinOne compat: activating'
          if marker in text:
              raise SystemExit("Phase 2A.22 PackinOne patch already present")

          needle = '''    spdlog::warn("ncbAutoRegister::LoadModule('{}'): module not found in internal plugin map",'''
          pos = text.find(needle)
          if pos < 0:
              raise SystemExit("PackinOne insertion point not found in ncbind.cpp")

          block = r'''
              // KiriPad Phase 2A.22:
              // PackinOne.dll is an aggregate Kirikiri plugin used by this title.
              // KrKr2-Next already carries several of its component plugins under
              // their original standalone module names.  When the game requests
              // PackinOne.dll, load the compatible internal components that are
              // actually present, then expose PackinOne.dll as loaded.
              if(name == ttstr(TJS_W("packinone.dll"))) {
                  spdlog::info("KiriPad 2A.22 PackinOne compat: activating");

                  const tjs_char *components[] = {
                      TJS_W("fstat.dll"),
                      TJS_W("ScriptsEx.dll"),
                      TJS_W("dirlist.dll"),
                      TJS_W("csvParser.dll"),
                      TJS_W("layerExImage.dll"),
                      TJS_W("layerExRaster.dll"),
                      TJS_W("addFont.dll"),
                      TJS_W("saveStruct.dll")
                  };

                  int available = 0;
                  int loaded = 0;
                  const int component_count =
                      static_cast<int>(sizeof(components) / sizeof(components[0]));

                  for(int i = 0; i < component_count; ++i) {
                      ttstr component(components[i]);
                      if(HasModule(component)) {
                          ++available;
                          spdlog::info(
                              "KiriPad 2A.22 PackinOne component available: '{}'",
                              component.AsStdString());
                          try {
                              if(LoadModule(component)) {
                                  ++loaded;
                                  spdlog::info(
                                      "KiriPad 2A.22 PackinOne component loaded: '{}'",
                                      component.AsStdString());
                              } else {
                                  spdlog::warn(
                                      "KiriPad 2A.22 PackinOne component load returned false: '{}'",
                                      component.AsStdString());
                              }
                          } catch(...) {
                              spdlog::error(
                                  "KiriPad 2A.22 PackinOne component threw during load: '{}'",
                                  component.AsStdString());
                              throw;
                          }
                      } else {
                          spdlog::info(
                              "KiriPad 2A.22 PackinOne component unavailable in internal map: '{}'",
                              component.AsStdString());
                      }
                  }

                  // The native Windows DLL itself cannot be loaded on iOS, but
                  // successful component registration provides its compatible API
                  // surface.  Mark the aggregate module as registered so the
                  // game's Plugins.link("PackinOne.dll") succeeds.
                  TVPRegisteredPlugins.insert(name);
                  spdlog::info(
                      "KiriPad 2A.22 PackinOne compat ready: loaded {}/{} available components",
                      loaded, available);
                  return true;
              }

          '''

          text = text[:pos] + block + text[pos:]
          path.write_text(text, encoding="utf-8")

          patched = path.read_text(encoding="utf-8")
          required = (
              "KiriPad 2A.22 PackinOne compat: activating",
              "KiriPad 2A.22 PackinOne component available:",
              "TVPRegisteredPlugins.insert(name);",
              'name == ttstr(TJS_W("packinone.dll"))',
          )
          for token in required:
              if token not in patched:
                  raise SystemExit(f"PackinOne patch verification failed: {token}")

          print("Installed Phase 2A.22 PackinOne compatibility aggregator.")
          PY

