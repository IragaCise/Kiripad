          exist_replacement = r'''tjs_uint *p = Hash.Find(name);
              if(p) return true;

          #if defined(__APPLE__)
              {
                  const ttstr kiriPad2A36cRaw =
                      KiriPad2A36cYuzuRawName(name);
                  p = Hash.Find(kiriPad2A36cRaw);

                  if(p) {
                      spdlog::info(
                          "KiriPad 2A.36d Yuzu alias exists logical='{}' raw='{}'",
                          name.AsStdString(),
                          kiriPad2A36cRaw.AsStdString());
                      return true;
                  }
              }

              if(name == TJS_W("config.tjs")) {
                  const ttstr kiriPad2A36cConfigLogical =
                      TJS_W("main/config.tjs");
                  const ttstr kiriPad2A36cConfigRaw =
                      KiriPad2A36cYuzuRawName(kiriPad2A36cConfigLogical);

                  p = Hash.Find(kiriPad2A36cConfigRaw);

                  spdlog::info(
                      "KiriPad 2A.36d Config exists probe "
                      "logical='{}' raw='{}' hit={}",
                      kiriPad2A36cConfigLogical.AsStdString(),
                      kiriPad2A36cConfigRaw.AsStdString(),
                      p ? "YES" : "NO");

                  if(p) {
                      spdlog::info(
                          "KiriPad 2A.36d Config alias exists "
                          "requested='{}' mapped='{}' raw='{}'",
                          name.AsStdString(),
                          kiriPad2A36cConfigLogical.AsStdString(),
                          kiriPad2A36cConfigRaw.AsStdString());
                      return true;
                  }
              }

              // KiriPad 2A.37 LayerEx.tjs protected auto-path probe.
              if(name == TJS_W("layerex.tjs")) {
                  const tjs_char *kiriPad2A37Candidates[] = {
                      TJS_W("main/layerex.tjs"),
                      TJS_W("system/layerex.tjs"),
                      TJS_W("data/system/layerex.tjs"),
                      TJS_W("main/system/layerex.tjs"),
                      TJS_W("script/layerex.tjs"),
                      TJS_W("scripts/layerex.tjs"),
                      TJS_W("kag/layerex.tjs"),
                  };

                  for(const tjs_char *candidate : kiriPad2A37Candidates) {
                      const ttstr logical(candidate);
                      const ttstr raw =
                          KiriPad2A36cYuzuRawName(logical);
                      p = Hash.Find(raw);

                      spdlog::info(
                          "KiriPad 2A.37 LayerEx exists probe "
                          "logical='{}' raw='{}' hit={}",
                          logical.AsStdString(),
                          raw.AsStdString(),
                          p ? "YES" : "NO");

                      if(p) {
                          spdlog::info(
                              "KiriPad 2A.37 LayerEx alias exists "
                              "requested='{}' mapped='{}' raw='{}'",
                              name.AsStdString(),
                              logical.AsStdString(),
                              raw.AsStdString());
                          return true;
                      }
                  }
              }

              // KiriPad 2A.44 generic protected storage auto-path fallback.
              {
                  const std::string requested =
                      name.AsStdString();

                  if(requested.find('/') == std::string::npos &&
                     (
                         (requested.size() >= 4 &&
                          requested.compare(
                              requested.size() - 4, 4, ".tjs") == 0) ||
                         (requested.size() >= 6 &&
                          requested.compare(
                              requested.size() - 6, 6, ".stage") == 0)
                     )) {

                      const tjs_char *prefixes[] = {
                          TJS_W("system/"),
                          TJS_W("main/"),
                          TJS_W("data/system/"),
                          TJS_W("main/system/"),
                          TJS_W("script/"),
                          TJS_W("scripts/"),
                          TJS_W("kag/"),
                      };

                      for(const tjs_char *prefix : prefixes) {
                          ttstr logical(prefix);
                          logical += name;

                          const ttstr raw =
                              KiriPad2A36cYuzuRawName(logical);
                          p = Hash.Find(raw);

                          spdlog::info(
                              "KiriPad 2A.44 AutoPath exists probe "
                              "requested='{}' logical='{}' raw='{}' hit={}",
                              requested,
                              logical.AsStdString(),
                              raw.AsStdString(),
                              p ? "YES" : "NO");

                          if(p) {
                              spdlog::info(
                                  "KiriPad 2A.44 AutoPath alias exists "
                                  "requested='{}' mapped='{}' raw='{}'",
                                  requested,
                                  logical.AsStdString(),
                                  raw.AsStdString());
                              return true;
                          }
                      }
                  }
              }
          #endif

              return false;'''

          exist_func = old_return_re.sub(exist_replacement, exist_func, count=1)
          source_text = source_text[:exist_open] + exist_func + source_text[exist_end:]

          source_path.write_text(source_text, encoding="utf-8")

          patched = source_path.read_text(encoding="utf-8")

          if "requested.find('\\\\')" in patched:
              raise SystemExit(
                  "2A.38b: unexpected backslash character check remained"
              )

          # Structural safety checks: return type must still be directly attached to
          # the method declaration, and the helper must be outside the function.
          if not create_decl_re.search(patched):
              raise SystemExit("2A.36d: CreateStream return type/signature was damaged")

          if patched.count("static ttstr KiriPad2A36cYuzuRawName") != 1:
              raise SystemExit("2A.36d: helper count is not exactly one")

          for token in (
              "KiriPad 2A.36d transparent Yuzu MD5 alias",
              "KiriPad 2A.36d Yuzu alias stream",
              "KiriPad 2A.36d Yuzu alias exists",
              "KiriPad 2A.36d Config stream probe",
              "KiriPad 2A.36d Config exists probe",
              'TJS_W("main/config.tjs")',
              "KiriPad 2A.37 LayerEx stream probe",
              "KiriPad 2A.37 LayerEx exists probe",
              'TJS_W("main/layerex.tjs")',
              "KiriPad 2A.44 AutoPath stream probe",
              "KiriPad 2A.44 AutoPath exists probe",
              'requested.size() - 6, 6, ".stage"',
              'TJS_W("system/")',
          ):
              if token not in patched:
                  raise SystemExit(f"2A.36d verification failed: {token}")

          # Verify the two known logical-name hashes in the Actions log.
          def md5_utf16le(s):
              return hashlib.md5(s.encode("utf-16le")).hexdigest()

          init_md5 = md5_utf16le("system/initialize.tjs")
          config_md5 = md5_utf16le("main/config.tjs")

          print("Installed Phase 2A.36d transparent YUZUSOFT storage aliases.")
          print(f"system/initialize.tjs -> {init_md5}")
          print(f"main/config.tjs       -> {config_md5}")

          if init_md5 != "3aad1fa7356e70bb9d78ea7159c7856b":
              raise SystemExit("2A.36d: unexpected Initialize MD5")
          if config_md5 != "df12338c864b857d035bcc1415df7bfa":
              raise SystemExit("2A.36d: unexpected Config MD5")

          # Print the final declarations as a last build-time sanity check.
          for method in ("CreateStream", "IsExistent"):
              pos = patched.find(f"tTVPArchive::{method}")
              print(f"===== 2A.36d final {method} declaration =====")
              print(patched[max(0, pos - 80):pos + 160])

          PY

      - name: Phase 2A.43b add Config-derived HistoryLayer compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("cpp/core/base/ScriptMgnIntf.cpp")
          text = path.read_text(encoding="utf-8")

          marker = "KiriPad 2A.40b HistoryLayer config-member compat"
          if marker in text:
              raise SystemExit("2A.40b marker already present unexpectedly")

          # Locate the context-taking TVPExecuteStorage overload robustly.
          sig = re.search(
              r'void\s+TVPExecuteStorage\s*\(\s*const\s+ttstr\s*&\s*name\s*,\s*'
              r'iTJSDispatch2\s*\*\s*context\s*,\s*tTJSVariant\s*\*\s*result\s*,\s*'
              r'bool\s+isexpression\s*,\s*const\s+tjs_char\s*\*\s*modestr\s*\)',
              text,
              re.S,
          )
          if not sig:
              raise SystemExit("2A.39: TVPExecuteStorage(context) signature not found")

          open_brace = text.find("{", sig.end())
          if open_brace < 0:
              raise SystemExit("2A.39: TVPExecuteStorage opening brace not found")

          # Find the matching closing brace of this overload.
          depth = 0
          close_brace = None
          for i in range(open_brace, len(text)):
              ch = text[i]
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      close_brace = i
                      break

          if close_brace is None:
              raise SystemExit("2A.39: TVPExecuteStorage closing brace not found")

          func = text[open_brace:close_brace + 1]

          # We need the text-execution branch because protected KAGEX scripts are text,
          # and the class is defined only after ExecScript has completed.
          if "TVPScriptEngine->ExecScript" not in func:
              raise SystemExit("2A.39: ExecScript call not found in TVPExecuteStorage")
          if "ttstr shortname" not in func:
              raise SystemExit("2A.39: shortname variable not found in TVPExecuteStorage")

          inject = r'''
              // KiriPad 2A.40b HistoryLayer config-member compat.
              //
              // The Sanoba KAGEX config assigns frameOpacity inside
              // HistoryLayer_config().  The loaded HistoryLayer class in this runtime
              // does not expose that member, so TJS throws "Member frameOpacity does
              // not exist".  Add the missing class member after HistoryLayer.tjs has
              // defined the class but before KAGWindow creates a HistoryLayer instance.
              //
              // Only create it when absent; do not overwrite a game-provided member.
              if(!isexpression &&
                 (shortname == TJS_W("historylayer.tjs") ||
                  shortname == TJS_W("HistoryLayer.tjs") ||
                  name == TJS_W("historylayer.tjs") ||
                  name == TJS_W("HistoryLayer.tjs"))) {

                  TVPAddImportantLog(
                      TJS_W("(info) KiriPad 2A.40b HistoryLayer config-member compat: probe"));

                  iTJSDispatch2 *kiriPad2A39Global =
                      TVPScriptEngine->GetGlobalNoAddRef();

                  const tjs_char *kiriPad2A39Classes[] = {
                      TJS_W("HistoryLayer"),
