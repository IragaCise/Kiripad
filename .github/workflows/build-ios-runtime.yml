			var names = elm.name.split(",");
			for (var i=0;i<names.count;i++) {
				var name = names[i];
				var obj;
				if (name != "" && (obj = objects[name]) !== void && obj.isUpdate()) {
					obj.syncMode = true;
				}
			}
			delete elm.name;
		} else {
			Scripts.foreach(objects, function(name,target) { if (target.isUpdate()) target.syncMode = true; });
		}

		if (!transMode && isEntryCommand) {
			return endTrans(pcd, cd, elm);
		}
	}
	
