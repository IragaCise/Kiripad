	// ------------------------------------------------------------------------------

	function getSoundTransObject(name) {
		return getParameter(name, "soundTransitions", "strans_");
	}

	/**
	 * サウンドトランジション情報の取得
     */
	function _getSoundTrans(name, elm) {
		// 名前指定で上書き
		if (name == "void" || name == "none") {
			return %[];
		}
		var info = getSoundTransObject(name);
		if (info !== void) {
			// 文字列は再起探索
			if (typeof info == "String") {
				return getSoundTrans(info, elm);
			}
			//dm("登録ずみのトランジション:" + name);
			// コピー
			var tr = Scripts.clone(info);
			// パラメータのコピー
			foreach(elm, function(name, value, elm, tr) {
				var en = soundTransitionParam[name];
				if (en !== void) {
					name = en if (typeof en == "String");
					//dm("パラメータコピー:" + name + ":" + value);
					tr[name] = value;
				}
			}, tr);
			return tr;
		}
    }

	function getSoundTrans(name, elm) {
		var ret = _getSoundTrans(name, elm);
		overwriteParam(ret, elm);
		return ret;
	}
	
