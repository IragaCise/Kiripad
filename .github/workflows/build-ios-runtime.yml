                  print("===== end vicinity =====")
              raise SystemExit(
                  f"2A.50b drawDevice OBJECT log match count={len(matches)}"
              )

          m = matches[0]
          indent = m.group("indent")

          extra_lines = [
              "",
              indent + "// KiriPad 2A.50b drawDevice ClassInstanceInfo.",
              indent + "tTJSVariantClosure kiriPad2A50DDClosure =",
              indent + "    kiriPad2A49DDValue.AsObjectClosureNoAddRef();",
              indent + "iTJSDispatch2 *kiriPad2A50DDObj =",
              indent + "    kiriPad2A50DDClosure.Object;",
              "",
              indent + "if(kiriPad2A50DDObj) {",
              indent + "    bool kiriPad2A50AnyClass = false;",
              indent + "    for(tjs_uint kiriPad2A50Index = 0;",
              indent + "        kiriPad2A50Index < 16;",
              indent + "        ++kiriPad2A50Index) {",
              indent + "        tTJSVariant kiriPad2A50ClassName;",
              indent + "        const tjs_error kiriPad2A50ClassEr =",
              indent + "            kiriPad2A50DDObj->ClassInstanceInfo(",
              indent + "                TJS_CII_GET,",
              indent + "                kiriPad2A50Index,",
              indent + "                &kiriPad2A50ClassName);",
              "",
              indent + "        if(TJS_FAILED(kiriPad2A50ClassEr))",
              indent + "            break;",
              "",
              indent + "        kiriPad2A50AnyClass = true;",
              indent + "        ttstr kiriPad2A50Line(",
              indent + '            TJS_W("(info) KiriPad 2A.50b drawDevice class=\'"));',
              indent + "        if(kiriPad2A50ClassName.Type() == tvtString) {",
              indent + "            kiriPad2A50Line += ttstr(kiriPad2A50ClassName);",
              indent + "        } else {",
              indent + '            kiriPad2A50Line += TJS_W("<non-string>");',
              indent + "        }",
              indent + '        kiriPad2A50Line += TJS_W("\'");',
              indent + "        TVPAddImportantLog(kiriPad2A50Line);",
              indent + "    }",
              "",
              indent + "    if(!kiriPad2A50AnyClass) {",
              indent + "        TVPAddImportantLog(",
              indent + '            TJS_W("(info) KiriPad 2A.50b drawDevice class=<none>"));',
              indent + "    }",
              indent + "} else {",
              indent + "    TVPAddImportantLog(",
              indent + '        TJS_W("(info) KiriPad 2A.50b drawDevice object=NULL"));',
              indent + "}",
          ]

          extra = "\n".join(extra_lines)
          script = script[:m.end()] + extra + script[m.end():]
          script_path.write_text(script, encoding="utf-8")

          # ---------------------------------------------------------------------------
          # B) Trace actual archive opens for scenario/image/audio assets.
          #    CreateStream() proves an asset was really consumed, not merely searchable.
          # ---------------------------------------------------------------------------
          archive_path = None
          archive = None
          for p in Path("cpp").rglob("*.cpp"):
              try:
                  body = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              if (
                  "tTVPArchive::CreateStream" in body
                  and "CreateStreamByIndex" in body
                  and "KiriPad 2A.36d transparent Yuzu MD5 alias" in body
              ):
                  archive_path = p
                  archive = body
                  break

          if archive_path is None:
              raise SystemExit("2A.50b archive implementation not found")

          archive_marker = "KiriPad 2A.50b actual asset stream trace"
          if archive_marker in archive:
              raise SystemExit("2A.50b archive marker already present unexpectedly")

          decl = re.search(
              r"(?m)^[ \t]*tTJSBinaryStream\s*\*\s*"
              r"tTVPArchive::CreateStream\s*\(\s*const\s+ttstr\s*&\s*name\s*\)",
              archive,
          )
          if not decl:
              raise SystemExit("2A.50b CreateStream declaration not found")

          brace = archive.find("{", decl.end())
          if brace < 0:
              raise SystemExit("2A.50b CreateStream opening brace not found")

          trace = r'''
              // KiriPad 2A.50b actual asset stream trace.
          #if defined(__APPLE__)
              {
                  const std::string kiriPad2A50Name = name.AsStdString();

                  auto kiriPad2A50EndsWith =
                      [](const std::string &s, const std::string &suffix) -> bool {
                          return s.size() >= suffix.size() &&
                              s.compare(
                                  s.size() - suffix.size(),
                                  suffix.size(),
                                  suffix) == 0;
                      };

                  const bool kiriPad2A50Interesting =
                      kiriPad2A50EndsWith(kiriPad2A50Name, ".ks")   ||
                      kiriPad2A50EndsWith(kiriPad2A50Name, ".tlg")  ||
                      kiriPad2A50EndsWith(kiriPad2A50Name, ".png")  ||
                      kiriPad2A50EndsWith(kiriPad2A50Name, ".jpg")  ||
                      kiriPad2A50EndsWith(kiriPad2A50Name, ".jpeg") ||
                      kiriPad2A50EndsWith(kiriPad2A50Name, ".bmp")  ||
                      kiriPad2A50EndsWith(kiriPad2A50Name, ".webp") ||
                      kiriPad2A50EndsWith(kiriPad2A50Name, ".psb")  ||
                      kiriPad2A50EndsWith(kiriPad2A50Name, ".ogg")  ||
                      kiriPad2A50EndsWith(kiriPad2A50Name, ".wav")  ||
                      kiriPad2A50EndsWith(kiriPad2A50Name, ".opus");

                  static unsigned int kiriPad2A50TraceCount = 0;
                  if(kiriPad2A50Interesting && kiriPad2A50TraceCount < 250) {
                      ++kiriPad2A50TraceCount;
                      spdlog::info(
                          "KiriPad 2A.50b asset stream #{} logical='{}'",
                          kiriPad2A50TraceCount,
                          kiriPad2A50Name);
                  }
              }
          #endif
          '''

          archive = archive[:brace + 1] + trace + archive[brace + 1:]
          archive_path.write_text(archive, encoding="utf-8")

          # ---------------------------------------------------------------------------
          # Verification.
          # ---------------------------------------------------------------------------
          script_check = script_path.read_text(encoding="utf-8")
          archive_check = archive_path.read_text(encoding="utf-8")

          for token in (
              "KiriPad 2A.50b drawDevice ClassInstanceInfo",
              "ClassInstanceInfo(",
              "TJS_CII_GET",
              "KiriPad 2A.50b drawDevice class=",
          ):
              if token not in script_check:
                  raise SystemExit(f"2A.50b ScriptMgn verification failed: {token}")

          for token in (
              "KiriPad 2A.50b actual asset stream trace",
              "KiriPad 2A.50b asset stream #",
              '".ks"',
              '".tlg"',
              '".png"',
              '".ogg"',
          ):
              if token not in archive_check:
                  raise SystemExit(f"2A.50b archive verification failed: {token}")

          print(f"2A.50b patched DrawDevice class probe: {script_path}")
          print(f"2A.50b patched asset stream trace: {archive_path}")

          PY

      - name: Phase 2A.51 inspect engine_tick and Kirikiri event pump source
        shell: bash
        run: |
          set -euo pipefail
          cd .engine-src/KrKr2-Next
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          out = Path("../../artifacts/runtime-build-logs/phase2A51-event-pump-source.txt")
          out.parent.mkdir(parents=True, exist_ok=True)

          lines_out = []

          def emit(s=""):
              s = str(s)
              print(s)
              lines_out.append(s)

          def line_no(text, pos):
              return text.count("\n", 0, pos) + 1

          def extract_function(path, func_name):
              text = path.read_text(encoding="utf-8", errors="replace")
              # Find the function name followed by '(' but avoid declarations ending in ';'.
              candidates = list(re.finditer(
                  rf"\b{re.escape(func_name)}\s*\(",
                  text
              ))
              for m in candidates:
                  brace = text.find("{", m.end())
                  semi = text.find(";", m.end())
                  if brace < 0:
                      continue
                  if semi >= 0 and semi < brace:
                      continue

                  # Walk braces while ignoring quoted strings/comments well enough for C++.
                  i = brace
                  depth = 0
                  state = "code"
                  quote = None
                  while i < len(text):
                      ch = text[i]
                      nxt = text[i+1] if i + 1 < len(text) else ""

                      if state == "code":
                          if ch == "/" and nxt == "/":
                              state = "line_comment"
                              i += 2
                              continue
                          if ch == "/" and nxt == "*":
                              state = "block_comment"
                              i += 2
                              continue
                          if ch in ('"', "'"):
                              state = "string"
                              quote = ch
                              i += 1
                              continue
                          if ch == "{":
                              depth += 1
                          elif ch == "}":
                              depth -= 1
                              if depth == 0:
                                  start = text.rfind("\n", 0, m.start()) + 1
                                  # Include a few preceding lines containing the return type.
                                  for _ in range(3):
                                      prev = text.rfind("\n", 0, max(0, start - 1))
                                      if prev < 0:
                                          break
                                      start = prev + 1
                                  return text[start:i+1], line_no(text, start)
                      elif state == "line_comment":
                          if ch == "\n":
                              state = "code"
                      elif state == "block_comment":
                          if ch == "*" and nxt == "/":
                              state = "code"
                              i += 2
                              continue
                      elif state == "string":
                          if ch == "\\":
                              i += 2
                              continue
                          if ch == quote:
                              state = "code"
                              quote = None
                      i += 1
              return None, None

          emit("===== KiriPad Phase 2A.51 Event Pump Source Probe =====")
          emit("Purpose: determine exactly what engine_tick pumps in pinned KrKr2-Next source.")
          emit()

          api = Path("bridge/engine_api/src/engine_api.cpp")
          if not api.exists():
              raise SystemExit(f"2A.51: missing {api}")

          body, start_line = extract_function(api, "engine_tick")
          if body is None:
              # Dump engine_tick vicinity before failing so Action log is useful.
              text_api = api.read_text(encoding="utf-8", errors="replace")
              p = text_api.find("engine_tick")
              if p >= 0:
                  emit("===== engine_tick vicinity (function extraction failed) =====")
                  emit(text_api[max(0, p-2500):p+6500])
              raise SystemExit("2A.51: could not extract engine_tick definition")

          emit(f"===== engine_tick definition: {api}:{start_line} =====")
          for offset, line in enumerate(body.splitlines(), start_line):
              emit(f"{offset:6d}: {line}")
          emit("===== end engine_tick definition =====")
          emit()

          # Search likely Kirikiri event/timer/async machinery.
          patterns = [
              ("deliver", re.compile(r"TVP[A-Za-z0-9_]*(?:Deliver|Process|Dispatch|Fire)[A-Za-z0-9_]*(?:Event|Events|Message|Messages|Timer|Timers)", re.I)),
              ("async", re.compile(r"(?:AsyncTrigger|tTJSNC_AsyncTrigger|TVP[A-Za-z0-9_]*Async[A-Za-z0-9_]*)", re.I)),
              ("timer", re.compile(r"(?:tTJSNC_Timer|TVP[A-Za-z0-9_]*Timer[A-Za-z0-9_]*|TimerThread|TimerEvent)", re.I)),
              ("continuous", re.compile(r"(?:ContinuousHandler|ContinuousEvent|TVP[A-Za-z0-9_]*Continuous[A-Za-z0-9_]*)", re.I)),
              ("idle", re.compile(r"(?:ApplicationIdle|OnIdle|IdleEvent|TVP[A-Za-z0-9_]*Idle[A-Za-z0-9_]*)", re.I)),
              ("eventintf", re.compile(r"(?:EventIntf|TVPPostEvent|TVPCancelSourceEvents|TVPInvokeEvents|TVPEventQueue)", re.I)),
          ]

          source_files = []
          for base in (Path("bridge"), Path("cpp")):
              if not base.exists():
                  continue
              for p in base.rglob("*"):
                  if p.suffix.lower() not in {".cpp", ".cc", ".c", ".h", ".hpp", ".mm"}:
                      continue
                  source_files.append(p)

          emit("===== event/timer/async source matches =====")
          seen = set()
          total = 0
          MAX_TOTAL = 700
          for p in sorted(source_files, key=lambda x: str(x)):
              try:
                  src_text = p.read_text(encoding="utf-8", errors="replace")
              except Exception:
                  continue
              for no, line in enumerate(src_text.splitlines(), 1):
                  labels = []
                  for label, rx in patterns:
                      if rx.search(line):
                          labels.append(label)
                  if not labels:
                      continue
                  key = (str(p), no, line)
                  if key in seen:
                      continue
                  seen.add(key)
                  emit(f"{p}:{no}: [{','.join(labels)}] {line}")
                  total += 1
                  if total >= MAX_TOTAL:
                      emit(f"... truncated at {MAX_TOTAL} matches ...")
                      break
              if total >= MAX_TOTAL:
                  break
          emit(f"===== event source match count shown={total} =====")
          emit()

          # Extract a handful of especially relevant definitions if they exist.
          candidate_functions = [
              "TVPDeliverContinuousEvent",
              "TVPInvokeEvents",
              "TVPProcessEvents",
              "TVPProcessEvent",
              "TVPProcessMessages",
              "TVPApplicationIdle",
              "TVPFireTimerEvent",
              "TVPProcessTimerEvents",
          ]

          emit("===== candidate event function definitions =====")
          found_defs = 0
          for name in candidate_functions:
              found_this = False
              for p in source_files:
                  try:
                      src_text = p.read_text(encoding="utf-8", errors="replace")
                  except Exception:
                      continue
                  if name not in src_text:
                      continue
                  func, ln = extract_function(p, name)
                  if func is not None:
                      emit(f"----- {name}: {p}:{ln} -----")
                      for offset, line in enumerate(func.splitlines(), ln):
                          emit(f"{offset:6d}: {line}")
                      emit(f"----- end {name} -----")
                      found_defs += 1
                      found_this = True
                      break
              if not found_this:
                  emit(f"{name}: definition not found by probe")
          emit(f"===== candidate definitions found={found_defs} =====")
          emit()

          # Show includes and direct calls in engine_api.cpp around event-ish names.
          api_text = api.read_text(encoding="utf-8", errors="replace")
          emit("===== event-related engine_api.cpp lines =====")
          eventish = re.compile(
              r"(Event|Timer|Async|Idle|Continuous|Deliver|ProcessMessage|Invoke)",
              re.I,
          )
          count_api = 0
          for no, line in enumerate(api_text.splitlines(), 1):
              if eventish.search(line):
                  emit(f"{api}:{no}: {line}")
                  count_api += 1
          emit(f"===== engine_api event-ish line count={count_api} =====")

          out.write_text("\n".join(lines_out) + "\n", encoding="utf-8")
          print(f"2A.51 source report saved: {out}")

          PY

      - name: Configure and build upstream iOS engine only
        shell: bash
        run: |
          set -u
          ROOT="$PWD"
          ENGINE="$ROOT/.engine-src/KrKr2-Next"
          LOGDIR="$ROOT/artifacts/runtime-build-logs"
          mkdir -p "$LOGDIR"

          BREW_PREFIX="$(brew --prefix)"
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          LIBTOOL_PREFIX="$(brew --prefix libtool)"
          AUTOCONF_ARCHIVE_PREFIX="$(brew --prefix autoconf-archive)"
          BISON_PREFIX="$(brew --prefix bison)"
          TOOL_SHIMS="${KIRIPAD_TOOL_SHIMS:-$RUNNER_TEMP/kiripad-tools}"

          export PATH="$TOOL_SHIMS:$GETTEXT_PREFIX/bin:$BISON_PREFIX/bin:$BREW_PREFIX/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export ACLOCAL_PATH="$AUTOCONF_ARCHIVE_PREFIX/share/aclocal:$GETTEXT_PREFIX/share/aclocal:$LIBTOOL_PREFIX/share/aclocal:$BREW_PREFIX/share/aclocal${ACLOCAL_PATH:+:$ACLOCAL_PATH}"
          hash -r

          cd "$ENGINE"

          # Upstream CMakeLists.txt consumes VCPKG_ROOT before project().
          if [[ ! -d .devtools/vcpkg/.git ]]; then
            mkdir -p .devtools
            git clone https://github.com/microsoft/vcpkg.git .devtools/vcpkg
            (cd .devtools/vcpkg && ./bootstrap-vcpkg.sh -disableMetrics)
          fi
          export VCPKG_ROOT="$PWD/.devtools/vcpkg"
          echo "VCPKG_ROOT=$VCPKG_ROOT" | tee "$LOGDIR/environment.txt"
          echo "PATH=$PATH" >> "$LOGDIR/environment.txt"
          echo "ACLOCAL_PATH=$ACLOCAL_PATH" >> "$LOGDIR/environment.txt"
          cmake --version >> "$LOGDIR/environment.txt" 2>&1 || true
          ninja --version >> "$LOGDIR/environment.txt" 2>&1 || true

          set +e
          cmake --preset "iOS Release Config" 2>&1 | tee "$LOGDIR/configure.log"
          CONFIG_STATUS=${PIPESTATUS[0]}
          if [[ $CONFIG_STATUS -ne 0 ]]; then
            echo "CMake configure failed with status $CONFIG_STATUS"
            exit $CONFIG_STATUS
          fi

          cmake --build --preset "iOS Release Build" -- -j4 2>&1 | tee "$LOGDIR/build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [[ $BUILD_STATUS -ne 0 ]]; then
            echo "CMake build failed with status $BUILD_STATUS"
            echo "===== likely fatal lines ====="
            grep -nE '(^|[^A-Za-z])(fatal error:|error:|FAILED:|Undefined symbols|ld: |clang: error|CMake Error)' "$LOGDIR/build.log" | tail -n 120 || true
            echo "===== build.log tail ====="
            tail -n 160 "$LOGDIR/build.log" || true
            exit $BUILD_STATUS
          fi

          CMAKE_BUILD_DIR="$PWD/out/ios/release"
          ENGINE_LIB="$CMAKE_BUILD_DIR/bridge/engine_api/libengine_api.a"
          if [[ ! -f "$ENGINE_LIB" ]]; then
            echo "Engine static library not found: $ENGINE_LIB"
            find "$CMAKE_BUILD_DIR" -name '*.a' -print | tee "$LOGDIR/static-libraries.txt" || true
            exit 1
          fi

          echo "Engine API archive: $ENGINE_LIB"

          # Reproduce only upstream Step 2 (archive merge). We deliberately do
          # not build the upstream Flutter app; KiriPad is our iOS host.
          PLUGIN_LIBS_DIR="$PWD/bridge/flutter_engine_bridge/ios/Libs"
          mkdir -p "$PLUGIN_LIBS_DIR"
          MERGE_TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$MERGE_TMPDIR"' EXIT

          PROJECT_LIBS=()
          while IFS= read -r -d '' lib; do PROJECT_LIBS+=("$lib"); done < <(
            find "$CMAKE_BUILD_DIR" -name '*.a' \
              -not -path '*/vcpkg_installed/*' \
              -not -path '*/cpp/plugins/*' -print0
          )
          printf '%s\n' "${PROJECT_LIBS[@]}" > "$LOGDIR/project-libraries.txt"
          if [[ ${#PROJECT_LIBS[@]} -eq 0 ]]; then
            echo "No project static libraries found."
            exit 1
          fi

          /usr/bin/libtool -static -o "$MERGE_TMPDIR/libengine_project_base.a" "${PROJECT_LIBS[@]}"
          ar t "$MERGE_TMPDIR/libengine_project_base.a" | sort -u > "$MERGE_TMPDIR/project_objs.txt"

          UNIQUE_OBJS=()
          while IFS= read -r -d '' sublib; do
            sublibname="$(basename "$sublib" .a)"
            extractdir="$MERGE_TMPDIR/extract_${sublibname}"
            mkdir -p "$extractdir"
            (cd "$extractdir" && ar x "$sublib")
            for obj in "$extractdir"/*.o; do
              [[ -f "$obj" ]] || continue
              objname="$(basename "$obj")"
              if ! grep -qx "$objname" "$MERGE_TMPDIR/project_objs.txt"; then
                UNIQUE_OBJS+=("$obj")
              fi
            done
          done < <(find "$CMAKE_BUILD_DIR/cpp/plugins" -mindepth 3 -name '*.a' -print0 2>/dev/null)

          if [[ ${#UNIQUE_OBJS[@]} -gt 0 ]]; then
            /usr/bin/libtool -static -o "$PLUGIN_LIBS_DIR/libengine_project.a" \
              "$MERGE_TMPDIR/libengine_project_base.a" "${UNIQUE_OBJS[@]}"
          else
            cp "$MERGE_TMPDIR/libengine_project_base.a" "$PLUGIN_LIBS_DIR/libengine_project.a"
          fi

          VCPKG_LIB_DIR="$CMAKE_BUILD_DIR/vcpkg_installed/arm64-ios/lib"
          VCPKG_EXCLUDE_RE='^(libpng\.a|libjpeg\.a|libwebpdecoder\.a|libharfbuzz-subset\.a)$'
          VCPKG_LIBS=()
          while IFS= read -r -d '' lib; do
            base="$(basename "$lib")"
            [[ "$base" =~ $VCPKG_EXCLUDE_RE ]] && continue
            VCPKG_LIBS+=("$lib")
          done < <(find "$VCPKG_LIB_DIR" -maxdepth 1 -name '*.a' -print0)
          printf '%s\n' "${VCPKG_LIBS[@]}" > "$LOGDIR/vendor-libraries.txt"
          if [[ ${#VCPKG_LIBS[@]} -eq 0 ]]; then
            echo "No vcpkg static libraries found."
            exit 1
          fi
          /usr/bin/libtool -static -o "$PLUGIN_LIBS_DIR/libengine_vendors.a" "${VCPKG_LIBS[@]}"

          cd "$ROOT"
          mkdir -p Vendor/KrKr2Next/Libs
          cp "$ENGINE/bridge/flutter_engine_bridge/ios/Libs/libengine_project.a" Vendor/KrKr2Next/Libs/
          cp "$ENGINE/bridge/flutter_engine_bridge/ios/Libs/libengine_vendors.a" Vendor/KrKr2Next/Libs/
          ls -lh Vendor/KrKr2Next/Libs/*.a

          # Verify that the patched StorageImpl object is actually present in the
          # static archive that KiriPad will link.
          ENGINE_STRINGS="$RUNNER_TEMP/kiripad-engine-project-strings.txt"
          strings Vendor/KrKr2Next/Libs/libengine_project.a > "$ENGINE_STRINGS"
          if ! grep -Fq "KiriPad 2A.14 Documents-anchor recovery" "$ENGINE_STRINGS"; then
            echo "ERROR: merged engine archive does not contain the Phase 2A.14 Documents-anchor marker"
            grep -F "KiriPad 2A.14" "$ENGINE_STRINGS" | head -n 80 || true
            exit 1
          fi
          echo "Phase 2A.14 engine archive marker confirmed."

      - name: Phase 2A.51 inspect merged engine event symbols
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Vendor/KrKr2Next/Libs/libengine_project.a"
          REPORT="artifacts/runtime-build-logs/phase2A51-event-pump-symbols.txt"
          mkdir -p "$(dirname "$REPORT")"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "ERROR: merged engine archive missing: $ARCHIVE"
            exit 1
          fi

          {
            echo "===== KiriPad Phase 2A.51 merged engine event symbols ====="
            echo "archive=$ARCHIVE"
            echo
            echo "===== nm matches ====="
            nm "$ARCHIVE" 2>/dev/null \
              | grep -Ei 'TVP.*(Event|Timer|Async|Idle|Continuous|Deliver|Invoke|Message)|AsyncTrigger|ContinuousHandler|tTJSNC_Timer' \
              | head -n 800 || true
            echo
            echo "===== object names likely containing event code ====="
            ar t "$ARCHIVE" \
              | grep -Ei '(Event|Timer|Async|Application|Window|System|Main)' \
              | head -n 400 || true
          } | tee "$REPORT"

          echo "2A.51 symbol report saved: $REPORT"

      - name: Force-install Phase 2A.14 Documents-path runtime host
        shell: bash
        run: |
          set -euo pipefail
          cat > App/EngineRuntimeHost.mm <<'OBJC'
          #import "EngineRuntimeHost.h"
          #import <QuartzCore/QuartzCore.h>
          
          #if KIRIPAD_ENGINE_LINKED
          #include "EngineApiABI.hpp"
          #endif
          
          #include <algorithm>
          #include <atomic>
          #include <vector>
          
          static NSString * const KiriPadRuntimeErrorDomain = @"KiriPadRuntime";
          
          @interface EngineRuntimeHost () {
          #if KIRIPAD_ENGINE_LINKED
              engine_handle_t _engine;
              CADisplayLink *_displayLink;
              uint64_t _lastFrameSerial;
              BOOL _startupSuccessLogged;
              uint64_t _tickCount;
              uint64_t _framesDelivered;
              uint32_t _frameDiagBudget;
          #endif
              std::atomic_bool _runningAtomic;
          }
          @end
          
          @implementation EngineRuntimeHost
          
          + (BOOL)isEngineLinked {
          #if KIRIPAD_ENGINE_LINKED
              return YES;
          #else
              return NO;
          #endif
          }
          
          + (NSString *)backendDescription {
          #if KIRIPAD_ENGINE_LINKED
              return @"KrKr2-Next engine_api (experimental iOS runtime)";
          #else
              return @"ランタイム未リンク版（診断・起動前プローブのみ）";
          #endif
          }
          
          - (instancetype)init {
              self = [super init];
              if (self) {
                  _runningAtomic.store(false);
          #if KIRIPAD_ENGINE_LINKED
                  _engine = nullptr;
                  _displayLink = nil;
                  _lastFrameSerial = 0;
                  _startupSuccessLogged = NO;
                  _tickCount = 0;
                  _framesDelivered = 0;
                  _frameDiagBudget = 12;
          #endif
              }
              return self;
          }
          
          - (BOOL)isRunning {
              return _runningAtomic.load();
          }
          
          - (void)notifyLog:(NSString *)text {
              if (!text.length) return;
              if (NSThread.isMainThread) {
                  id<EngineRuntimeHostDelegate> delegate = self.delegate;
                  if (delegate) [delegate engineRuntimeHost:self didAppendLog:text];
                  return;
              }
              dispatch_async(dispatch_get_main_queue(), ^{
                  id<EngineRuntimeHostDelegate> delegate = self.delegate;
                  if (delegate) [delegate engineRuntimeHost:self didAppendLog:text];
              });
          }
          
          - (void)notifyRunning:(BOOL)running {
              _runningAtomic.store(running);
              if (NSThread.isMainThread) {
                  id<EngineRuntimeHostDelegate> delegate = self.delegate;
                  if (delegate) [delegate engineRuntimeHost:self didChangeRunning:running];
                  return;
              }
              dispatch_async(dispatch_get_main_queue(), ^{
                  id<EngineRuntimeHostDelegate> delegate = self.delegate;
                  if (delegate) [delegate engineRuntimeHost:self didChangeRunning:running];
              });
          }
          
          #if KIRIPAD_ENGINE_LINKED
          - (NSString *)lastEngineError {
              if (!_engine) return @"engine handle is null";
              const char *msg = engine_get_last_error(_engine);
              if (!msg || !*msg) return @"(no detail)";
              return [NSString stringWithUTF8String:msg] ?: @"(invalid UTF-8 error)";
          }
          
          - (void)drainStartupLogs {
              if (!_engine) return;
              char buffer[16384];
              uint32_t written = 0;
              for (int i = 0; i < 8; ++i) {
                  written = 0;
                  const auto result = engine_drain_startup_logs(_engine, buffer, sizeof(buffer) - 1, &written);
                  if (result != ENGINE_RESULT_OK || written == 0) break;
                  buffer[std::min<uint32_t>(written, sizeof(buffer) - 1)] = '\0';
                  NSString *line = [[NSString alloc] initWithBytes:buffer length:written encoding:NSUTF8StringEncoding];
                  if (line.length) [self notifyLog:line];
                  if (written < sizeof(buffer) - 1) break;
              }
          }
          
          - (void)captureFrameIfAvailable {
              if (!_engine) return;
              engine_frame_desc_t desc{};
              desc.struct_size = sizeof(desc);
              const auto descResult = engine_get_frame_desc(_engine, &desc);
              if (descResult != ENGINE_RESULT_OK) {
                  if (_frameDiagBudget > 0) {
                      --_frameDiagBudget;
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] frame_desc result=%d error=%@\n", (int)descResult, [self lastEngineError]]];
                  }
                  return;
              }
              if (desc.width == 0 || desc.height == 0 || desc.stride_bytes == 0) {
                  if (_frameDiagBudget > 0) {
                      --_frameDiagBudget;
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] frame_desc empty width=%u height=%u stride=%u format=%u serial=%llu\n", desc.width, desc.height, desc.stride_bytes, desc.pixel_format, (unsigned long long)desc.frame_serial]];
                  }
                  return;
              }
              if (desc.pixel_format != ENGINE_PIXEL_FORMAT_RGBA8888) {
                  if (_frameDiagBudget > 0) {
                      --_frameDiagBudget;
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] unsupported frame format=%u size=%ux%u stride=%u serial=%llu\n", desc.pixel_format, desc.width, desc.height, desc.stride_bytes, (unsigned long long)desc.frame_serial]];
                  }
                  return;
              }
              if (desc.frame_serial != 0 && desc.frame_serial == _lastFrameSerial) return;

              const size_t bytes = static_cast<size_t>(desc.stride_bytes) * desc.height;
              if (bytes == 0 || bytes > 256ull * 1024ull * 1024ull) {
                  if (_frameDiagBudget > 0) {
                      --_frameDiagBudget;
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] invalid frame byte count=%llu\n", (unsigned long long)bytes]];
                  }
                  return;
              }
              std::vector<uint8_t> storage(bytes);
              const auto readResult = engine_read_frame_rgba(_engine, storage.data(), storage.size());
              if (readResult != ENGINE_RESULT_OK) {
                  if (_frameDiagBudget > 0) {
                      --_frameDiagBudget;
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] frame_read result=%d serial=%llu error=%@\n", (int)readResult, (unsigned long long)desc.frame_serial, [self lastEngineError]]];
                  }
                  return;
              }
              _lastFrameSerial = desc.frame_serial;
              ++_framesDelivered;

              const uint32_t width = desc.width;
              const uint32_t height = desc.height;
              const uint32_t stride = desc.stride_bytes;
              NSData *frameData = [NSData dataWithBytes:storage.data() length:storage.size()];

              CGColorSpaceRef cs = CGColorSpaceCreateDeviceRGB();
              CGDataProviderRef provider = CGDataProviderCreateWithCFData((__bridge CFDataRef)frameData);
              CGBitmapInfo bitmapInfo = kCGBitmapByteOrder32Big | kCGImageAlphaLast;
              CGImageRef cg = CGImageCreate(width, height, 8, 32, stride, cs, bitmapInfo,
                                           provider, nullptr, false, kCGRenderingIntentDefault);
              UIImage *image = cg ? [UIImage imageWithCGImage:cg] : nil;
              if (cg) CGImageRelease(cg);
              CGDataProviderRelease(provider);
              CGColorSpaceRelease(cs);

              if (_framesDelivered <= 5 || (_framesDelivered % 120) == 0) {
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] frame delivered #%llu serial=%llu size=%ux%u stride=%u image=%@\n", (unsigned long long)_framesDelivered, (unsigned long long)desc.frame_serial, width, height, stride, image ? @"YES" : @"NO"]];
              }

              if (image) {
                  id<EngineRuntimeHostDelegate> delegate = self.delegate;
                  if (delegate) [delegate engineRuntimeHost:self didProduceImage:image pixelSize:CGSizeMake(width, height)];
              }
          }

          - (void)stopOnOwnerThread {
              NSAssert(NSThread.isMainThread, @"KrKr2 engine owner thread must be the main thread in Phase 2A.14");
              if (_displayLink) {
                  [_displayLink invalidate];
                  _displayLink = nil;
              }
              if (_engine) {
                  [self drainStartupLogs];
                  engine_destroy(_engine);
                  _engine = nullptr;
              }
              _lastFrameSerial = 0;
              _startupSuccessLogged = NO;
              _tickCount = 0;
              _framesDelivered = 0;
              _frameDiagBudget = 12;
              [self notifyRunning:NO];
          }
          
          - (void)displayLinkFired:(CADisplayLink *)link {
              (void)link;
              NSAssert(NSThread.isMainThread, @"KrKr2 tick moved off engine owner thread");
              if (!_engine || !_runningAtomic.load()) return;
              ++_tickCount;
          
              const auto tickResult = engine_tick(_engine, 16);
              [self drainStartupLogs];
          
              uint32_t startupState = ENGINE_STARTUP_STATE_IDLE;
              const auto stateResult = engine_get_startup_state(_engine, &startupState);
              if (stateResult != ENGINE_RESULT_OK) {
                  [self notifyLog:[NSString stringWithFormat:@"\n[Phase2A.14] engine_get_startup_state error=%d: %@\n", (int)stateResult, [self lastEngineError]]];
                  [self stopOnOwnerThread];
                  return;
              }
          
              if (startupState == ENGINE_STARTUP_STATE_FAILED) {
                  [self notifyLog:[NSString stringWithFormat:@"\n[Phase2A.14] startup FAILED (state=%u, tick=%d): %@\n", startupState, (int)tickResult, [self lastEngineError]]];
                  [self captureFrameIfAvailable];
                  [self stopOnOwnerThread];
                  return;
              }
          
              if (startupState == ENGINE_STARTUP_STATE_SUCCEEDED && !_startupSuccessLogged) {
                  _startupSuccessLogged = YES;
                  [self notifyLog:@"\n[Phase2A.14] startup SUCCEEDED — entering frame loop\n"];
              }
              if (_startupSuccessLogged && (_tickCount <= 5 || (_tickCount % 120) == 0)) {
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] heartbeat tick=%llu tickResult=%d startupState=%u frames=%llu lastSerial=%llu\n", (unsigned long long)_tickCount, (int)tickResult, startupState, (unsigned long long)_framesDelivered, (unsigned long long)_lastFrameSerial]];
              }
          
              if (tickResult != ENGINE_RESULT_OK && tickResult != ENGINE_RESULT_INVALID_STATE) {
                  [self notifyLog:[NSString stringWithFormat:@"\n[Phase2A.14] engine_tick error=%d: %@\n", (int)tickResult, [self lastEngineError]]];
              }
              [self captureFrameIfAvailable];
          }
          #endif
          
          - (BOOL)startGameAtURL:(NSURL *)gameRoot error:(NSError **)error {
          #if !KIRIPAD_ENGINE_LINKED
              if (error) {
                  *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:1
                                           userInfo:@{NSLocalizedDescriptionKey: @"このIPAはランタイム未リンク版です。Phase 2A Runtime workflowでビルドしてください。"}];
              }
              return NO;
          #else
              // KrKr2-Next engine_api binds an engine handle to the exact OS thread that
              // called engine_create().  A serial GCD queue is NOT enough: GCD may run
              // successive blocks on different worker threads.  Phase 2A.14 therefore
              // owns the engine on UIKit's main thread and drives it with CADisplayLink.
              if (!NSThread.isMainThread) {
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:4 userInfo:@{NSLocalizedDescriptionKey:@"KiriPad Phase 2A.14 はメインスレッドから起動する必要があります。"}];
                  return NO;
              }
              if (!gameRoot.isFileURL) {
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:2 userInfo:@{NSLocalizedDescriptionKey:@"ゲームルートがファイルURLではありません。"}];
                  return NO;
              }
              if (_runningAtomic.exchange(true)) {
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:3 userInfo:@{NSLocalizedDescriptionKey:@"ランタイムはすでに起動中です。"}];
                  return NO;
              }
          
              NSString *rootPath = gameRoot.path;
              NSFileManager *fm = NSFileManager.defaultManager;
              // KrKr2-Next's engine_api expects the game entry archive for ordinary
              // XP3-packaged titles.  Passing the containing directory makes
              // AutoMountXP3 treat the directory name as the project basename and it
              // looks for sibling archives in Documents/, which is wrong for titles
              // laid out as <game>/data.xp3.  Resolve the real on-disk spelling of
              // data.xp3 case-insensitively, then pass that archive as the engine entry.
              NSString *engineEntryPath = nil;
              BOOL rootIsDirectory = NO;
              if ([fm fileExistsAtPath:rootPath isDirectory:&rootIsDirectory] && rootIsDirectory) {
                  NSError *listError = nil;
                  NSArray<NSString *> *children = [fm contentsOfDirectoryAtPath:rootPath error:&listError];
                  for (NSString *child in children) {
                      if ([child caseInsensitiveCompare:@"data.xp3"] == NSOrderedSame) {
                          NSString *candidate = [rootPath stringByAppendingPathComponent:child];
                          BOOL candidateIsDirectory = NO;
                          if ([fm fileExistsAtPath:candidate isDirectory:&candidateIsDirectory] && !candidateIsDirectory) {
                              engineEntryPath = candidate;
                              break;
                          }
                      }
                  }
                  if (!engineEntryPath && listError) {
                      [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] data.xp3 directory scan warning: %@\n", listError.localizedDescription]];
                  }
              }
              if (!engineEntryPath && !rootIsDirectory && [[rootPath.pathExtension lowercaseString] isEqualToString:@"xp3"]) {
                  engineEntryPath = rootPath;
              }
              if (!engineEntryPath) {
                  _runningAtomic.store(false);
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:8 userInfo:@{NSLocalizedDescriptionKey:@"ゲームフォルダ内に data.xp3 が見つかりません。"}];
                  return NO;
              }

              NSString *support = NSSearchPathForDirectoriesInDomains(NSApplicationSupportDirectory, NSUserDomainMask, YES).firstObject;
              NSString *cache = NSSearchPathForDirectoriesInDomains(NSCachesDirectory, NSUserDomainMask, YES).firstObject;
              NSString *writePath = [support stringByAppendingPathComponent:@"KiriPadRuntime"];
              NSString *cachePath = [cache stringByAppendingPathComponent:@"KiriPadRuntime"];
              [fm createDirectoryAtPath:writePath withIntermediateDirectories:YES attributes:nil error:nil];
              [fm createDirectoryAtPath:cachePath withIntermediateDirectories:YES attributes:nil error:nil];
          
              [self notifyRunning:YES];
              [self notifyLog:[NSString stringWithFormat:@"\n[Phase2A.14] backend: %@\n[Phase2A.14] owner thread: main=%@\n[Phase2A.14] selected root: %@\n[Phase2A.14] engine entry: %@\n", [EngineRuntimeHost backendDescription], NSThread.isMainThread ? @"YES" : @"NO", rootPath, engineEntryPath]];
          
              uint32_t runtimeVersion = 0;
              auto versionResult = engine_get_runtime_api_version(&runtimeVersion);
              if (versionResult != ENGINE_RESULT_OK || (runtimeVersion >> 24u) != (ENGINE_API_VERSION >> 24u)) {
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:5 userInfo:@{NSLocalizedDescriptionKey:@"engine ABI mismatch"}];
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] engine ABI mismatch: runtime=0x%08x expected=0x%08x\n", runtimeVersion, ENGINE_API_VERSION]];
                  [self stopOnOwnerThread];
                  return NO;
              }
          
              engine_create_desc_t desc{};
              desc.struct_size = sizeof(desc);
              desc.api_version = ENGINE_API_VERSION;
              desc.writable_path_utf8 = writePath.UTF8String;
              desc.cache_path_utf8 = cachePath.UTF8String;
              auto createResult = engine_create(&desc, &_engine);
              if (createResult != ENGINE_RESULT_OK || !_engine) {
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:6 userInfo:@{NSLocalizedDescriptionKey:@"engine_create failed"}];
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] engine_create failed: %d\n", (int)createResult]];
                  [self stopOnOwnerThread];
                  return NO;
              }
          
              auto surfaceResult = engine_set_surface_size(_engine, 1280, 720);
              if (surfaceResult != ENGINE_RESULT_OK) {
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] engine_set_surface_size warning: %d / %@\n", (int)surfaceResult, [self lastEngineError]]];
              }
          
              auto openResult = engine_open_game_async(_engine, engineEntryPath.UTF8String, nullptr);
              if (openResult != ENGINE_RESULT_OK) {
                  NSString *detail = [self lastEngineError];
                  if (error) *error = [NSError errorWithDomain:KiriPadRuntimeErrorDomain code:7 userInfo:@{NSLocalizedDescriptionKey:detail ?: @"engine_open_game_async failed"}];
                  [self notifyLog:[NSString stringWithFormat:@"[Phase2A.14] engine_open_game_async failed: %d / %@\n", (int)openResult, detail]];
                  [self stopOnOwnerThread];
                  return NO;
              }
          
              _lastFrameSerial = 0;
              _startupSuccessLogged = NO;
              _tickCount = 0;
              _framesDelivered = 0;
              _frameDiagBudget = 12;
              _displayLink = [CADisplayLink displayLinkWithTarget:self selector:@selector(displayLinkFired:)];
              if (@available(iOS 15.0, *)) {
                  _displayLink.preferredFrameRateRange = CAFrameRateRangeMake(30.0, 60.0, 60.0);
              } else {
                  _displayLink.preferredFramesPerSecond = 60;
              }
              [_displayLink addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
              return YES;
          #endif
          }
          
          - (void)stop {
          #if KIRIPAD_ENGINE_LINKED
              if (!_runningAtomic.load()) return;
              if (!NSThread.isMainThread) {
                  dispatch_async(dispatch_get_main_queue(), ^{ [self stop]; });
                  return;
              }
              [self stopOnOwnerThread];
          #else
              [self notifyRunning:NO];
          #endif
          }
          
          - (void)sendPointerType:(NSUInteger)type x:(double)x y:(double)y pointerID:(NSInteger)pointerID {
          #if KIRIPAD_ENGINE_LINKED
              if (!_runningAtomic.load()) return;
              if (!NSThread.isMainThread) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self sendPointerType:type x:x y:y pointerID:pointerID];
                  });
                  return;
              }
              if (!_engine) return;
              engine_input_event_t event{};
              event.struct_size = sizeof(event);
              event.type = (uint32_t)type;
              event.timestamp_micros = (uint64_t)(CACurrentMediaTime() * 1000000.0);
              event.x = x;
              event.y = y;
              event.pointer_id = (int32_t)pointerID;
              event.button = 0;
              const auto inputResult = engine_send_input(_engine, &event);
              if (inputResult != ENGINE_RESULT_OK && inputResult != ENGINE_RESULT_INVALID_STATE) {
                  [self notifyLog:[NSString stringWithFormat:@"\n[Phase2A.14] engine_send_input error=%d: %@\n", (int)inputResult, [self lastEngineError]]];
              }
          #else
              (void)type; (void)x; (void)y; (void)pointerID;
          #endif
          }
          
          - (void)dealloc {
          #if KIRIPAD_ENGINE_LINKED
              if (NSThread.isMainThread && _runningAtomic.load()) {
                  [self stopOnOwnerThread];
              }
          #endif
          }
          
          @end
          OBJC
          echo "===== KiriPad runtime host verification ====="
          grep -nF "[Phase2A.14] owner thread: main=" App/EngineRuntimeHost.mm
          grep -nF "[Phase2A.14] engine entry:" App/EngineRuntimeHost.mm
          grep -nF "engine_open_game_async(_engine, engineEntryPath.UTF8String" App/EngineRuntimeHost.mm
          if grep -qF "dispatch_queue_create(\"dev.kiripad.engine\"" App/EngineRuntimeHost.mm; then
            echo "ERROR: legacy serial-GCD engine owner code is still present"
            exit 1
          fi

      - name: Phase 2A.52c run startup on engine owner thread
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          host = Path("App/EngineRuntimeHost.mm")
          header = Path(".engine-src/KrKr2-Next/bridge/engine_api/include/engine_api.h")
          archive = Path("Vendor/KrKr2Next/Libs/libengine_project.a")

          for p in (host, header, archive):
              if not p.exists():
                  raise SystemExit(f"2A.52c required file missing: {p}")

          host_text = host.read_text(encoding="utf-8")
          header_text = header.read_text(encoding="utf-8", errors="replace")
          archive_bytes = archive.read_bytes()

          marker = "KiriPad 2A.52c owner-thread synchronous startup"
          if marker in host_text:
              raise SystemExit("2A.52c marker already present unexpectedly")

          # -------------------------------------------------------------------------
          # 1) Resolve synchronous engine_open_game from the real pinned API header.
          # -------------------------------------------------------------------------
          decl_re = re.compile(
              r'\bengine_result_t\s+engine_open_game\s*\((?P<params>.*?)\)\s*;',
              re.S,
          )
          decl_matches = list(decl_re.finditer(header_text))
          if len(decl_matches) != 1:
              print("===== engine_api.h open-game declarations =====")
              for no, line in enumerate(header_text.splitlines(), 1):
                  if "open_game" in line:
                      print(f"{no}: {line}")
              raise SystemExit(
                  f"2A.52c synchronous engine_open_game declaration count="
                  f"{len(decl_matches)}"
              )

          params_text = decl_matches[0].group("params")
          depth = 0
          param_count = 1 if params_text.strip() else 0
          for ch in params_text:
              if ch == "(":
                  depth += 1
              elif ch == ")":
                  depth = max(0, depth - 1)
              elif ch == "," and depth == 0:
                  param_count += 1

          if param_count not in (2, 3):
              raise SystemExit(
                  "2A.52c unsupported engine_open_game parameter count="
                  f"{param_count}: {params_text!r}"
              )

          if b"engine_open_game" not in archive_bytes:
              raise SystemExit(
                  "2A.52c: engine_open_game symbol text not found in merged archive"
              )

          # -------------------------------------------------------------------------
          # 2) Locate the actual async startup call, independent of whitespace.
          # -------------------------------------------------------------------------
          call_re = re.compile(
              r'(?m)^(?P<indent>[ \t]*)'
              r'auto\s+openResult\s*=\s*'
              r'engine_open_game_async\s*\(\s*'
              r'_engine\s*,\s*'
              r'engineEntryPath\.UTF8String\s*,\s*'
              r'nullptr\s*\)\s*;[ \t]*$'
          )

          call_matches = list(call_re.finditer(host_text))
          if len(call_matches) != 1:
              print("===== EngineRuntimeHost.mm open-game vicinity =====")
              pos = host_text.find("engine_open_game_async")
              if pos >= 0:
                  print(host_text[max(0, pos - 900):min(len(host_text), pos + 1500)])
              else:
                  print("engine_open_game_async not found")
              print("===== end vicinity =====")
              raise SystemExit(
                  f"2A.52c async host call match count={len(call_matches)}"
              )

          call_match = call_matches[0]
          indent = call_match.group("indent")

          if param_count == 3:
              sync_call = "engine_open_game(_engine, engineEntryPath.UTF8String, nullptr)"
          else:
              sync_call = "engine_open_game(_engine, engineEntryPath.UTF8String)"

          replacement = (
              indent + "// KiriPad 2A.52c owner-thread synchronous startup\n"
              + indent + "// Keep Kirikiri initialization/TJS/KAG object creation on\n"
              + indent + "// the same OS thread that owns engine_tick().\n"
              + indent + '[self notifyLog:@"[Phase2A.52c] starting game '
                'synchronously on engine owner/main thread\\n"];\n'
              + indent + "auto openResult = " + sync_call + ";"
          )

          host_text = (
              host_text[:call_match.start()]
              + replacement
              + host_text[call_match.end():]
          )

          # Re-find the synchronous call in the updated text so subsequent targeting is
          # relative to the exact start() startup site, not to init/stop state resets.
          sync_pos = host_text.find("auto openResult = engine_open_game(")
          if sync_pos < 0:
              raise SystemExit("2A.52c: synchronous call missing after replacement")

          # Update nearby error strings only.
          tail_limit = min(len(host_text), sync_pos + 2500)
          nearby = host_text[sync_pos:tail_limit]

          nearby = nearby.replace(
              'detail ?: @"engine_open_game_async failed"',
              'detail ?: @"engine_open_game failed"',
              1,
          )
          nearby = nearby.replace(
              '[Phase2A.14] engine_open_game_async failed:',
              '[Phase2A.52c] engine_open_game failed:',
              1,
          )
          host_text = host_text[:sync_pos] + nearby + host_text[tail_limit:]

          # -------------------------------------------------------------------------
          # 3) Select the startup-state reset that occurs AFTER the open call.
          #    There are intentionally similar blocks in init(), stop(), and start().
          # -------------------------------------------------------------------------
          state_re = re.compile(
              r'(?m)^(?P<indent>[ \t]*)_lastFrameSerial\s*=\s*0\s*;\s*\n'
              r'(?P=indent)_startupSuccessLogged\s*=\s*NO\s*;\s*\n'
              r'(?P=indent)_tickCount\s*=\s*0\s*;'
          )

          all_state_matches = list(state_re.finditer(host_text))
          after_open = [m for m in all_state_matches if m.start() > sync_pos]

          if not after_open:
              print("===== 2A.52c state-block diagnostics =====")
              print(f"all matching state blocks={len(all_state_matches)}")
              print(f"sync_pos={sync_pos}")
              raise SystemExit(
                  "2A.52c: no startup-state block found after synchronous open call"
              )

          state_match = after_open[0]

          # Sanity bound: in the generated host the desired block is immediately after
          # the open-result error handling. Reject a wildly distant match.
          distance = state_match.start() - sync_pos
          if distance > 3500:
              print("===== 2A.52c suspicious state block vicinity =====")
              print(host_text[sync_pos:min(len(host_text), state_match.end() + 500)])
              raise SystemExit(
                  f"2A.52c: nearest post-open state block too far away ({distance} bytes)"
              )

          sindent = state_match.group("indent")
          state_replacement = (
              sindent + "_lastFrameSerial = 0;\n"
              + sindent + "_startupSuccessLogged = YES;\n"
              + sindent + "_tickCount = 0;\n"
              + sindent + "[self drainStartupLogs];\n"
              + sindent + '[self notifyLog:@"[Phase2A.52c] synchronous '
                'owner-thread startup SUCCEEDED — starting CADisplayLink\\n"];'
          )

          host_text = (
              host_text[:state_match.start()]
              + state_replacement
              + host_text[state_match.end():]
          )

          host.write_text(host_text, encoding="utf-8")

          # -------------------------------------------------------------------------
          # 4) Final source validation.
          # -------------------------------------------------------------------------
          check = host.read_text(encoding="utf-8")
          required = (
              marker,
              "[Phase2A.52c] starting game synchronously",
              "[Phase2A.52c] synchronous owner-thread startup SUCCEEDED",
              "auto openResult = engine_open_game(",
              "_startupSuccessLogged = YES;",
          )
          for token in required:
              if token not in check:
                  raise SystemExit(f"2A.52c verification failed: {token}")

          if re.search(
              r'engine_open_game_async\s*\(\s*_engine\s*,\s*'
              r'engineEntryPath\.UTF8String',
              check,
          ):
              raise SystemExit("2A.52c: stale async startup call remains")

          # init()/stop() must still contain NO resets; only start() becomes YES.
          no_count = len(re.findall(r'_startupSuccessLogged\s*=\s*NO\s*;', check))
          yes_count = len(re.findall(r'_startupSuccessLogged\s*=\s*YES\s*;', check))
          if no_count < 2 or yes_count != 1:
              raise SystemExit(
                  f"2A.52c unexpected startup flag counts: NO={no_count} YES={yes_count}"
              )

          print(f"2A.52c synchronous API declaration: YES ({param_count} params)")
          print("2A.52c merged archive engine_open_game symbol text: YES")
          print("2A.52c async startup call matched: YES")
          print(
              "2A.52c nearest post-open state block selected: YES "
              f"(distance={distance} bytes, total similar blocks={len(all_state_matches)})"
          )
          print(f"2A.52c startup flag counts after patch: NO={no_count} YES={yes_count}")
          print("2A.52c host switched async -> synchronous owner-thread startup: YES")

          PY

      - name: Verify Phase 2A.50c markers in merged engine archive
        shell: bash
        run: |
          set -euo pipefail

          ENGINE_ARCHIVE="Vendor/KrKr2Next/Libs/libengine_project.a"
          if [[ ! -f "$ENGINE_ARCHIVE" ]]; then
            echo "ERROR: merged engine archive not found: $ENGINE_ARCHIVE"
            find Vendor/KrKr2Next -maxdepth 3 -type f -print || true
            exit 1
          fi

          python3 - "$ENGINE_ARCHIVE" <<'PY'
          from pathlib import Path
          import sys

          archive = Path(sys.argv[1])
          data = archive.read_bytes()

          markers = [
              # TJS_W literal: usually UTF-32LE on Apple, but check all forms.
              "KiriPad 2A.50b drawDevice class=",
              # spdlog literal: plain narrow string.
              "KiriPad 2A.50b asset stream #",
          ]

          for marker in markers:
              encodings = {
                  "ASCII": marker.encode("ascii"),
                  "UTF-16LE": marker.encode("utf-16le"),
                  "UTF-32LE": marker.encode("utf-32le"),
              }
              hits = [
                  encoding
                  for encoding, needle in encodings.items()
                  if needle in data
              ]
              if not hits:
                  raise SystemExit(
                      "ERROR: Phase 2A.50c marker missing from merged "
                      f"engine archive: {marker}"
                  )
              print(
                  f"Phase 2A.50c marker confirmed in {archive}: "
                  f"{marker} [{', '.join(hits)}]"
              )
          PY

      - name: Phase 2A.48 add RGBA frame pixel diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("App/EngineRuntimeHost.mm")
          text = path.read_text(encoding="utf-8")

          marker = "KiriPad 2A.48 frame pixel probe"
          if marker in text:
              raise SystemExit("2A.48 marker already present unexpectedly")

          anchor = (
              "    ++_framesDelivered;\n\n"
              "    const uint32_t width = desc.width;\n"
              "    const uint32_t height = desc.height;\n"
              "    const uint32_t stride = desc.stride_bytes;\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"2A.48 host anchor count={text.count(anchor)}")

          replacement = r"""    ++_framesDelivered;

              const uint32_t width = desc.width;
              const uint32_t height = desc.height;
              const uint32_t stride = desc.stride_bytes;

              // KiriPad 2A.48 frame pixel probe
              // Sample raw RGBA before CoreGraphics conversion.
              if (_framesDelivered <= 5 || (_framesDelivered % 120) == 0) {
                  const uint32_t stepX = std::max<uint32_t>(1u, width / 80u);
                  const uint32_t stepY = std::max<uint32_t>(1u, height / 45u);

                  uint64_t sampleCount = 0;
                  uint64_t sumR = 0, sumG = 0, sumB = 0, sumA = 0;
                  uint64_t nonBlack = 0, alphaZero = 0, alphaFull = 0;
                  uint8_t minR = 255, minG = 255, minB = 255, minA = 255;
                  uint8_t maxR = 0, maxG = 0, maxB = 0, maxA = 0;
                  uint64_t sampleHash = 1469598103934665603ull;

                  for (uint32_t y = 0; y < height; y += stepY) {
                      const uint8_t *row =
                          storage.data() + static_cast<size_t>(y) * stride;
                      for (uint32_t x = 0; x < width; x += stepX) {
                          const uint8_t *p = row + static_cast<size_t>(x) * 4u;
                          const uint8_t r = p[0];
                          const uint8_t g = p[1];
                          const uint8_t b = p[2];
                          const uint8_t a = p[3];

                          ++sampleCount;
                          sumR += r; sumG += g; sumB += b; sumA += a;
                          minR = std::min(minR, r); maxR = std::max(maxR, r);
                          minG = std::min(minG, g); maxG = std::max(maxG, g);
                          minB = std::min(minB, b); maxB = std::max(maxB, b);
                          minA = std::min(minA, a); maxA = std::max(maxA, a);

                          if (r > 8 || g > 8 || b > 8) ++nonBlack;
                          if (a == 0) ++alphaZero;
                          if (a == 255) ++alphaFull;

                          sampleHash ^= r; sampleHash *= 1099511628211ull;
                          sampleHash ^= g; sampleHash *= 1099511628211ull;
                          sampleHash ^= b; sampleHash *= 1099511628211ull;
                          sampleHash ^= a; sampleHash *= 1099511628211ull;
                      }
                  }

                  if (sampleCount > 0) {
                      const double inv = 1.0 / static_cast<double>(sampleCount);
                      const double avgR = static_cast<double>(sumR) * inv;
                      const double avgG = static_cast<double>(sumG) * inv;
                      const double avgB = static_cast<double>(sumB) * inv;
                      const double avgA = static_cast<double>(sumA) * inv;
                      const double nonBlackPct =
                          100.0 * static_cast<double>(nonBlack) * inv;
                      const double alphaZeroPct =
                          100.0 * static_cast<double>(alphaZero) * inv;
                      const double alphaFullPct =
                          100.0 * static_cast<double>(alphaFull) * inv;

                      const uint8_t *p0 = storage.data();
                      const uint32_t cx = width / 2u;
                      const uint32_t cy = height / 2u;
                      const uint8_t *pc =
                          storage.data() +
                          static_cast<size_t>(cy) * stride +
                          static_cast<size_t>(cx) * 4u;

                      [self notifyLog:[NSString stringWithFormat:
                          @"[Phase2A.48] frame pixels #%llu serial=%llu "
                           "avgRGBA=%.1f,%.1f,%.1f,%.1f "
                           "minRGBA=%u,%u,%u,%u maxRGBA=%u,%u,%u,%u "
                           "nonBlack=%.1f%% alpha0=%.1f%% alpha255=%.1f%% "
                           "p0=%u,%u,%u,%u center=%u,%u,%u,%u "
                           "sampleHash=%016llx\n",
                          (unsigned long long)_framesDelivered,
                          (unsigned long long)desc.frame_serial,
                          avgR, avgG, avgB, avgA,
                          (unsigned)minR, (unsigned)minG,
                          (unsigned)minB, (unsigned)minA,
                          (unsigned)maxR, (unsigned)maxG,
                          (unsigned)maxB, (unsigned)maxA,
                          nonBlackPct, alphaZeroPct, alphaFullPct,
                          (unsigned)p0[0], (unsigned)p0[1],
                          (unsigned)p0[2], (unsigned)p0[3],
                          (unsigned)pc[0], (unsigned)pc[1],
                          (unsigned)pc[2], (unsigned)pc[3],
                          (unsigned long long)sampleHash]];
                  }
              }
          """

          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding="utf-8")

          patched = path.read_text(encoding="utf-8")
          required = (
              "KiriPad 2A.48 frame pixel probe",
              "[Phase2A.48] frame pixels",
              "avgRGBA=",
              "nonBlack=",
              "alpha0=",
              "alpha255=",
              "sampleHash=",
          )
          for token in required:
              if token not in patched:
                  raise SystemExit(f"2A.48 verification failed: {token}")

          print("Installed Phase 2A.48 raw RGBA frame pixel diagnostics.")

          PY

      - name: Build KiriPad with runtime linked
        shell: bash
        env:
          KIRIPAD_BUNDLE_ID: dev.kiripad.phase1
          KIRIPAD_WITH_ENGINE: "1"
        run: |
          set -euo pipefail
          rm -rf build-ios-ci .derived-data
          bash ./ci/build_unsigned_ipa.sh

          APP_BIN="$(find build-ios-ci -type f -path '*/Release-iphoneos/*.app/KiriPad' -print -quit)"
          if [[ -z "$APP_BIN" || ! -f "$APP_BIN" ]]; then
            echo "Could not locate built KiriPad executable"
            find build-ios-ci -maxdepth 5 -type f -print | tail -n 100 || true
            exit 1
          fi
          echo "Built executable: $APP_BIN"
          # Do not pipe `strings` into `grep -q` while `pipefail` is enabled.
          # grep -q exits as soon as it finds the marker, which closes the pipe;
          # macOS `strings` then reports "failed to flush output" (SIGPIPE), making
          # a successful marker match look like a failed pipeline.
          STRINGS_DUMP="$RUNNER_TEMP/kiripad-runtime-strings.txt"
          strings "$APP_BIN" > "$STRINGS_DUMP"
          if ! grep -Fq "[Phase2A.14] owner thread: main=" "$STRINGS_DUMP" || ! grep -Fq "[Phase2A.14] engine entry:" "$STRINGS_DUMP"; then
            echo "ERROR: built IPA does not contain the Phase 2A.14 runtime-host markers"
            echo "Nearby Phase2A markers found in executable:"
            grep -F "Phase2A" "$STRINGS_DUMP" | head -n 60 || true
            exit 1
          fi
          if ! grep -Fq "KiriPad 2A.14 Documents-anchor recovery" "$STRINGS_DUMP"; then
            echo "ERROR: built IPA contains the host but not the patched StorageImpl engine marker"
            grep -F "KiriPad 2A.14" "$STRINGS_DUMP" | head -n 80 || true
            exit 1
          fi
          echo "Phase 2A.14 host + patched-engine markers confirmed in built executable."

      - name: Verify Phase 2A.48/2A.49b diagnostic markers in app binary
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="$(find build-ios-ci -type f -path '*/Release-iphoneos/*.app/KiriPad' -print -quit)"
          if [[ -z "$APP_BIN" || ! -f "$APP_BIN" ]]; then
            echo "Could not locate built KiriPad executable"
            exit 1
          fi

          # Phase 2A.48 is an Objective-C NSString literal, so normal `strings`
          # can see its ASCII payload.
          STRINGS_DUMP="$RUNNER_TEMP/kiripad-2A49b-strings.txt"
          strings "$APP_BIN" > "$STRINGS_DUMP"
          if ! grep -Fq "[Phase2A.48] frame pixels" "$STRINGS_DUMP"; then
            echo "ERROR: Phase 2A.48 pixel-probe marker missing from built app"
            exit 1
          fi

          # Phase 2A.49 messages are TJS_W(...) literals.  On Apple builds these
          # are wide-character data, so ordinary `strings` is not a valid test.
          # Search the Mach-O bytes as ASCII, UTF-16LE and UTF-32LE.
          python3 - "$APP_BIN" <<'PY2'
          from pathlib import Path
          import sys

          app = Path(sys.argv[1])
          data = app.read_bytes()
          marker = "KiriPad 2A.49 DrawDevice runtime probe"

          encodings = {
              "ASCII": marker.encode("ascii"),
              "UTF-16LE": marker.encode("utf-16le"),
              "UTF-32LE": marker.encode("utf-32le"),
          }

          hits = [name for name, needle in encodings.items() if needle in data]
          if not hits:
              print("ERROR: Phase 2A.49 DrawDevice marker missing from built app")
              print("Checked encodings: " + ", ".join(encodings))
              raise SystemExit(1)

          print("Phase 2A.49 DrawDevice marker found as: " + ", ".join(hits))
          PY2

          python3 - "$APP_BIN" <<'PY'
          from pathlib import Path
          import sys

          app = Path(sys.argv[1])
          data = app.read_bytes()

          markers = [
              "KiriPad 2A.50b drawDevice class=",
              "KiriPad 2A.50b asset stream #",
          ]

          for marker in markers:
              encodings = {
                  "ASCII": marker.encode("ascii"),
                  "UTF-16LE": marker.encode("utf-16le"),
                  "UTF-32LE": marker.encode("utf-32le"),
              }
              hits = [
                  encoding
                  for encoding, needle in encodings.items()
                  if needle in data
              ]
              if not hits:
                  raise SystemExit(
                      "ERROR: Phase 2A.50c marker missing from final "
                      f"KiriPad executable: {marker}"
                  )
              print(
                  f"Phase 2A.50c final-app marker confirmed: "
                  f"{marker} [{', '.join(hits)}]"
              )
          PY

          echo "Phase 2A.48, 2A.49 and 2A.50c diagnostic markers confirmed in built app."

      - name: Verify Phase 2A.52c synchronous-startup marker in app binary
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="$(find build-ios-ci -type f -path '*/Release-iphoneos/*.app/KiriPad' -print -quit)"
          if [[ -z "$APP_BIN" || ! -f "$APP_BIN" ]]; then
            echo "ERROR: final KiriPad executable not found"
            exit 1
          fi

          if ! strings "$APP_BIN" \
            | grep -Fq "[Phase2A.52c] synchronous owner-thread startup SUCCEEDED"; then
            echo "ERROR: Phase 2A.52c marker missing from final KiriPad executable"
            exit 1
          fi

          echo "Phase 2A.52c synchronous-startup marker confirmed in final app."

      - name: Collect source metadata
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/runtime-source-info
          cp engine-commit.txt engine-source.txt artifacts/runtime-source-info/ 2>/dev/null || true
          if [[ -f .engine-src/KrKr2-Next/LICENSE ]]; then
            cp .engine-src/KrKr2-Next/LICENSE artifacts/runtime-source-info/KrKr2-Next-LICENSE.txt
          fi

      - name: Upload runtime build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KiriPad-Phase2A32-runtime-build-logs
          path: artifacts/runtime-build-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload runtime unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KiriPad-Phase2A52c-runtime-unsigned-ipa
          path: artifacts/KiriPad-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact upstream source metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KiriPad-Phase2A32-runtime-source-info
          path: artifacts/runtime-source-info
          if-no-files-found: warn
          retention-days: 14
