name: Build KiriPad iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  scanner-tests:
    name: Scanner tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run scanner tests
        run: bash ./scripts/test_scanner.sh

  ios-unsigned:
    name: iPad unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Build unsigned IPA
        env:
          KIRIPAD_BUNDLE_ID: dev.kiripad.phase1
        run: bash ./ci/build_unsigned_ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KiriPad-unsigned-ipa
          path: artifacts/KiriPad-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw app bundle
        uses: actions/upload-artifact@v4
        with:
          name: KiriPad-unsigned-app
          path: artifacts/KiriPad.app
          if-no-files-found: error
          retention-days: 14
